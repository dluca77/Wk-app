name = "wk2026-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "WK_CACHE"
id = "4f4cc7ab98fc4c01a6686003e7e2fbcf"

# Twee keer per dag automatisch verse wedstrijden + vorm ophalen.
# De football-databron heeft een streng gratis quotum — elke 3 uur met
# een groot datumvenster liep daar al snel tegenaan (HTTP 429).
[triggers]
crons = ["0 6,18 * * *"]
