<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Match Insights</title>
<style>
:root{
  --bg:#0a0e14; --bg2:#0d1219; --card:#131a24; --card2:#1a2330; --border:#242f3f;
  --text:#f1f5fa; --muted:#8a97ab; --muted2:#576174;
  --mint:#2ee6ae; --mint2:#17c497; --red:#ff5c6c; --amber:#ffb648; --blue:#4d9fff;
  --grad:linear-gradient(135deg,#2ee6ae,#4d9fff);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + var(--safe-b));overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes barGrow{from{width:0}}
@keyframes drift1{0%,100%{transform:translate(-8%,-6%) scale(1)}50%{transform:translate(6%,10%) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(10%,8%) scale(1.1)}50%{transform:translate(-8%,-10%) scale(1)}}
@keyframes drift3{0%,100%{transform:translate(-4%,10%) scale(1.05)}50%{transform:translate(8%,-8%) scale(.95)}}
@keyframes borderSheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.bg-blobs{display:none}

.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(10px + var(--safe-t)) 14px 8px;box-shadow:0 4px 14px -8px rgba(0,0,0,.45)}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;max-width:760px;margin-left:auto;margin-right:auto;width:100%}
.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em;color:var(--text);display:flex;align-items:center;gap:7px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--mint)}
.selbtn{font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:7px 14px;border-radius:6px;cursor:pointer;transition:all .12s ease;user-select:none}
.selbtn:active{transform:scale(.94)}
.selbtn.on{background:var(--mint);color:#04231b;border-color:var(--mint)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 15px;border-radius:7px;background:var(--card);color:var(--muted);font-size:14px;font-weight:600;border:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:all .15s cubic-bezier(.2,.8,.3,1)}
.tab:active{transform:scale(.94)}
.tab.on{background:var(--mint);color:#04231b;border-color:var(--mint);font-weight:700;box-shadow:0 3px 10px -3px rgba(46,230,174,.5)}
.layout{max-width:1040px;margin:0 auto;display:block}
.sidebar{display:none}
.wrap{position:relative;z-index:1;padding:10px 12px;max-width:760px;margin:0 auto}
@media (min-width:900px){
  .layout{display:flex;align-items:flex-start;gap:0;max-width:1040px}
  .sidebar{display:block;width:230px;flex:none;position:sticky;top:96px;padding:14px 10px;border-right:1px solid var(--border);max-height:calc(100vh - 96px);overflow-y:auto}
  .wrap{flex:1;max-width:none;margin:0;padding:14px 20px}
  .top-row,.tabs{max-width:1040px}
}
.sb-search{width:100%;padding:9px 11px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;margin-bottom:16px}
.sb-search:focus{outline:none;border-color:var(--mint)}
.sb-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:700;margin:0 0 8px;padding:0 4px}
.sb-list{display:flex;flex-direction:column;margin-bottom:20px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:7px;font-size:14px;color:#c7d0dd;cursor:pointer;transition:background .15s ease,padding-left .15s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent}
.sb-item:hover{background:var(--card);border-left-color:var(--mint)}
.sb-item .ico{font-size:13px;flex:none;opacity:.85}
.sb-item .cnt{margin-left:auto;color:var(--muted2);font-size:10.5px;font-weight:600}
.matchgrid{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);text-align:center;padding:64px 20px;font-size:14px;animation:fadeIn .3s ease}
.empty .big{font-size:36px;display:block;margin-bottom:12px;opacity:.6}

.comp-group{position:relative;margin-bottom:0;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 16px -10px rgba(0,0,0,.35);transition:box-shadow .18s ease}
.comp-hdr{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s ease;background:linear-gradient(180deg,var(--card2),color-mix(in srgb,var(--card2) 92%,black))}
.comp-hdr .crest{width:20px;height:20px;background:rgba(255,255,255,.05);border-radius:50%;padding:2px}
.comp-hdr:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 96%,white),var(--card2))}
.comp-hdr:active{background:rgba(255,255,255,.05)}
.crest{width:16px;height:16px;border-radius:3px;object-fit:contain;flex:none}
.comp-hdr .flag{font-size:13px;flex:none;opacity:.85}
.comp-hdr .name{flex:1;font-weight:700;font-size:14px;letter-spacing:-.005em;color:#dbe4f0}
.comp-hdr .count{color:var(--muted2);font-size:10px;font-weight:600;background:transparent;padding:0}
.comp-hdr .chev{color:var(--muted2);transition:transform .2s ease;font-size:14px}
.comp-hdr .chev.open{transform:rotate(90deg)}
.group-body{position:relative}
.card{padding:12px 14px;border-top:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s ease,transform .15s ease;position:relative;min-height:66px}
.card:hover{background:var(--card2)}
.card:active{background:rgba(255,255,255,.06);transform:scale(.995)}
@media (hover:hover){.card:hover{transform:translateY(-1px)}}
.card.sel-mode{padding-left:48px}
.card .checkbox{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:2px solid var(--muted2);transition:all .2s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center;font-size:11px}
.card .checkbox.checked{background:var(--grad);border-color:transparent;color:#04231b;font-weight:900;transform:translateY(-50%) scale(1.1);box-shadow:0 0 10px -2px rgba(46,230,174,.7)}
.card .time-col{width:46px;flex:none;font-size:13px;color:var(--muted);font-weight:700;text-align:left}
.card .time-col .livewrap{color:var(--red);font-weight:800;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.card .time-col .dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 7px 1px rgba(255,92,108,.8);animation:pulseDot 1.2s ease-in-out infinite}
.card .time-col .ft{color:var(--muted2);font-weight:700}
.card .teams{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;font-size:16px}
.trow img.crest{width:26px;height:26px;object-fit:contain;flex:none;border-radius:6px;background:rgba(255,255,255,.04);padding:2px}
.trow img.crest.hide{display:none}
.trow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5dce6}
.trow .n.w{font-weight:700;color:#fff}
.score-col{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:22px}
.score-col .s{font-size:16px;font-weight:800;line-height:1}
.pbar{display:flex;height:4px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--card2)}
.pbar div{height:100%;transition:width .6s cubic-bezier(.16,1,.3,1)}
.p1{background:var(--mint)} .px{background:var(--muted2)} .p2{background:var(--blue)}

.overlay{position:fixed;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.overlay.on{display:flex}
.modal{background:var(--bg2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--safe-b));position:relative;animation:slideUp .32s cubic-bezier(.16,1,.3,1);border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
@media (min-width:640px){
  .overlay{align-items:center}
  .modal{border-radius:22px;max-height:85vh;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal .handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px}
.modal h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.modal .sub{color:var(--muted);font-size:12px;margin-bottom:18px;font-weight:500}
.close{position:absolute;top:18px;right:18px;font-size:20px;color:var(--muted);cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card2);transition:transform .15s}
.close:active{transform:scale(.85)}
.section{margin-bottom:20px;animation:fadeInUp .3s cubic-bezier(.16,1,.3,1) backwards}
.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
.probrow{display:flex;gap:8px;margin-bottom:8px}
.probchip{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.probchip.fav{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset,0 2px 10px -4px rgba(46,230,174,.4)}
.probchip .l{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.probchip .v{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;animation:fadeInUp .3s cubic-bezier(.16,1,.3,1) backwards;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:border-color .15s ease}
.prow .pn{flex:1;font-size:13px;font-weight:600}
.prow .pp{font-size:11px;color:var(--muted2);font-weight:500;margin-top:1px}
.prow .stat{font-size:14px;font-weight:800;color:var(--mint);min-width:48px;text-align:right}
.ai{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px;font-size:13.5px;line-height:1.6;color:#dbe3ee;position:relative}
.ai.loading{color:var(--muted)}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 37%,var(--card) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:12px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,26,36,.9);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:20;padding-bottom:var(--safe-b)}
.bnbtn{flex:1;text-align:center;padding:9px 0 8px;color:var(--muted);font-size:11px;cursor:pointer;font-weight:600;transition:color .15s}
.bnbtn.on{color:var(--mint)}
.bnbtn .ic{font-size:19px;display:block;margin-bottom:2px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.bnbtn.on .ic{transform:translateY(-2px) scale(1.1)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;margin-bottom:12px;transition:border-color .15s}
.search:focus{outline:none;border-color:var(--mint)}
.fab-wrap{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b) + 10px);display:flex;justify-content:center;z-index:15;pointer-events:none}
.fab{pointer-events:auto;background:var(--mint);color:#04231b;font-weight:800;font-size:14px;padding:13px 24px;border-radius:10px;box-shadow:0 4px 16px -4px rgba(0,0,0,.5);cursor:pointer;animation:popIn .25s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:8px}
.fab:active{transform:scale(.95)}
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span><span></span></div>

<div class="top">
  <div class="top-row">
    <h1><span class="dot"></span>Match Insights</h1>
    <div class="selbtn" id="selToggle" onclick="toggleSelectMode()">Select</div>
  </div>
  <div class="tabs" id="dayTabs"></div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="wrap" id="view"></div>
</div>

<div class="fab-wrap" id="fabWrap"></div>

<div class="bottomnav">
  <div class="bnbtn on" id="nav-matches" onclick="setPage('matches')"><span class="ic">⚽</span>Matches</div>
  <div class="bnbtn" id="nav-players" onclick="setPage('players')"><span class="ic">👤</span>Players</div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal" style="position:relative"><div class="handle"></div></div>
</div>

<script>
const API = 'https://wk2026-proxy.isaak-elia.workers.dev';
let MATCHES = [], PLAYERS = [], page = 'matches', selDate = null;
let groupOpen = {};
let selectMode = false, selectedIds = new Set();

function nlToday(){
  // Wedstrijddata staat al in NL-tijd (server-side omgerekend) — "vandaag"
  // moet dus ook op NL-tijd bepaald worden, niet op UTC (anders klopt het
  // 's ochtends vroeg niet, als UTC-datum nog de vorige dag is).
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Amsterdam' });
}
function isLive(m){ return m.live || m.status === 'live'; }
function isDone(m){ return m.finished || m.status === 'played'; }
function fmtTime(t){ return t || ''; }

async function loadMatches(){
  try{
    const res = await fetch(API + '/matches');
    const d = await res.json();
    MATCHES = d.matches || [];
  }catch(e){ MATCHES = []; }
  buildDayTabs();
  buildSidebar();
  render();
}

async function loadPlayers(){
  if(PLAYERS.length) return;
  try{
    const res = await fetch(API + '/players');
    const d = await res.json();
    PLAYERS = d.players || [];
  }catch(e){ PLAYERS = []; }
}

let dayTabsInit = false;

function buildDayTabs(){
  const dates = [...new Set(MATCHES.map(m=>m.date))].sort();
  if(!dates.length){ document.getElementById('dayTabs').innerHTML = ''; return; }
  const today = nlToday();
  if(!dayTabsInit){
    // Altijd starten op vandaag (of de eerstvolgende datum erna als er
    // vandaag toevallig niks gepland staat) — nooit op de oudste datum.
    selDate = dates.includes(today) ? today : (dates.find(d => d > today) || dates[dates.length - 1]);
    dayTabsInit = true;
  } else if(!selDate || !dates.includes(selDate)){
    selDate = dates[0];
  }
  document.getElementById('dayTabs').innerHTML = dates.map(d=>{
    const label = d === today ? 'Today' : new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="tab ${d===selDate?'on':''}" onclick="selDate='${d}';render()">${label}</div>`;
  }).join('');
  document.querySelector('#dayTabs .tab.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function toggleSelectMode(){
  selectMode = !selectMode;
  if(!selectMode) selectedIds.clear();
  document.getElementById('selToggle').classList.toggle('on', selectMode);
  document.getElementById('selToggle').textContent = selectMode ? 'Cancel' : 'Select';
  render();
  renderFab();
}

function toggleSelected(apiId){
  if(selectedIds.has(apiId)) selectedIds.delete(apiId);
  else selectedIds.add(apiId);
  render();
  renderFab();
}

function renderFab(){
  const wrap = document.getElementById('fabWrap');
  if(selectMode && selectedIds.size >= 2){
    wrap.innerHTML = `<div class="fab" onclick="openMultiAnalysis()">✨ Analyze ${selectedIds.size} matches</div>`;
  } else if(selectMode && selectedIds.size === 1){
    wrap.innerHTML = `<div class="fab" style="opacity:.6">Pick at least 1 more</div>`;
  } else {
    wrap.innerHTML = '';
  }
}

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  const comps = new Map(); // name -> {count, logo}
  for(const m of MATCHES){
    const key = m.compName || 'Other';
    if(!comps.has(key)) comps.set(key, {count:0, logo:m.compLogo});
    comps.get(key).count++;
  }
  const names = [...comps.keys()].sort();
  sb.innerHTML = `
    <input class="sb-search" id="sbSearch" placeholder="Search competition…" oninput="filterSidebar(this.value)">
    <div class="sb-h">Competitions</div>
    <div class="sb-list" id="sbList">${names.map(n=>{
      const c = comps.get(n);
      const ico = c.logo ? `<img class="crest" src="${c.logo}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ico',textContent:'🌐'}))">` : `<span class="ico">🌐</span>`;
      return `<div class="sb-item" onclick="jumpToComp('${n.replace(/'/g,"\\'")}')">${ico}<span>${n}</span><span class="cnt">${c.count}</span></div>`;
    }).join('')}</div>
  `;
}

function filterSidebar(q){
  q = (q||'').toLowerCase();
  document.querySelectorAll('#sbList .sb-item').forEach(el=>{
    const name = el.textContent.toLowerCase();
    el.style.display = name.includes(q) ? '' : 'none';
  });
}

function jumpToComp(name){
  // Vind de eerstvolgende datum (vanaf vandaag) waarop deze competitie
  // wedstrijden heeft, spring daarheen en klap de groep open.
  const today = nlToday();
  const dates = [...new Set(MATCHES.filter(m=>(m.compName||'Other')===name).map(m=>m.date))].sort();
  const target = dates.find(d => d >= today) || dates[dates.length-1];
  if(!target) return;
  selDate = target;
  groupOpen[name] = true;
  buildDayTabs();
  render();
  setTimeout(()=>{
    const hdr = [...document.querySelectorAll('.comp-hdr .name')].find(el=>el.textContent===name);
    hdr?.closest('.comp-group')?.scrollIntoView({behavior:'smooth', block:'start'});
  }, 30);
}

// Vaste competitievolgorde, net als Livescore: 1) grote internationale
// toernooien (CL/EL/ECL + hun kwalificatie, WK/EK-kwalificatie), 2) de
// Europese topcompetities, 3) Eredivisie (lokale relevantie, NL-app), 4)
// de rest alfabetisch op land. Landnaam wordt afgeleid uit de ESPN-
// competitiecode (compId, bv. "eng.1" → "England") — internationale codes
// (uefa./fifa./concacaf./conmebol.) horen al bij tier 0.
const COUNTRY_BY_PREFIX = {
  eng:'England', esp:'Spain', ger:'Germany', ita:'Italy', fra:'France', ned:'Netherlands',
  bel:'Belgium', por:'Portugal', tur:'Turkey', sco:'Scotland', usa:'United States', mex:'Mexico',
  bra:'Brazil', arg:'Argentina', ksa:'Saudi Arabia', wal:'Wales', irl:'Ireland', den:'Denmark',
  swe:'Sweden', nor:'Norway', fin:'Finland', pol:'Poland', cze:'Czechia', svk:'Slovakia',
  hun:'Hungary', rou:'Romania', bul:'Bulgaria', gre:'Greece', cro:'Croatia', srb:'Serbia',
  aut:'Austria', sui:'Switzerland', ukr:'Ukraine', isr:'Israel', jpn:'Japan', kor:'South Korea',
  chn:'China', aus:'Australia', rsa:'South Africa', egy:'Egypt', mar:'Morocco', nga:'Nigeria',
  can:'Canada', chi:'Chile', col:'Colombia', per:'Peru', ecu:'Ecuador', par:'Paraguay',
  uru:'Uruguay', ven:'Venezuela', bol:'Bolivia', crc:'Costa Rica', civ:'Ivory Coast', alg:'Algeria',
  tun:'Tunisia', qat:'Qatar', uae:'United Arab Emirates', ind:'India', chn2:'China',
};
// Tier 0: CL, EL, ECL (incl. hun kwalificatie) in die exacte volgorde, dan
// interland-toernooien (WK/EK/Nations League).
const TIER0_ORDER = ['champions league', 'europa league', 'conference league'];
// Tier 1: Europese top 5, in exact deze volgorde.
const TOP5 = ['premier league', 'laliga', 'la liga', 'serie a', 'bundesliga', 'ligue 1'];
// Tier 2: lokale relevantie (NL) — Eredivisie + Keuken Kampioen Divisie.
const NL_LEAGUES = ['eredivisie', 'eerste divisie', 'keuken kampioen divisie'];

function compSortKey(compName, compId){
  const n = (compName||'').toLowerCase();
  // Vrouwenvoetbal altijd helemaal onderaan, ongeacht welke competitie —
  // overruled alle andere tiers hierboven (ook Champions League etc.).
  const isWomen = /women'?s?\b|\bfeminine|\bfrauen\b|\bdames\b|\(w\)$|\bw$/.test(n);
  if(isWomen) return `9_${n}`;
  const tier0Idx = TIER0_ORDER.findIndex(t => n.includes(t));
  if(tier0Idx !== -1) return `0${tier0Idx}_${n.includes('qualif') ? 1 : 0}_${n}`;
  const isIntlTournament = /world cup|european championship|euro qualifying|nations league/.test(n)
    || /^uefa\.|^fifa\.|^concacaf\.|^conmebol\./.test(compId||'');
  if(isIntlTournament) return `03_${n}`;
  const top5Idx = TOP5.indexOf(n);
  if(top5Idx !== -1) return `1${top5Idx}`;
  if(NL_LEAGUES.includes(n)) return `2${NL_LEAGUES.indexOf(n)}`;
  const prefix = (compId||'').split('.')[0];
  const country = COUNTRY_BY_PREFIX[prefix] || compName || 'zzz';
  return `3_${country}_${compName}`;
}

function render(){
  if(page !== 'matches') return;
  const ms = MATCHES.filter(m=>m.date===selDate).sort((a,b)=>a.time.localeCompare(b.time));
  const el = document.getElementById('view');
  if(!ms.length){ el.innerHTML = '<div class="empty"><span class="big">📭</span>No matches for this day.</div>'; return; }

  const groups = new Map();
  for(const m of ms){
    const key = m.compName || 'Other';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  const keys = [...groups.keys()].sort((a,b)=>{
    const ca = groups.get(a)[0]?.compId, cb = groups.get(b)[0]?.compId;
    return compSortKey(a,ca).localeCompare(compSortKey(b,cb));
  });
  const groupsHtml = keys.map((key, idx)=>{
    const list = groups.get(key);
    if(!(key in groupOpen)) groupOpen[key] = true;
    const open = groupOpen[key];
    const cards = list.map(m=>{
      const live = isLive(m), done = isDone(m);
      let timeHtml;
      if(live){ timeHtml = '<div class="livewrap"><span class="dot"></span>LIVE</div>'; }
      else if(done){ timeHtml = '<span class="ft">FT</span>'; }
      else { timeHtml = fmtTime(m.time); }
      const [hs,as] = m.result ? m.result.split('-') : [null,null];
      const hW = m.result && +hs > +as;
      const aW = m.result && +as > +hs;
      const checked = selectedIds.has(m.apiId);
      const clickAction = selectMode ? `toggleSelected('${m.apiId}')` : `openMatch('${m.apiId}')`;
      return `<div class="card ${selectMode?'sel-mode':''}" onclick="${clickAction}">
        ${selectMode ? `<div class="checkbox ${checked?'checked':''}">${checked?'✓':''}</div>` : ''}
        <div class="time-col">${timeHtml}</div>
        <div class="teams">
          <div class="trow">${crestImg(m.h)}<span class="n ${hW?'w':''}">${m.h}</span></div>
          <div class="trow">${crestImg(m.a)}<span class="n ${aW?'w':''}">${m.a}</span></div>
        </div>
        <div class="score-col">
          <div class="s">${hs ?? ''}</div>
          <div class="s">${as ?? ''}</div>
        </div>
      </div>`;
    }).join('');
    const compLogo = list[0]?.compLogo;
    const compIcon = compLogo
      ? `<img class="crest" src="${compLogo}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flag',textContent:'🌐'}))">`
      : `<span class="flag">🌐</span>`;
    return `<div class="comp-group" style="animation-delay:${idx*30}ms">
      <div class="comp-hdr" onclick="groupOpen['${key}']=!groupOpen['${key}'];render()">
        ${compIcon}
        <span class="name">${key}</span>
        <span class="count">${list.length}</span>
        <span class="chev ${open?'open':''}">›</span>
      </div>
      ${open ? `<div class="group-body">${cards}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="matchgrid">${groupsHtml}</div>`;
}

function teamInitials(name){
  const words = (name||'?').replace(/[^\p{L}0-9 ]/gu,'').trim().split(/\s+/);
  if(words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[words.length-1][0]).toUpperCase();
}
function teamHue(name){
  let h = 0;
  for(const c of (name||'?')) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
}
function crestFallback(team){
  const hue = teamHue(team);
  return `<span class="crest crest-fb" style="background:hsl(${hue} 45% 24%);color:hsl(${hue} 70% 78%)">${teamInitials(team)}</span>`;
}
function crestImg(team){
  const src = `${API}/crest?team=${encodeURIComponent(team)}`;
  const fb = crestFallback(team).replace(/"/g,'&quot;');
  return `<img class="crest" src="${src}" loading="lazy" onerror="this.outerHTML='${fb}'">`;
}

function probChip(label, pct, isFav){
  return `<div class="probchip ${isFav?'fav':''}"><div class="l">${label}</div><div class="v">${pct}%</div></div>`;
}

function renderPredictionBlock(target, m, d){
  const p1 = Math.round(d.model.pHome*100), px = Math.round(d.model.pDraw*100), p2 = 100-p1-px;
  const favIdx = [p1,px,p2].indexOf(Math.max(p1,px,p2));
  const cardsBadge = p => {
    let s = '';
    if(p.yellowCards) s += `<span style="color:#ffcc33">${p.yellowCards}Y</span> `;
    if(p.redCards) s += `<span style="color:#ff5c6c">${p.redCards}R</span>`;
    return s;
  };
  const POS_NAMES = {G:'Keeper',D:'Verdediger',M:'Middenvelder',F:'Aanvaller'};
  const playerRow = (p,i) => `<div class="prow" style="animation-delay:${i*35}ms">
    <div class="pn">${p.name}<div class="pp">${POS_NAMES[p.pos]||p.pos||''} · ${p.apps} wedstrijden gespeeld · ${p.goals} goals, ${p.assists} assists dit seizoen · ${p.corners||0} corners veroorzaakt ${cardsBadge(p)}</div></div>
    <div class="stat">${p.shots90}<div class="pp">schoten/90 min</div><div class="pp" style="margin-top:2px">${p.sot90} op doel/90 min</div></div>
  </div>`;
  let html = `
    <h3>Win probability</h3>
    <div class="probrow">
      ${probChip(m.h, p1, favIdx===0)}
      ${probChip('Draw', px, favIdx===1)}
      ${probChip(m.a, p2, favIdx===2)}
    </div>
    <div class="pbar"><div class="p1" style="width:0" data-w="${p1}"></div><div class="px" style="width:0" data-w="${px}"></div><div class="p2" style="width:0" data-w="${p2}"></div></div>
  `;
  target.innerHTML = html;
  requestAnimationFrame(()=>{
    target.querySelectorAll('.pbar div').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });
  let extra = '';
  if(d.players.home.length || d.players.away.length){
    const legend = `<div class="pp" style="padding:0 0 8px;color:var(--muted2)">Schoten per 90 min = gemiddeld aantal schoten per volle wedstrijd dit seizoen. Top 5 spelers per team, gesorteerd op schoten/90.</div>`;
    extra += `<div class="section"><h3>${m.h} — meeste schoten</h3>${legend}<div class="plist">${d.players.home.map(playerRow).join('') || '<div class="empty" style="padding:8px 0">Nog geen spelersdata</div>'}</div></div>`;
    extra += `<div class="section"><h3>${m.a} — meeste schoten</h3>${legend}<div class="plist">${d.players.away.map(playerRow).join('') || '<div class="empty" style="padding:8px 0">Nog geen spelersdata</div>'}</div></div>`;
  }
  return extra;
}

async function openMatch(apiId){
  const m = MATCHES.find(x=>x.apiId===apiId);
  if(!m) return;
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="handle"></div>
    <span class="close" onclick="closeModal()">✕</span>
    <h2>${m.h} vs ${m.a}</h2>
    <div class="sub">${m.compName || ''} · ${m.date} ${m.time}</div>
    <div class="section" id="predict-section">
      <h3>Win probability</h3>
      <div class="skeleton" style="height:60px"></div>
    </div>
  `;
  document.getElementById('overlay').classList.add('on');

  try{
    const res = await fetch(`${API}/predict?apiId=${encodeURIComponent(apiId)}`);
    const d = await res.json();
    if(d.error){
      document.getElementById('predict-section').innerHTML = `<h3>Win probability</h3><div class="empty" style="padding:12px 0">${d.error}</div>`;
      return;
    }
    const extra = renderPredictionBlock(document.getElementById('predict-section'), m, d);
    let html = extra;
    if(d.odds){
      const imp = v => Math.round(100/v);
      const edgeChip = (label, decOdds, modelP) => {
        const impliedPct = imp(decOdds);
        const edge = Math.round(modelP*100) - impliedPct;
        const val = edge >= 5 ? ' style="border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset"' : '';
        return `<div class="probchip"${val}><div class="l">${label}</div><div class="v">${decOdds}</div><div class="pp" style="margin-top:2px">${impliedPct}% impl.${edge>=5?` · +${edge}%`:''}</div></div>`;
      };
      html += `<div class="section"><h3>Odds (${d.odds.provider})</h3>
        <div class="probrow">
          ${edgeChip(m.h, d.odds.home, d.model.pHome)}
          ${edgeChip('Draw', d.odds.draw, d.model.pDraw)}
          ${edgeChip(m.a, d.odds.away, d.model.pAway)}
        </div>
      </div>`;
    }
    if(d.analysis){
      html += `<div class="section"><h3>Analysis</h3><div class="ai">${d.analysis}</div></div>`;
    }
    if(d.standings && d.standings.table && d.standings.table.length){
      const rows = d.standings.table.map(s=>{
        const hl = s.team===m.h || s.team===m.a;
        return `<tr style="${hl?'background:var(--card2)':''}">
          <td style="padding:6px 8px;color:var(--muted)">${s.position}</td>
          <td style="padding:6px 8px;font-weight:${hl?'700':'500'};color:${hl?'#fff':'#c7d0dd'}">${s.team}</td>
          <td style="padding:6px 8px;text-align:center;color:var(--muted)">${s.played}</td>
          <td style="padding:6px 8px;text-align:center;color:var(--muted)">${s.win}-${s.draw}-${s.loss}</td>
          <td style="padding:6px 8px;text-align:center;color:var(--muted)">${s.gd>=0?'+':''}${s.gd}</td>
          <td style="padding:6px 8px;text-align:center;font-weight:700">${s.pts}</td>
        </tr>`;
      }).join('');
      html += `<div class="section"><h3>League standing</h3>
        <div style="overflow-x:auto;border:1px solid var(--border);border-radius:10px">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="color:var(--muted2);font-size:11px;text-transform:uppercase">
            <th style="padding:6px 8px;text-align:left">#</th><th style="padding:6px 8px;text-align:left">Team</th>
            <th style="padding:6px 8px">P</th><th style="padding:6px 8px">W-D-L</th><th style="padding:6px 8px">GD</th><th style="padding:6px 8px">Pts</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
    } else if(d.standings && (d.standings.home || d.standings.away)){
      const standingRow = s => s ? `<div class="prow"><div class="pn">${s.team}<div class="pp">P${s.position||'-'} · ${s.win}-${s.draw}-${s.loss} · GD ${s.gd>=0?'+':''}${s.gd}</div></div><div class="stat">${s.pts}<div class="pp">pts</div></div></div>` : '';
      html += `<div class="section"><h3>League standing</h3><div class="plist">${standingRow(d.standings.home)}${standingRow(d.standings.away)}</div></div>`;
    }
    if(d.odds && d.odds.totalLine){
      html += `<div class="section"><h3>Goals over/under ${d.odds.totalLine}</h3><div class="probrow">
        <div class="probchip"><div class="l">Over</div><div class="v">${d.odds.overOdds}</div></div>
        <div class="probchip"><div class="l">Under</div><div class="v">${d.odds.underOdds}</div></div>
      </div></div>`;
    }
    if(d.btts){
      html += `<div class="section"><h3>Both teams to score</h3><div class="probrow">
        <div class="probchip"><div class="l">Yes</div><div class="v">${d.btts.yes}</div></div>
        <div class="probchip"><div class="l">No</div><div class="v">${d.btts.no}</div></div>
      </div></div>`;
    }
    if(d.teamGoals && (d.teamGoals.home || d.teamGoals.away)){
      const tg = (name,t) => t ? `<div class="probchip"><div class="l">${name} over ${t.line}</div><div class="v">${t.overOdds}</div></div>` : '';
      html += `<div class="section"><h3>Team goals</h3><div class="probrow">${tg(m.h,d.teamGoals.home)}${tg(m.a,d.teamGoals.away)}</div></div>`;
    }
    if(d.h2h && d.h2h.length){
      html += `<div class="section"><h3>Head to head</h3><div class="plist">${d.h2h.map(x=>`<div class="prow"><div class="pn">${x.h} vs ${x.a}<div class="pp">${x.date} · ${x.compName||''}</div></div><div class="stat" style="font-size:14px">${x.result}</div></div>`).join('')}</div></div>`;
    }
    if(d.props && (d.props.home?.length || d.props.away?.length)){
      const propRow = p => `<div class="prow">
        <div class="pn">${p.name}<div class="pp">${[
          p.anytimeScorer?`scores @${p.anytimeScorer}`:null,
          p.shots1plus?`1+ shot @${p.shots1plus}`:null,
          p.sot1plus?`1+ on target @${p.sot1plus}`:null,
          p.cardOdds?`card @${p.cardOdds}`:null,
        ].filter(Boolean).join(' · ') || 'no props'}</div></div>
      </div>`;
      html += `<div class="section"><h3>Player props (DraftKings)</h3>
        <div class="pp" style="margin-bottom:8px">${m.h}</div>
        <div class="plist">${d.props.home.map(propRow).join('') || '<div class="empty" style="padding:6px 0">No data</div>'}</div>
        <div class="pp" style="margin:12px 0 8px">${m.a}</div>
        <div class="plist">${d.props.away.map(propRow).join('') || '<div class="empty" style="padding:6px 0">No data</div>'}</div>
      </div>`;
    }
    if(d.referee){
      html += `<div class="section"><h3>Referee</h3><div class="ai" style="padding:10px 14px">${d.referee}</div></div>`;
    }
    modal.insertAdjacentHTML('beforeend', html);
  }catch(e){
    document.getElementById('predict-section').innerHTML = `<h3>Win probability</h3><div class="empty" style="padding:12px 0">Could not load prediction.</div>`;
  }
}

async function openMultiAnalysis(){
  const ids = [...selectedIds];
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="handle"></div>
    <span class="close" onclick="closeModal()">✕</span>
    <h2>✨ ${ids.length} matches compared</h2>
    <div class="sub">Combined AI analysis across your selection</div>
    <div id="multi-section">
      <div class="skeleton" style="height:80px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:60px"></div>
    </div>
  `;
  document.getElementById('overlay').classList.add('on');

  try{
    const res = await fetch(`${API}/predict-multi?ids=${ids.map(encodeURIComponent).join(',')}`);
    const d = await res.json();
    const section = document.getElementById('multi-section');
    if(d.error){ section.innerHTML = `<div class="empty" style="padding:12px 0">${d.error}</div>`; return; }
    let html = '';
    if(d.analysis){
      html += `<div class="section"><h3>Analysis</h3><div class="ai">${d.analysis}</div></div>`;
    }
    html += d.matches.map((entry,i) => {
      const p1 = Math.round(entry.model.pHome*100), px = Math.round(entry.model.pDraw*100), p2 = 100-p1-px;
      const favIdx = [p1,px,p2].indexOf(Math.max(p1,px,p2));
      return `<div class="section" style="animation-delay:${i*50}ms">
        <h3>${entry.match.h} vs ${entry.match.a}</h3>
        <div class="probrow">
          ${probChip(entry.match.h, p1, favIdx===0)}
          ${probChip('Draw', px, favIdx===1)}
          ${probChip(entry.match.a, p2, favIdx===2)}
        </div>
      </div>`;
    }).join('');
    section.innerHTML = html;
  }catch(e){
    document.getElementById('multi-section').innerHTML = `<div class="empty" style="padding:12px 0">Could not load analysis.</div>`;
  }
}

function closeModal(){ document.getElementById('overlay').classList.remove('on'); }

async function renderPlayers(){
  await loadPlayers();
  const el = document.getElementById('view');
  el.innerHTML = `<input class="search" id="playerSearch" placeholder="Search player…" oninput="filterPlayers(this.value)">
    <div class="plist" id="playerList"></div>`;
  filterPlayers('');
}

function filterPlayers(q){
  q = (q||'').toLowerCase();
  const list = PLAYERS.filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>b.shots90-a.shots90).slice(0,100);
  document.getElementById('playerList').innerHTML = list.length ? list.map((p,i)=>{
    let cards = '';
    if(p.yellowCards) cards += ` <span style="color:#ffcc33">${p.yellowCards}Y</span>`;
    if(p.redCards) cards += ` <span style="color:#ff5c6c">${p.redCards}R</span>`;
    return `
    <div class="prow" style="animation-delay:${Math.min(i,12)*30}ms">
      <div class="pn">${p.name}<div class="pp">${p.team} · ${p.compName||''} · ${p.goals}g ${p.assists}a · ${p.corners||0} corners${cards} · ${p.apps} apps</div></div>
      <div class="stat">${p.shots90}<div class="pp">sh/90 (${p.sot90} on target)</div></div>
    </div>
  `;
  }).join('') : '<div class="empty"><span class="big">🔍</span>No players found.</div>';
}

function setPage(p){
  page = p;
  document.getElementById('nav-matches').classList.toggle('on', p==='matches');
  document.getElementById('nav-players').classList.toggle('on', p==='players');
  document.getElementById('dayTabs').style.display = p==='matches' ? 'flex' : 'none';
  document.getElementById('selToggle').style.display = p==='matches' ? 'block' : 'none';
  if(p!=='matches' && selectMode) toggleSelectMode();
  if(p==='matches') render();
  else renderPlayers();
  renderFab();
}

loadMatches();
setInterval(loadMatches, 60000);
