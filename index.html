<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WK 2026 Live</title>
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f4ff;--muted:#8892a4;--muted2:#5c6080;--accent:#f97316;--green:#22c55e;--blue:#3b82f6;--gold:#fbbf24;--lav:#b8a9f5;--peach:#f5b8a0;--sky:#a0d4f5;--mint:#7ee8c3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:10}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-size:18px;font-weight:700;color:var(--accent)}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:3px 8px;border-radius:20px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 1s infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.date-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.date-nav::-webkit-scrollbar{display:none}
.dpill{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.dpill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.container{max-width:600px;margin:0 auto;padding:12px 14px 40px}
.filter-row{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto}
.filter-row::-webkit-scrollbar{display:none}
.ftab{padding:5px 12px;border-radius:16px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.ftab.on{background:var(--surface2);border-color:var(--border2);color:var(--text);font-weight:600}
.ftab.live-ftab{color:var(--green)}
.ftab.live-ftab.on{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4)}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;overflow:hidden;transition:all .15s}
.match-card:hover,.match-card:active{background:var(--surface2);border-color:var(--border2)}
.match-card.live{border-color:rgba(34,197,94,.4)}
.mc-inner{padding:12px 14px}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-league{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
.mc-status{font-size:10px;font-weight:700}
.status-live{color:var(--green);display:flex;align-items:center;gap:4px}
.status-ft{color:var(--muted2)}
.status-time{color:var(--muted)}
.mc-body{display:flex;align-items:center;gap:10px}
.mc-teams{flex:1;min-width:0}
.team-row{display:flex;align-items:center;gap:7px;padding:2px 0}
.tflag{font-size:16px;flex-shrink:0;width:20px}
.tname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.w{font-weight:700;color:var(--mint)}
.mc-score{text-align:center;min-width:40px}
.score{font-size:20px;font-weight:700;color:var(--green);line-height:1.1;text-align:center}
.score-line{font-size:20px;font-weight:700;line-height:1.1}
.pct-bar{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:6px}
.pb1{background:var(--accent)}.pbx{background:var(--surface2)}.pb2{background:var(--lav)}
.mc-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px}
.oc{padding:5px 3px;border-radius:7px;border:1px solid var(--border2);text-align:center;background:rgba(255,255,255,.03)}
.oc.w{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}
.ol{font-size:9px;color:var(--muted);display:block;margin-bottom:1px}
.ov{font-size:12px;font-weight:700;color:var(--text)}
.oc.w .ov{color:var(--green)}
.op{font-size:9px;color:var(--muted2)}
.tip{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10px;font-weight:700;margin-top:6px}
.t1{background:rgba(249,115,22,.1);color:var(--accent);border:1px solid rgba(249,115,22,.25)}
.tx{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.t2{background:rgba(184,169,245,.1);color:var(--lav);border:1px solid rgba(184,169,245,.25)}
.t1x{background:rgba(245,184,160,.1);color:var(--peach);border:1px solid rgba(245,184,160,.25)}
.tx2{background:rgba(160,212,245,.1);color:var(--sky);border:1px solid rgba(160,212,245,.25)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:all}
.modal{width:100%;max-width:600px;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--border2);max-height:92vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s}
.modal::-webkit-scrollbar{display:none}
.overlay.on .modal{transform:translateY(0)}
.mhandle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.mhdr{padding:12px 16px 0;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-size:14px;font-weight:700}
.mclose{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.mbody{padding:14px 16px 30px}
.md-hero{background:linear-gradient(135deg,rgba(184,169,245,.1),rgba(126,232,195,.08));border:1px solid rgba(184,169,245,.2);border-radius:14px;padding:16px;margin-bottom:12px}
.md-meta{font-size:11px;color:var(--lav);text-align:center;margin-bottom:10px}
.md-teams{display:flex;align-items:center;justify-content:space-between}
.md-team{text-align:center;flex:1}
.md-flag{font-size:38px;display:block;margin-bottom:4px}
.md-name{font-size:13px;font-weight:600}
.md-mid{text-align:center;padding:0 10px}
.md-score{font-size:28px;font-weight:700;color:var(--green)}
.md-vs{font-size:13px;color:var(--muted)}
.md-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.mdo{padding:7px;border-radius:9px;border:1px solid var(--border2);background:rgba(255,255,255,.04);text-align:center}
.mdo.w{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.35)}
.mdol{font-size:9px;color:var(--muted);display:block;margin-bottom:2px}
.mdov{font-size:15px;font-weight:700;color:var(--text)}
.mdo.w .mdov{color:var(--green)}
.mdop{font-size:10px;color:var(--muted2)}
.bb{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(249,115,22,.06));border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:14px;margin-bottom:12px}
.bbl{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.bbt{font-size:14px;font-weight:700;margin-bottom:5px}
.bbw{font-size:12px;color:var(--muted);line-height:1.7}
.shdr{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.sflag{font-size:16px}
.sname{font-size:13px;font-weight:700;flex:1}
.slbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pc{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:5px;display:flex;align-items:center;gap:10px}
.pmed{font-size:18px;min-width:24px;text-align:center}
.pinf{flex:1;min-width:0}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.pr{text-align:right;flex-shrink:0}
.psh{font-size:20px;font-weight:700;color:var(--peach)}
.psl{font-size:9px;color:var(--muted);text-transform:uppercase}
.psot{font-size:11px;color:var(--sky);margin-top:1px}
.pxg{font-size:11px;color:var(--lav)}
.pbas{font-size:10px;padding:2px 6px;border-radius:7px;margin-top:3px;display:inline-block}
.by{background:rgba(34,197,94,.1);color:var(--green)}
.bn{background:rgba(255,255,255,.06);color:var(--muted)}
.nodata{font-size:12px;color:var(--muted);padding:8px 0}

.lbox{background:rgba(34,197,94,.1);border:1px solid var(--green);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:8px}
.view-switch{display:flex;gap:6px;margin-bottom:12px}
.vtab{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.vtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gwrap{margin-bottom:18px}
.ghdr{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ghdr .gletter{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.stable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:11px}
.stable th{text-align:center;color:var(--muted);font-weight:600;padding:7px 4px;border-bottom:1px solid var(--border);font-size:10px}
.stable th:first-child,.stable td:first-child{text-align:left;padding-left:10px}
.stable td{text-align:center;padding:7px 4px;border-bottom:1px solid var(--border)}
.stable tr:last-child td{border-bottom:none}
.stable .steam{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.stable .spts{font-weight:700;color:var(--mint)}
.stable tr.q td.steam{color:var(--mint)}
.stable tr.q{background:rgba(126,232,195,.05)}
.overall-bet-btn{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(251,191,36,.4);background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(249,115,22,.08));color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.overall-bet-btn:active{opacity:.8}
.overall-bet-panel{background:var(--surface);border:1px solid rgba(251,191,36,.3);border-radius:14px;padding:16px;margin-bottom:14px}
.overall-bet-panel .ob-title{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--gold)}
.ob-leg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.ob-leg:last-of-type{border-bottom:none}
.ob-leg-match{color:var(--muted2);font-size:10px;margin-top:2px}
.ob-combined{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;font-weight:700;font-size:14px}
.snote{font-size:10px;color:var(--muted2);margin-top:4px}
.supdated{font-size:10px;color:var(--muted2);text-align:right;margin-bottom:10px}
.ai-loading{color:var(--muted);font-size:13px}
.dots{display:inline-block;animation:dotpulse 1.2s infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

const NOW = new Date();
const TODAY = NOW.toISOString().split('T')[0];
let selDate = TODAY;
let selFilter = 'all';
let selView = 'matches';
let GROUPS = {};
let groupsUpdatedAt = null;
let oddsUpdatedAt = null;
let topscorersUpdatedAt = null;
let PLAYER_STATS = {}; // spelersdata per team van hun meest recente gespeelde wedstrijd

// ── HELPERS ──
const RL = g => g==='FIN'?'🏆 Finale':g==='SF'?'Halve Finale':g==='QF'?'Kwartfinale':g==='R16'?'Achtste Finale':g==='R32'?'Ronde van 32':g==='3PL'?'3e Plaatswedstrijd':`Groep ${g}`;
function isLive(m){
  if(m.apiLive!==undefined) return m.apiLive; // echte status van de API wint altijd
  if(m.result) return false;
  const s=new Date(m.date+'T'+m.time+':00');
  const e=new Date(s.getTime()+115*60000);
  return NOW>=s&&NOW<=e;
}
function isDone(m){
  if(m.apiLive===true) return false; // API zegt: nog bezig, ondanks dat er al een tussenstand staat
  return !!m.result||(NOW>new Date(new Date(m.date+'T'+m.time+':00').getTime()+115*60000));
}
function probs(h,d,a){const r1=1/(h||99),rx=1/(d||99),r2=1/(a||99),t=r1+rx+r2;const p1=Math.round(r1/t*100),px=Math.round(rx/t*100);return{p1,px,p2:100-p1-px};}

// Bouwt de Beste Bet op basis van beschikbare data, in volgorde van betrouwbaarheid:
// 1) Spelersdata van vorige WK-wedstrijd (lineup stats: rating, shots, xG)
// 2) Globale WK-topscorers met goals > 0
// 3) Beide teams scoren (groepsstand)
// 4) Favoriet op odds
function buildBestBet(m, _unused, odds){
  // 1) Spelersdata van vorige wedstrijd — meest betrouwbaar
  const hPlayers = (PLAYER_STATS[m.h] || []).filter(p => p.mins > 30);
  const aPlayers = (PLAYER_STATS[m.a] || []).filter(p => p.mins > 30);
  const allPlayers = [...hPlayers, ...aPlayers];

  if(allPlayers.length){
    // Gebruik geaccumuleerde gemiddelden over heel het toernooi
    const withXg = allPlayers.filter(p => (p.avg_xg??p.xg??0) > 0);
    const withShots = allPlayers.filter(p => (p.avg_sot??p.sot??0) > 0);
    const byRating = [...allPlayers].sort((a,b) => (b.avg_rating??b.rating??0)-(a.avg_rating??a.rating??0));

    if(withXg.length){
      const best = withXg.sort((a,b) => (b.avg_xg??b.xg??0)-(a.avg_xg??a.xg??0))[0];
      const teamFlag = best.team === m.h ? F(m.h) : F(m.a);
      const gp = best.matches || 1;
      return {
        label:'⭐ Beste Bet — Speler om te Scoren',
        title:`${teamFlag} ${best.n} — scoort een doelpunt`,
        body:`Gem. xG: <strong>${nf(best.avg_xg??best.xg)}</strong> per wedstrijd (${gp} WK-wed.)
          · gem. ${nf(best.avg_sot??best.sot,1)} schoten op doel<br>
          Gem. rating: <strong>${best.avg_rating??nf(best.rating,1)??'-'}</strong>
          ${best.goals>0?` · ⚽ ${best.goals} goal${best.goals>1?'s':''} dit toernooi`:''}<br>
          <span style="color:var(--gold)">→ Check quote op je boekmaker → Anytime Goalscorer</span>`
      };
    }

    if(withShots.length){
      const best = withShots.sort((a,b) => (b.avg_sot??b.sot??0)-(a.avg_sot??a.sot??0))[0];
      const teamFlag = best.team === m.h ? F(m.h) : F(m.a);
      const gp = best.matches || 1;
      return {
        label:'⭐ Beste Bet — Schoten op Doel',
        title:`${teamFlag} ${best.n} — schot op doel`,
        body:`Gem. <strong>${nf(best.avg_sot??best.sot,1)}</strong> schoten op doel per wed. (${gp} gespeeld)<br>
          Gem. rating: <strong>${best.avg_rating??nf(best.rating,1)??'-'}</strong>
          ${best.keyPasses_total>0?` · ${best.keyPasses_total} kansen gecreëerd totaal`:''}<br>
          <span style="color:var(--gold)">→ Check quote op je boekmaker → Speler schot op doel</span>`
      };
    }

    if(byRating[0]?.avg_rating != null || byRating[0]?.rating != null){
      const best = byRating[0];
      const teamFlag = best.team === m.h ? F(m.h) : F(m.a);
      const gp = best.matches || 1;
      return {
        label:'⭐ Beste Bet — Beste Vorm',
        title:`${teamFlag} ${best.n} — sterke prestatie verwacht`,
        body:`Gem. rating dit toernooi: <strong>${best.avg_rating??nf(best.rating,1)}</strong> over ${gp} wedstrijden<br>
          <span style="color:var(--muted2)">Tip gebaseerd op overall rating — geen xG/schoten data beschikbaar</span>`
      };
    }
  }

  // 2) Globale topscorers met echte goals
  const hTop = (SH[m.h]||[]).filter(p=>p.g>0);
  const aTop = (SH[m.a]||[]).filter(p=>p.g>0);
  const allTop = [...hTop.map(p=>({...p,flag:F(m.h)})), ...aTop.map(p=>({...p,flag:F(m.a)}))];
  if(allTop.length){
    const best = allTop.sort((a,b)=>(b.xg??0)-(a.xg??0)||(b.g??0)-(a.g??0))[0];
    return {
      label:'⭐ Beste Bet — Topscorer dit Toernooi',
      title:`${best.flag} ${best.n} — scoort een doelpunt`,
      body:`${best.g} goals · ${best.assists?`${best.assists} assists · `:''}${best.gm} wed. dit toernooi<br>
        ${best.rating!=null?`Gem. rating <strong>${nf(best.rating,1)}</strong><br>`:''}
        <span style="color:var(--muted2)">Geen spelersdata vorige wedstrijd beschikbaar — gebaseerd op toernooi totalen</span><br>
        <span style="color:var(--gold)">→ Check quote op je boekmaker → Anytime Goalscorer</span>`
    };
  }

  // 3) Beide teams scoren — groepsstand
  const hRow=teamStanding(m.h), aRow=teamStanding(m.a);
  if(hRow && aRow && hRow.played>0 && aRow.played>0){
    const hGF=hRow.gf/hRow.played, hGA=hRow.ga/hRow.played;
    const aGF=aRow.gf/aRow.played, aGA=aRow.ga/aRow.played;
    const yes = hGF>0.6 && aGF>0.6 && hGA>0.3 && aGA>0.3;
    const no = (hGA===0 || aGA===0) && (hGF<0.5 || aGF<0.5);
    if(yes||no){
      return {
        label:'⭐ Beste Bet — Beide Teams Scoren',
        title:`Beide teams scoren: ${yes?'JA':'NEE'}`,
        body:`${m.h}: gem. ${nf(hGF)} voor / ${nf(hGA)} tegen per wed. (${hRow.played} gespeeld)<br>
          ${m.a}: gem. ${nf(aGF)} voor / ${nf(aGA)} tegen per wed. (${aRow.played} gespeeld)<br>
          <span style="color:var(--muted2)">Gebaseerd op groepsfase tot nu toe</span>`
      };
    }
  }

  // 4) Favoriet op odds — laatste redmiddel
  if(odds){
    const {p1,px,p2}=probs(odds.h,odds.d,odds.a);
    const fav = p1>=p2&&p1>=px ? {team:m.h,p:p1,flag:F(m.h)} : p2>=p1&&p2>=px ? {team:m.a,p:p2,flag:F(m.a)} : null;
    if(fav){
      return {
        label:'⭐ Beste Bet — Matchwinnaar',
        title:`${fav.flag} ${fav.team} wint`,
        body:`Impliciete kans o.b.v. odds: <strong>${fav.p}%</strong><br>
          <span style="color:var(--muted2)">Nog geen spelersdata beschikbaar voor deze teams</span>`
      };
    }
  }
  return null;
}
function tip(p1,px,p2){const m=Math.max(p1,px,p2);if(m===p1)return px>p1-8?{t:'1X',c:'t1x'}:{t:'1',c:'t1'};if(m===p2)return px>p2-8?{t:'X2',c:'tx2'}:{t:'2',c:'t2'};return p1>p2?{t:'1X',c:'t1x'}:{t:'X2',c:'tx2'};}
function getOdds(h,a){const f=ODDS[h+'_'+a],r=ODDS[a+'_'+h];return f||r?{h:f?.h||r?.a,d:f?.d||r?.d,a:f?.a||r?.h,fetchedAt:f?.fetchedAt||r?.fetchedAt}:null;}

// ── RENDER ──
function render(){
  const ms=MATCHES.filter(m=>{
    if(m.date!==selDate) return false;
    const live=isLive(m),done=isDone(m);
    if(selFilter==='live') return live;
    if(selFilter==='done') return done;
    if(selFilter==='up') return !live&&!done;
    return true;
  }).sort((a,b)=>{
    // Gewoon op tijd — gespeeld bovenaan (vroegste tijd), live ertussen, aankomend onderaan
    const aLive=isLive(a), bLive=isLive(b);
    const timeCmp = a.time.localeCompare(b.time);
    // Bij gelijke tijd: live eerst
    if(timeCmp===0){
      if(aLive&&!bLive) return -1;
      if(!aLive&&bLive) return 1;
    }
    return timeCmp;
  });
  if(!ms.length){document.getElementById('mc').innerHTML=`<div class="empty">Geen wedstrijden${selFilter!=='all'?' in deze categorie':''} voor ${selDate===TODAY?'vandaag':'deze dag'}.</div>`;
    document.getElementById('overall-bet-container').innerHTML='';
    return;
  }
  // Overall bet knop — alleen bij 2+ aankomende wedstrijden
  const upcoming = ms.filter(m => !isDone(m) && !isLive(m));
  const tomorrow2 = new Date(new Date(selDate).getTime() + 24*60*60*1000).toISOString().split('T')[0];
  const upcomingTomorrow = MATCHES.filter(m => m.date === tomorrow2 && !isDone(m) && !isLive(m));
  const totalUpcoming = upcoming.length + upcomingTomorrow.length;
  const obContainer = document.getElementById('overall-bet-container');
  if(totalUpcoming >= 2){
    obContainer.innerHTML = `<button class="overall-bet-btn" onclick="generateOverallBet()">🎯 Beste Dagtip — ${totalUpcoming} wedstrijden (vandaag + morgen)</button><div id="overall-bet-result"></div>`;
  } else {
    obContainer.innerHTML = '';
  }
  document.getElementById('mc').innerHTML=ms.map(m=>{
    const hf=F(m.h),af=F(m.a);
    const live=isLive(m),done=isDone(m)||m.result;
    const odds=getOdds(m.h,m.a);
    let statusHtml='',oddsHtml='',pctHtml='',tipHtml='';
    if(live) statusHtml=`<div class="mc-status status-live"><div class="ldot"></div>LIVE</div>`;
    else if(m.result) statusHtml=`<div class="mc-status status-ft">✓ FT</div>`;
    else statusHtml=`<div class="mc-status status-time">${m.time}</div>`;
    if(odds){
      const{p1,px,p2}=probs(odds.h,odds.d,odds.a);
      const win=p1>p2&&p1>px?'h':p2>p1&&p2>px?'a':'d';
      const{t,c}=tip(p1,px,p2);
      pctHtml=`<div class="pct-bar"><div class="pb1" style="width:${p1}%"></div><div class="pbx" style="width:${px}%"></div><div class="pb2" style="width:${p2}%"></div></div>`;
      tipHtml=`<span class="tip ${c}">${t}</span>`;
      oddsHtml=`<div class="mc-odds">
        <div class="oc ${win==='h'?'w':''}"><span class="ol">1</span><span class="ov">${odds.h.toFixed(2)}</span><div class="op">${p1}%</div></div>
        <div class="oc ${win==='d'?'w':''}"><span class="ol">X</span><span class="ov">${odds.d?odds.d.toFixed(2):'-'}</span><div class="op">${px}%</div></div>
        <div class="oc ${win==='a'?'w':''}"><span class="ol">2</span><span class="ov">${odds.a.toFixed(2)}</span><div class="op">${p2}%</div></div>
      </div>`;
    }
    const hW=m.result&&parseInt(m.result[0])>parseInt(m.result[2]);
    const aW=m.result&&parseInt(m.result[2])>parseInt(m.result[0]);
    return `<div class="match-card ${live?'live':''}" onclick="openModal('${m.id}')">
      <div class="mc-inner">
        <div class="mc-top">
          <div class="mc-league">🌍 ${RL(m.g)}</div>
          ${statusHtml}
        </div>
        <div class="mc-body">
          <div class="mc-teams">
            <div class="team-row"><span class="tflag">${hf}</span><span class="tname ${hW?'w':''}">${m.h}</span></div>
            <div class="team-row" style="margin-top:5px"><span class="tflag">${af}</span><span class="tname ${aW?'w':''}">${m.a}</span></div>
            ${pctHtml}
          </div>
          <div class="mc-score">
            ${m.result?`<div class="score">${m.result[0]}<br>${m.result[2]}</div>`:
              live?`<div class="score" style="color:var(--mint)">?</div>`:
              `<div style="font-size:11px;color:var(--muted);text-align:center">${m.time}</div>`}
          </div>
        </div>
        ${oddsHtml}
        ${!oddsHtml&&tipHtml?`<div style="margin-top:6px">${tipHtml}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── BET KANSBEREKENING (Poisson model) ──
// Poisson kans: P(X=k) = e^(-λ) * λ^k / k!
function poisson(lambda, k) {
  if(lambda <= 0) return k === 0 ? 1 : 0;
  let p = Math.exp(-lambda);
  for(let i = 0; i < k; i++) p *= lambda / (i + 1);
  return p;
}
function poissonAtLeast(lambda, k) {
  let cumulative = 0;
  for(let i = 0; i < k; i++) cumulative += poisson(lambda, i);
  return Math.round((1 - cumulative) * 100);
}
function poissonAtMost(lambda, k) {
  let cumulative = 0;
  for(let i = 0; i <= k; i++) cumulative += poisson(lambda, i);
  return Math.round(cumulative * 100);
}

function calculateBetProbs(m, odds, hLinup, aLinup) {
  const hRow = teamStanding(m.h);
  const aRow = teamStanding(m.a);
  const bets = [];

  // ── 1X2 uit odds ──
  if(odds) {
    const r1=1/odds.h, rx=1/odds.d, r2=1/odds.a, tot=r1+rx+r2;
    const p1=Math.round(r1/tot*100), px=Math.round(rx/tot*100), p2=Math.round(r2/tot*100);
    bets.push({type:'1X2', bet:`${m.h} wint`, kans:p1, match:`${m.h} vs ${m.a}`});
    bets.push({type:'1X2', bet:`Gelijkspel`, kans:px, match:`${m.h} vs ${m.a}`});
    bets.push({type:'1X2', bet:`${m.a} wint`, kans:p2, match:`${m.h} vs ${m.a}`});
  }

  // ── BTTS & Over/Under via Poisson ──
  if(hRow?.played && aRow?.played) {
    const hGF = hRow.gf / hRow.played;
    const hGA = hRow.ga / hRow.played;
    const aGF = aRow.gf / aRow.played;
    const aGA = aRow.ga / aRow.played;
    // Verwachte goals = gemiddelde van aanval vs verdediging tegenstander
    const hExpected = (hGF + aGA) / 2;
    const aExpected = (aGF + hGA) / 2;
    const totalExp = hExpected + aExpected;

    // BTTS
    const pHScores = poissonAtLeast(hExpected, 1);
    const pAScores = poissonAtLeast(aExpected, 1);
    const pBTTS = Math.round(pHScores/100 * pAScores/100 * 100);
    bets.push({type:'BTTS', bet:'Beide teams scoren: JA', kans:pBTTS, match:`${m.h} vs ${m.a}`, detail:`h exp ${nf(hExpected)} / a exp ${nf(aExpected)}`});
    bets.push({type:'BTTS', bet:'Beide teams scoren: NEE', kans:100-pBTTS, match:`${m.h} vs ${m.a}`});

    // Over/Under
    bets.push({type:'O/U', bet:'Over 0.5 doelpunten', kans:poissonAtLeast(totalExp,1), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Over 1.5 doelpunten', kans:poissonAtLeast(totalExp,2), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Over 2.5 doelpunten', kans:poissonAtLeast(totalExp,3), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Under 2.5 doelpunten', kans:poissonAtMost(totalExp,2), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Under 1.5 doelpunten', kans:poissonAtMost(totalExp,1), match:`${m.h} vs ${m.a}`});

    // Clean sheet
    bets.push({type:'CS', bet:`${m.h} clean sheet`, kans:poissonAtMost(aExpected,0), match:`${m.h} vs ${m.a}`});
    bets.push({type:'CS', bet:`${m.a} clean sheet`, kans:poissonAtMost(hExpected,0), match:`${m.h} vs ${m.a}`});

    // Team scoort 2+
    bets.push({type:'Team goals', bet:`${m.h} scoort 2+`, kans:poissonAtLeast(hExpected,2), match:`${m.h} vs ${m.a}`});
    bets.push({type:'Team goals', bet:`${m.a} scoort 2+`, kans:poissonAtLeast(aExpected,2), match:`${m.h} vs ${m.a}`});
  }

  // ── Speler bets via Poisson ──
  const allPlayers = [
    ...(hLinup||[]).slice(0,5).map(p=>({...p,side:'h'})),
    ...(aLinup||[]).slice(0,5).map(p=>({...p,side:'a'}))
  ];
  for(const p of allPlayers) {
    const xg = p.avg_xg ?? p.xg ?? 0;
    const sot = p.avg_sot ?? p.sot ?? 0;
    const shots = p.avg_shots ?? p.shots ?? 0;

    if(xg > 0) {
      const pScores = Math.round((1 - Math.exp(-xg)) * 100);
      bets.push({type:'Speler scoort', bet:`${p.n} scoort`, kans:pScores, match:`${m.h} vs ${m.a}`, detail:`xG/wed: ${nf(xg)}`});
    }
    if(sot > 0) {
      bets.push({type:'Speler SoT', bet:`${p.n} 1+ schot op doel`, kans:poissonAtLeast(sot,1), match:`${m.h} vs ${m.a}`, detail:`SoT/wed: ${nf(sot,1)}`});
      if(sot >= 1.5) bets.push({type:'Speler SoT', bet:`${p.n} 2+ schoten op doel`, kans:poissonAtLeast(sot,2), match:`${m.h} vs ${m.a}`});
    }
    if(shots > 0) {
      bets.push({type:'Speler sch', bet:`${p.n} 1+ schot`, kans:poissonAtLeast(shots,1), match:`${m.h} vs ${m.a}`, detail:`sch/wed: ${nf(shots,1)}`});
    }
    if(xg > 0 || sot > 0) {
      const pShotOrGoal = Math.min(99, Math.round((1 - Math.exp(-(xg + sot*0.3))) * 100));
      bets.push({type:'Speler betrokken', bet:`${p.n} scoort of assist`, kans:Math.round((1-Math.exp(-(xg+(p.assists/Math.max(p.matches||1,1)*0.5))))*100), match:`${m.h} vs ${m.a}`});
    }
  }

  // Sorteer op kans (hoogste eerst)
  return bets.sort((a,b) => b.kans - a.kans);
}
