<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MATCHDAY.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f8;--surface3:#e4e8f2;
  --border:rgba(15,23,42,0.08);--border2:rgba(15,23,42,0.14);--border3:rgba(15,23,42,0.22);
  --text:#0f172a;--muted:#64748b;--muted2:#94a3b8;
  --accent:#16a34a;--accent2:#15803d;
  --green:#16a34a;--green2:#15803d;
  --gold:#d97706;--gold2:#f59e0b;
  --lav:#7c3aed;--peach:#e11d48;--sky:#0284c7;--mint:#10b981;
  --blue:#2563eb;
  --glow-accent:rgba(22,163,74,.12);
  --glow-green:rgba(22,163,74,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{
  background:rgba(244,246,251,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 16px 0;
  position:sticky;top:0;z-index:50;
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.logo-accent{color:var(--green)}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--green);background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);padding:4px 10px;border-radius:20px;letter-spacing:.02em}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 1.4s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ── DATE NAV ── */
.comp-nav{display:flex;gap:5px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
.comp-nav::-webkit-scrollbar{display:none}
.cpill{flex-shrink:0;padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:4px}
.cpill.on{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--text)}
.cpill:active{transform:scale(.97)}
.date-nav{padding-bottom:12px}
.date-bar{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:9px 10px}
.date-label{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.1px;text-transform:capitalize}
.date-arrow{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface2);color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.date-arrow:not(:disabled):active{transform:scale(.9)}
.date-arrow:disabled{opacity:.3;cursor:default}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 0}
.bnav-item .bnav-ic{font-size:18px;line-height:1}
.bnav-item.on{color:var(--green)}

/* ── CONTAINER ── */
.container{max-width:600px;margin:0 auto;padding:14px 14px 92px}

/* ── VIEW SWITCH ── */
.view-switch{display:flex;gap:6px;margin-bottom:14px;background:var(--surface);padding:4px;border-radius:14px;border:1px solid var(--border)}
.vtab{flex:1;padding:8px 0;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.vtab.on{background:var(--surface3);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.4)}

/* ── FILTER TABS ── */
.filter-row{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.ftab{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
.ftab.on{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--text);font-weight:600}
.ftab.live-ftab{color:var(--green)}
.ftab.live-ftab.on{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}

/* ── MATCH CARD ── */
.match-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:8px;
  cursor:pointer;
  overflow:hidden;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
  animation:fadeSlideIn .3s ease both;
}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.match-card:hover{background:var(--surface2);border-color:var(--border2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.match-card:active{transform:scale(.99)}
.match-card.live{border-color:rgba(34,197,94,.3);box-shadow:0 0 20px rgba(34,197,94,.06)}
.mc-inner{padding:13px 15px}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.mc-league{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;font-weight:500;letter-spacing:.02em}
.comp-group{margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.comp-group-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--surface2);user-select:none}
.comp-group-icon{width:30px;height:30px;border-radius:10px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.comp-group-titles{flex:1;min-width:0}
.comp-group-name{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-group-sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-group-count{font-size:10px;font-weight:600;color:var(--muted);background:var(--surface3);border-radius:20px;padding:2px 7px;flex-shrink:0}
.comp-group-chevron{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.comp-group-chevron.open{transform:rotate(90deg)}
.comp-group-body{padding:2px 10px 10px}
.mc-status{font-size:10px;font-weight:700}
.status-live{color:var(--green);display:flex;align-items:center;gap:5px}
.status-ft{color:var(--muted2);font-weight:600}
.status-time{color:var(--muted);font-weight:500}
.mc-body{display:flex;align-items:center;gap:10px}
.mc-teams{flex:1;min-width:0}
.team-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.tflag{font-size:17px;flex-shrink:0;width:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.tbadge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:9px;font-weight:800;color:#fff;letter-spacing:-.2px;box-shadow:0 1px 3px rgba(0,0,0,.4);flex-shrink:0}
.tcrest{width:20px;height:20px;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,.04);border-radius:5px}
.tname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.tname.w{font-weight:700;color:var(--mint)}
.mc-score{text-align:center;min-width:44px}
.score{font-size:22px;font-weight:800;color:var(--mint);line-height:1;text-align:center;letter-spacing:-1px}
.score-line{font-size:22px;font-weight:800;line-height:1}
.pct-bar{display:flex;height:3px;border-radius:3px;overflow:hidden;margin-top:7px;gap:1px}
.pb1{background:linear-gradient(90deg,var(--accent),var(--accent2))}.pbx{background:var(--surface3)}.pb2{background:linear-gradient(90deg,var(--lav),#c4b5fd)}
.mc-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:9px}
.oc{padding:6px 3px;border-radius:10px;border:1px solid var(--border);text-align:center;background:var(--surface2);transition:all .15s}
.oc.w{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.25)}
.ol{font-size:9px;color:var(--muted);display:block;margin-bottom:2px;font-weight:500;letter-spacing:.04em}
.ov{font-size:13px;font-weight:700;color:var(--text)}
.oc.w .ov{color:var(--mint)}
.op{font-size:9px;color:var(--muted2);margin-top:1px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:all}
.modal{width:100%;max-width:600px;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--border2);border-bottom:none;max-height:92vh;overflow-y:auto;transform:translateY(30px);transition:transform .3s cubic-bezier(.34,1.2,.64,1)}
.modal::-webkit-scrollbar{display:none}
.overlay.on .modal{transform:translateY(0)}
.mhandle{width:36px;height:4px;background:var(--border3);border-radius:2px;margin:14px auto 2px}
.mhdr{padding:12px 16px 4px;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-size:15px;font-weight:700;letter-spacing:-.2px}
.mclose{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--muted);transition:all .15s}
.mclose:hover{background:var(--surface3);color:var(--text)}
.mbody{padding:14px 16px 32px}

/* ── MODAL HERO ── */
.md-hero{background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(52,211,153,.06));border:1px solid rgba(167,139,250,.15);border-radius:16px;padding:18px;margin-bottom:14px}
.md-meta{font-size:11px;color:var(--lav);text-align:center;margin-bottom:12px;font-weight:500;letter-spacing:.04em}
.md-teams{display:flex;align-items:center;justify-content:space-between}
.md-team{text-align:center;flex:1}
.md-flag{font-size:40px;display:block;margin-bottom:6px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.md-name{font-size:13px;font-weight:600;letter-spacing:-.1px}
.md-mid{text-align:center;padding:0 12px}
.md-score{font-size:32px;font-weight:800;color:var(--mint);letter-spacing:-2px;animation:scoreIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes scoreIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.md-vs{font-size:13px;color:var(--muted);font-weight:500}
.md-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:13px}
.mdo{padding:9px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);text-align:center;transition:all .15s}
.mdo.w{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.3)}
.mdol{font-size:9px;color:var(--muted);display:block;margin-bottom:3px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.mdov{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.mdo.w .mdov{color:var(--mint)}
.mdop{font-size:10px;color:var(--muted2);margin-top:2px}

/* ── AI BET BOX ── */
.bb{background:linear-gradient(135deg,rgba(245,158,11,.06),rgba(249,115,22,.04));border:1px solid rgba(245,158,11,.2);border-radius:16px;padding:15px;margin-bottom:13px}
.bbl{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.bbt{font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.3;letter-spacing:-.2px}
.bbw{font-size:12px;color:var(--muted);line-height:1.7}

/* ── PLAYER CARDS ── */
.shdr{display:flex;align-items:center;gap:8px;margin:16px 0 9px}
.sflag{font-size:16px}
.sname{font-size:13px;font-weight:700;flex:1;letter-spacing:-.1px}
.slbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.pc{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:all .15s;animation:fadeSlideIn .25s ease both}
.pmed{font-size:18px;min-width:24px;text-align:center}
.pinf{flex:1;min-width:0}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.pm{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.pr{text-align:right;flex-shrink:0}
.psh{font-size:20px;font-weight:800;color:var(--peach);letter-spacing:-1px}
.psl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.psot{font-size:11px;color:var(--sky);margin-top:2px}
.pxg{font-size:11px;color:var(--lav)}
.pbas{font-size:10px;padding:2px 7px;border-radius:8px;margin-top:3px;display:inline-block;font-weight:600}
.by{background:rgba(34,197,94,.1);color:var(--green)}
.bn{background:rgba(255,255,255,.06);color:var(--muted)}
.nodata{font-size:12px;color:var(--muted);padding:10px 0;text-align:center}

/* ── STATUS BOXES ── */
.rbox{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.18);border-radius:12px;padding:10px 14px;margin-bottom:13px;font-size:12px;color:var(--green);font-weight:500}
.lbox{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:12px;padding:10px 14px;margin-bottom:13px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:8px;font-weight:600;animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 rgba(34,197,94,0)}50%{box-shadow:0 0 16px rgba(34,197,94,.15)}}

/* ── STANDINGS ── */
.gwrap{margin-bottom:20px;animation:fadeSlideIn .3s ease both}
.ghdr{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:7px;letter-spacing:-.1px}
.ghdr .gletter{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--gold2));color:#fff;font-size:11px;font-weight:800}
.stable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;font-size:11px}
.stable th{text-align:center;color:var(--muted);font-weight:600;padding:8px 4px;border-bottom:1px solid var(--border);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.stable th:first-child,.stable td:first-child{text-align:left;padding-left:12px}
.stable td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--border);font-weight:500}
.stable tr:last-child td{border-bottom:none}
.stable .steam{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.stable .spts{font-weight:800;color:var(--mint)}
.stable tr.q{background:rgba(52,211,153,.04)}
.stable tr.q td.steam{color:var(--mint)}

/* ── OVERALL BET BUTTON ── */
.sel-toggle{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0;color:transparent}
.sel-toggle:hover{border-color:var(--gold);background:rgba(245,158,11,.1)}
.sel-toggle.sel-on{background:var(--gold);border-color:var(--gold);color:#000}
.match-card.sel-card{border-color:rgba(245,158,11,.4);box-shadow:0 0 16px rgba(245,158,11,.08)}
.overall-bet-btn{  width:100%;padding:15px;border-radius:16px;
  border:1px solid rgba(245,158,11,.35);
  background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(249,115,22,.06));
  color:var(--gold2);font-size:14px;font-weight:700;cursor:pointer;
  margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;font-family:inherit;letter-spacing:-.1px;
}
.overall-bet-btn:hover{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(249,115,22,.1));transform:translateY(-1px)}
.overall-bet-btn:active{transform:scale(.98);opacity:.9}
.overall-bet-panel{background:var(--surface);border:1px solid rgba(245,158,11,.25);border-radius:16px;padding:16px;margin-bottom:14px}
.ob-leg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.ob-leg:last-of-type{border-bottom:none}
.ob-leg-match{color:var(--muted2);font-size:10px;margin-top:2px}
.ob-combined{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;font-weight:700;font-size:14px}

/* ── PIN / ADMIN ── */
.pin-dots{display:flex;gap:14px;margin-bottom:24px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border3);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.pin-dot.error{background:var(--peach);border-color:var(--peach);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px}
.pin-btn{height:68px;border-radius:18px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:22px;font-weight:700;cursor:pointer;transition:all .15s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit}
.pin-btn:active{transform:scale(.92);background:var(--surface3)}
.pin-btn .sub{font-size:8px;color:var(--muted2);letter-spacing:.08em;font-weight:500}
.pin-btn.del{font-size:16px}
.pin-err{color:var(--peach);font-size:12px;margin-top:10px;min-height:18px;font-weight:500;text-align:center}
.admin-btn{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:13px;cursor:pointer;z-index:100;transition:all .15s;backdrop-filter:blur(8px)}
#admin-overlay{align-items:center}
#admin-overlay .modal{border-radius:24px;width:calc(100% - 40px);max-width:360px;transform:scale(.95) translateY(10px)}
#admin-overlay.on .modal{transform:scale(1) translateY(0)}

/* ── BRACKET ── */
.bkwrap{overflow-x:auto;padding-bottom:16px;-webkit-overflow-scrolling:touch}
.bkbracket{display:flex;gap:0;align-items:stretch;min-width:640px;padding:8px 0}
.bkcol{flex:1;display:flex;flex-direction:column;min-width:150px}
.bkcolhdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:0 8px 10px;white-space:nowrap}
.bkrow{display:flex;align-items:center;flex:var(--span,1);position:relative;padding:4px 0}
.bkcard{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:8px 10px;flex:1;margin:0 6px;transition:background .15s}
.bkcard:hover{background:var(--surface2)}
.bkcard.bklive{border-color:rgba(34,197,94,.4);box-shadow:0 0 14px rgba(34,197,94,.1)}
.bkcard.bkup{border-style:dashed;opacity:.8}
.bktime{font-size:9px;color:var(--muted2);margin-bottom:5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.bks{display:flex;align-items:center;gap:6px;padding:3px 0}
.bkn{font-size:11px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.bkscore{font-size:13px;font-weight:800;min-width:14px;text-align:right;color:var(--muted)}
.bks.bkw .bkn{color:var(--mint);font-weight:700}
.bks.bkw .bkscore{color:var(--mint)}
.bks.bkl .bkn{color:var(--muted2)}
.bks.bkl .bkscore{color:var(--muted2)}
/* Connector lines */
.bkline{position:absolute;right:-6px;width:6px;border-color:var(--border2);border-style:solid;z-index:1}
.bkline-t{top:50%;bottom:0;border-width:0 1px 1px 0;border-bottom-right-radius:6px}
.bkline-b{top:0;bottom:50%;border-width:1px 1px 0 0;border-top-right-radius:6px}
.supdated{font-size:10px;color:var(--muted2);text-align:right;margin-bottom:10px}
.snote{font-size:10px;color:var(--muted2);margin-top:6px;line-height:1.5}
.pstat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.pstatv{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.pstatl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.pstatlist{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow strong{color:var(--text);font-weight:700}

/* ── SPINNER / LOADING ── */
.ai-spinner{width:26px;height:26px;border:2.5px solid rgba(245,158,11,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{display:inline-block;animation:dotpulse 1.2s infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── MISC ── */
.empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:13px;line-height:1.6}
.tip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-top:6px;letter-spacing:.02em}
.t1{background:rgba(249,115,22,.1);color:var(--accent);border:1px solid rgba(249,115,22,.2)}
.tx{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.t2{background:rgba(167,139,250,.1);color:var(--lav);border:1px solid rgba(167,139,250,.2)}
.t1x{background:rgba(251,113,133,.1);color:var(--peach);border:1px solid rgba(251,113,133,.2)}
.tx2{background:rgba(56,189,248,.1);color:var(--sky);border:1px solid rgba(56,189,248,.2)}
</style>

function teamStanding(team){
  if(!team) return null;
  const t = team.toLowerCase();
  // WK groepen
  for(const letter in GROUPS){
    if(letter === '_multi') continue;
    const row=(GROUPS[letter]||[]).find(r=>r.team&&r.team.toLowerCase()===t);
    if(row) return row;
  }
  // Club competities
  const multi = GROUPS['_multi'] || [];
  return multi.find(r=>r.team&&r.team.toLowerCase()===t) || null;
}
function mergeMultiStandings(res){
  if(!res) return;
  const addRows = (rows) => {
    if(!GROUPS['_multi']) GROUPS['_multi'] = [];
    for(const row of (rows||[])){
      const idx = GROUPS['_multi'].findIndex(r=>r.team===row.team);
      if(idx>=0) GROUPS['_multi'][idx]=row; else GROUPS['_multi'].push(row);
    }
  };
  if(res.standings) { addRows(res.standings); }
  else { for(const id in res){ if(res[id]?.standings) addRows(res[id].standings); } }
}

function probs(h,d,a){const r1=1/(h||99),rx=1/(d||99),r2=1/(a||99),t=r1+rx+r2;const p1=Math.round(r1/t*100),px=Math.round(rx/t*100);return{p1,px,p2:100-p1-px};}

// Bouwt de Beste Bet op basis van beschikbare data, in volgorde van betrouwbaarheid:
// 1) Spelersdata van vorige WK-wedstrijd (lineup stats: rating, shots, xG)
// 2) Globale WK-topscorers met goals > 0
// 3) Beide teams scoren (groepsstand)
// 4) Favoriet op odds
function buildBestBet(m, _unused, odds){
  // 0) Clubcompetitie + Understat-seizoensdata beschikbaar → betrouwbaarder
  // dan de vaak schaarse per-wedstrijd WK-data hieronder (zie
  // scrape-players.mjs, dagelijks ververst voor de 6 grote competities)
  if(m.compId){
    const norm = t => (t||'').toLowerCase().trim();
    const understatPool = (ALL_PLAYERS||[])
      .filter(p => (norm(p.team) === norm(m.h) || norm(p.team) === norm(m.a)) && p.min > 0)
      .sort((a,b) => (blendedRate(b,'xg90')+blendedRate(b,'xa90')) - (blendedRate(a,'xg90')+blendedRate(a,'xa90')));
    const up = understatPool[0];
    if(up){
      const bXg90 = blendedRate(up,'xg90'), bSh90 = blendedRate(up,'sh90');
      const pGoal = Math.round((1 - Math.exp(-bXg90)) * 100);
      const pSot = Math.round((1 - Math.exp(-(bSh90*0.45))) * 100);
      const teamFlag = norm(up.team)===norm(m.h) ? TF(m,m.h) : TF(m,m.a);
      const hasPrev = !!findPrevSeason(up);
      return {
        label:'⭐ Beste Bet — Seizoensdreiging (Understat)',
        title:`${teamFlag} ${up.name} — schot op doel`,
        body:`Kans op schot op doel: <strong>${pSot}%</strong> · kans op goal: <strong>${pGoal}%</strong> per wedstrijd<br>
          Seizoensgemiddelden: xG90 ${nf(up.xg90,2)} · Sh90 ${nf(up.sh90,2)} (${up.apps} wed., seizoen ${up.season})<br>
          <span style="color:var(--muted2)">Schatting o.b.v. Understat${hasPrev?' + vorig seizoen (meegewogen naarmate dit seizoen nog jong is)':''} — vergelijk zelf met de spelersmarkt-quote bij je boekmaker</span><br>
          <span style="color:var(--gold)">→ Check quote op je boekmaker → Schot op doel / Anytime Goalscorer</span>`
      };
    }
  }

  // 1) Spelersdata van vorige wedstrijd — meest betrouwbaar
  const hPlayers = (PLAYER_STATS[m.h] || []).filter(p => p.mins > 30);
  const aPlayers = (PLAYER_STATS[m.a] || []).filter(p => p.mins > 30);
  const allPlayers = [...hPlayers, ...aPlayers];

  if(allPlayers.length){
    // Gebruik geaccumuleerde gemiddelden over heel het toernooi
    const withXg = allPlayers.filter(p => (p.avg_xg??p.xg??0) > 0);
    const withShots = allPlayers.filter(p => (p.avg_sot??p.sot??0) > 0);
    const byRating = [...allPlayers].sort((a,b) => (b.avg_rating??b.rating??0)-(a.avg_rating??a.rating??0));

    if(withXg.length){
      const best = withXg.sort((a,b) => (b.avg_xg??b.xg??0)-(a.avg_xg??a.xg??0))[0];
      const teamFlag = best.team === m.h ? TF(m,m.h) : TF(m,m.a);
      const gp = best.matches || 1;
      return {
        label:'⭐ Beste Bet — Speler om te Scoren',
        title:`${teamFlag} ${best.n} — scoort een doelpunt`,
        body:`Gem. xG: <strong>${nf(best.avg_xg??best.xg)}</strong> per wedstrijd (${gp} WK-wed.)
          · gem. ${nf(best.avg_sot??best.sot,1)} schoten op doel<br>
          Gem. rating: <strong>${best.avg_rating??nf(best.rating,1)??'-'}</strong>
          ${best.goals>0?` · ⚽ ${best.goals} goal${best.goals>1?'s':''} dit toernooi`:''}<br>
          <span style="color:var(--gold)">→ Check quote op je boekmaker → Anytime Goalscorer</span>`
      };
    }

    if(withShots.length){
      const best = withShots.sort((a,b) => (b.avg_sot??b.sot??0)-(a.avg_sot??a.sot??0))[0];
      const teamFlag = best.team === m.h ? TF(m,m.h) : TF(m,m.a);
      const gp = best.matches || 1;
      return {
        label:'⭐ Beste Bet — Schoten op Doel',
        title:`${teamFlag} ${best.n} — schot op doel`,
        body:`Gem. <strong>${nf(best.avg_sot??best.sot,1)}</strong> schoten op doel per wed. (${gp} gespeeld)<br>
          Gem. rating: <strong>${best.avg_rating??nf(best.rating,1)??'-'}</strong>
          ${best.keyPasses_total>0?` · ${best.keyPasses_total} kansen gecreëerd totaal`:''}<br>
          <span style="color:var(--gold)">→ Check quote op je boekmaker → Speler schot op doel</span>`
      };
    }

    if(byRating[0]?.avg_rating != null || byRating[0]?.rating != null){
      const best = byRating[0];
      const teamFlag = best.team === m.h ? TF(m,m.h) : TF(m,m.a);
      const gp = best.matches || 1;
      return {
        label:'⭐ Beste Bet — Beste Vorm',
        title:`${teamFlag} ${best.n} — sterke prestatie verwacht`,
        body:`Gem. rating dit toernooi: <strong>${best.avg_rating??nf(best.rating,1)}</strong> over ${gp} wedstrijden<br>
          <span style="color:var(--muted2)">Tip gebaseerd op overall rating — geen xG/schoten data beschikbaar</span>`
      };
    }
  }

  // 2) Globale topscorers met echte goals
  const hTop = (SH[m.h]||[]).filter(p=>p.g>0);
  const aTop = (SH[m.a]||[]).filter(p=>p.g>0);
  const allTop = [...hTop.map(p=>({...p,flag:F(m.h)})), ...aTop.map(p=>({...p,flag:F(m.a)}))];
  if(allTop.length){
    const best = allTop.sort((a,b)=>(b.xg??0)-(a.xg??0)||(b.g??0)-(a.g??0))[0];
    return {
      label:'⭐ Beste Bet — Topscorer dit Toernooi',
      title:`${best.flag} ${best.n} — scoort een doelpunt`,
      body:`${best.g} goals · ${best.assists?`${best.assists} assists · `:''}${best.gm} wed. dit toernooi<br>
        ${best.rating!=null?`Gem. rating <strong>${nf(best.rating,1)}</strong><br>`:''}
        <span style="color:var(--muted2)">Geen spelersdata vorige wedstrijd beschikbaar — gebaseerd op toernooi totalen</span><br>
        <span style="color:var(--gold)">→ Check quote op je boekmaker → Anytime Goalscorer</span>`
    };
  }

  // 3) Beide teams scoren — groepsstand
  const hRow=teamStanding(m.h), aRow=teamStanding(m.a);
  if(hRow && aRow && hRow.played>0 && aRow.played>0){
    const hGF=hRow.gf/hRow.played, hGA=hRow.ga/hRow.played;
    const aGF=aRow.gf/aRow.played, aGA=aRow.ga/aRow.played;
    const yes = hGF>0.6 && aGF>0.6 && hGA>0.3 && aGA>0.3;
    const no = (hGA===0 || aGA===0) && (hGF<0.5 || aGF<0.5);
    if(yes||no){
      return {
        label:'⭐ Beste Bet — Beide Teams Scoren',
        title:`Beide teams scoren: ${yes?'JA':'NEE'}`,
        body:`${m.h}: gem. ${nf(hGF)} voor / ${nf(hGA)} tegen per wed. (${hRow.played} gespeeld)<br>
          ${m.a}: gem. ${nf(aGF)} voor / ${nf(aGA)} tegen per wed. (${aRow.played} gespeeld)<br>
          <span style="color:var(--muted2)">Gebaseerd op groepsfase tot nu toe</span>`
      };
    }
  }

  // 4) Favoriet op odds — laatste redmiddel
  if(odds){
    const {p1,px,p2}=probs(odds.h,odds.d,odds.a);
    const fav = p1>=p2&&p1>=px ? {team:m.h,p:p1,flag:F(m.h)} : p2>=p1&&p2>=px ? {team:m.a,p:p2,flag:F(m.a)} : null;
    if(fav){
      return {
        label:'⭐ Beste Bet — Matchwinnaar',
        title:`${fav.flag} ${fav.team} wint`,
        body:`Impliciete kans o.b.v. odds: <strong>${fav.p}%</strong><br>
          <span style="color:var(--muted2)">Nog geen spelersdata beschikbaar voor deze teams</span>`
      };
    }
  }
  return null;
}
function tip(p1,px,p2){const m=Math.max(p1,px,p2);if(m===p1)return px>p1-8?{t:'1X',c:'t1x'}:{t:'1',c:'t1'};if(m===p2)return px>p2-8?{t:'X2',c:'tx2'}:{t:'2',c:'t2'};return p1>p2?{t:'1X',c:'t1x'}:{t:'X2',c:'tx2'};}
function getOdds(h,a){const f=ODDS[h+'_'+a],r=ODDS[a+'_'+h];return f||r?{h:f?.h||r?.a,d:f?.d||r?.d,a:f?.a||r?.h,fetchedAt:f?.fetchedAt||r?.fetchedAt}:null;}

  const filtered = selComp==='all' ? MATCHES : MATCHES.filter(m=>m.compId==selComp || (!m.compId && selComp==='wk'));
  const dates=[...new Set(filtered.map(m=>m.date))].filter(Boolean).sort();

  if(dateAutoPicked && dates.length){
    const upcoming = dates.find(d => d >= TODAY);

    selDate = upcoming || past || dates[0];
  } else if(!dates.includes(selDate) && dates.length){
    const upcoming = dates.find(d => d >= TODAY);

    selDate = upcoming || past || dates[0];
  }
  const idx=dates.indexOf(selDate);
  if(!dates.length){
    document.getElementById('dateNav').innerHTML='';
  } else {
    const dt=new Date(selDate+'T12:00:00');
    const lbl=selDate===TODAY?'Vandaag, '+dt.toLocaleDateString('nl-NL',{day:'numeric',month:'long'})
      :dt.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    const prevD=idx>0?dates[idx-1]:null;
    const nextD=idx>=0&&idx<dates.length-1?dates[idx+1]:null;

      <button class="date-arrow" ${prevD?'':'disabled'} onclick="${prevD?`selDay('${prevD}')`:''}">‹</button>

function jumpToDay(which,btn){
  const filtered = selComp==='all' ? MATCHES : MATCHES.filter(m=>m.compId==selComp || (!m.compId && selComp==='wk'));
  const dates=[...new Set(filtered.map(m=>m.date))].filter(Boolean).sort();
  let target=null;
  if(which==='today') target = dates.includes(TODAY) ? TODAY : dates.find(d=>d>=TODAY);
  else if(which==='tomorrow'){
    const tmr=new Date(new Date(TODAY).getTime()+86400000).toISOString().split('T')[0];
    target = dates.includes(tmr) ? tmr : dates.find(d=>d>tmr) || dates.find(d=>d>TODAY);
  } else if(which==='weekend'){
    target = dates.find(d=>{ const wd=new Date(d+'T12:00:00').getDay(); return d>=TODAY && (wd===6||wd===0); });
  }
  document.querySelectorAll('.ftab[data-day]').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  if(target) selDay(target); // niets gevonden: datum blijft ongewijzigd
}

// Zoekt de vorig-seizoen-versie van een ESPN-speler (zelfde athlete-id, ander
// seizoen-voorvoegsel). Understat-spelers hebben geen backfill, dus null.
function findPrevSeason(p){
  if(!p.id || !p.id.startsWith('espn_')) return null;
  const athId = p.id.split('_').pop();
  return (ALL_PLAYERS_PREV||[]).find(x => x.id.endsWith('_'+athId)) || null;
}

// Blendt een per-90-stat van dit seizoen met vorig seizoen, gewogen naar
// gespeelde minuten dit seizoen (vol gewicht na ~10 wedstrijden). Zo telt
// vorig seizoen vroeg in een nieuw seizoen zwaarder mee, en huidig seizoen
// wint vanzelf terrein naarmate er meer data binnenkomt.
function blendedRate(p, field){
  const cur = p[field] || 0;
  const prev = findPrevSeason(p);
  if(!prev) return cur;
  const w = Math.min((p.min||0) / 900, 1);
  return w*cur + (1-w)*(prev[field] || 0);
}

function renderPlayers(){
  const el = document.getElementById('playersList');
  const q = (document.getElementById('playerSearch').value || '').trim().toLowerCase();
  let list = ALL_PLAYERS;
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
  list = list.slice().sort((a,b) => (b.g+b.a) - (a.g+a.a)).slice(0, 100);
  if(!list.length){ el.innerHTML = `<div class="empty">Geen spelers gevonden.</div>`; return; }
  el.innerHTML = list.map(p => `<div class="pc" onclick="openPlayerModal('${p.id}')">
    <div class="pmed" style="font-size:11px;color:var(--muted2)">${p.pos||''}</div>
    <div class="pinf">
      <div class="pn">${p.name}</div>
      <div class="pm"><span>${p.team}</span><span style="color:var(--muted2)">${p.league.replace('_',' ')}</span></div>
    </div>
    <div class="pr">
      <div class="psh" style="font-size:16px;color:var(--mint)">${p.g}⚽ ${p.a}🅰️</div>
      <div class="psl">${p.apps} wed. · xG ${nf(p.xg,1)}</div>
    </div>
  </div>`).join('');
}

function openPlayerModal(id){
  const p = ALL_PLAYERS.find(x => x.id === id);
  if(!p) return;
  document.getElementById('ptitle').textContent = `${p.name}`;
  const stat = (label, val) => `<div class="pstat"><div class="pstatv">${val}</div><div class="pstatl">${label}</div></div>`;
  const row = (label, val) => `<div class="prow"><span>${label}</span><strong>${val}</strong></div>`;

  const per90Matches = p.min > 0 ? p.min/90 : 0;
  const totalShots = per90Matches ? Math.round((p.sh90||0) * per90Matches) : 0;
  const totalKp = per90Matches ? Math.round((p.kp90||0) * per90Matches) : 0;
  const gPer90 = per90Matches ? p.g/per90Matches : 0;
  const aPer90 = per90Matches ? p.a/per90Matches : 0;

  // ESPN-spelers (id begint met 'espn_') hebben geen xG-data — dan geen
  // Poisson-kansschatting tonen (zou misleidend 0% zijn), wel de echte cijfers.
  const isEspn = p.id.startsWith('espn_');
  const pGoal = 1 - Math.exp(-(p.xg90 || 0));
  const pAssist = 1 - Math.exp(-(p.xa90 || 0));
  const pSot = 1 - Math.exp(-((p.sh90 || 0) * 0.45));
  const kansBlock = isEspn ? '' : `
    <div class="ghdr" style="margin-top:16px">Kans per wedstrijd (seizoensgemiddelde)</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${stat('kans op goal', Math.round(pGoal*100)+'%')}
      ${stat('kans op doel', Math.round(pSot*100)+'%')}
      ${stat('kans op assist', Math.round(pAssist*100)+'%')}
    </div>`;
  const statList = isEspn ? `

// ── STANDINGS (groepsstand) ──
function renderStandings(){
  const el = document.getElementById('standingsView');

  // Match lookup
  const gm = id => MATCHES.find(m => m.id === id);

  // Get winner of a match (handles penalties)
  const win = m => {
    if(!m) return null;
    if(m.penWinner) return m.penWinner; // penalty shootout winner
    if(!m.result) return null;
    const [h,a] = m.result.split('-').map(Number);
    if(isNaN(h)||isNaN(a)) return null;
    return h > a ? m.h : a > h ? m.a : null;
  };

  // R32 → R16 → QF → SF tree
  // Each R16 match (af1-af8) comes from 2 R32 winners
  const r32feeds = {
    af1: ['r0','r3'], af2: ['r2','r5'],
    af3: ['r1','r4'], af4: ['r6','r7'],
    af5: ['r11','r10'], af6: ['r9','r8'],
    af7: ['r14','r13'], af8: ['r12','r15'],
  };

  // Get display name for a slot — tries real team first, then R32 winner, then "W. X/Y"
  const teamName = (afId, side) => {
    const m = gm(afId);
    if(m) {
      const raw = side === 'h' ? m.h : m.a;
      if(raw && !raw.startsWith('W #') && !raw.startsWith('W ')) return raw;
    }
    const feeds = r32feeds[afId];
    if(feeds) {
      const r32match = gm(feeds[side === 'h' ? 0 : 1]);
      if(!r32match) return null;
      const w = win(r32match);
      if(w) return w;
      // Geen winnaar bekend maar teams wel — toon "W. Team1/Team2"
      if(r32match.h && r32match.a) {
        const h = r32match.h.split(' ').slice(-1)[0]; // achternaam/verkorting
        const a = r32match.a.split(' ').slice(-1)[0];
        return `W. ${h}/${a}`;
      }
    }
    return null;
  };

  // Bracket match box
  const matchBox = (id, label) => {
    const m = gm(id);
    const done = m && isDone(m);
    const live = m && isLive(m);
    const w = win(m);

    // Determine team names
    let hName, aName;
    if(id.startsWith('af')) {
      hName = teamName(id, 'h');
      aName = teamName(id, 'a');
    } else if(id.startsWith('kf')) {
      // QF: winners of R16 pairs
      const pairs = {kf1:['af2','af1'], kf2:['af5','af6'], kf3:['af3','af4'], kf4:['af8','af7']};
      const [aid1, aid2] = pairs[id] || [];
      const af1m = gm(aid1), af2m = gm(aid2);
      hName = win(af1m) || (af1m ? (teamName(aid1,'h')||teamName(aid1,'a') ? '?' : null) : null);
      aName = win(af2m) || (af2m ? (teamName(aid2,'h')||teamName(aid2,'a') ? '?' : null) : null);
      if(!hName && af1m && (teamName(aid1,'h') || teamName(aid1,'a'))) hName = null;
      if(!aName && af2m && (teamName(aid2,'h') || teamName(aid2,'a'))) aName = null;
    } else if(id.startsWith('hf')) {
      const pairs = {hf1:['kf1','kf2'], hf2:['kf3','kf4']};
      const [k1,k2] = pairs[id] || [];
      hName = win(gm(k1)) || null;
      aName = win(gm(k2)) || null;
    } else if(id === 'fin') {
      hName = win(gm('hf1')) || null;
      aName = win(gm('hf2')) || null;
    } else if(id === 'tr') {
      // 3e plaats: verliezers SF
      const hf1m = gm('hf1'), hf2m = gm('hf2');
      const hf1w = win(hf1m), hf2w = win(hf2m);
      hName = hf1m?.result ? (hf1w === hf1m.h ? hf1m.a : hf1m.h) : null;
      aName = hf2m?.result ? (hf2w === hf2m.h ? hf2m.a : hf2m.h) : null;
    }

    // Gebruik echte teamnamen uit MATCHES als die niet TBD zijn
    if(m && !id.startsWith('af')) {
      if(m.h && !m.h.startsWith('W ')) hName = m.h;
      if(m.a && !m.a.startsWith('W ')) aName = m.a;
    }

    let hScore='', aScore='';
    if(m?.result){ const s=m.result.split('-'); hScore=s[0]; aScore=s[1]; }
    const penStr = m?.penWinner ? ` <span style="font-size:9px;color:var(--gold)">(pen)</span>` : '';
    const hWin = !!( (done && win(m) === hName) || (done && win(m) === m?.h) );
    const aWin = !!( (done && win(m) === aName) || (done && win(m) === m?.a) );
    const dateStr = m?.date ? new Date(m.date+'T12:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) : '';
    const timeStr = m ? `${dateStr} ${m.time}` : '';

    const teamSlot = (name, score, isWin, isDoneM) => {
      const flag = name ? F(name) : '';
      const flagOk = flag && flag.trim().length > 0 && !flag.includes('\u26BD') && !flag.includes('\uD83C\uDF10');
      const penMark = isWin && m?.penWinner ? '<span style="font-size:8px;color:var(--gold);margin-left:2px">P</span>' : '';
      return `<div class="bks${isWin?' bkw':isDoneM&&!isWin?' bkl':''}">
        <span style="font-size:15px;width:20px;flex-shrink:0;text-align:center">${flagOk?flag:name?'⚽':''}</span>
        <span class="bkn">${name || '<span style="color:var(--muted2);font-size:10px;font-style:italic">TBD</span>'}</span>
        ${(done||live) ? `<span class="bkscore">${score||'-'}${penMark}</span>` : ''}
      </div>`;
    };

    return `<div class="bkcard${live?' bklive':done?'':' bkup'}" onclick="${m?`openModal('${id}')`:''}" style="${m?'cursor:pointer':''}">
      ${timeStr ? `<div class="bktime">${live?'🔴 LIVE':done?'✓ FT':timeStr}</div>` : ''}
      ${teamSlot(hName, hScore, hWin, done)}
      <div style="height:1px;background:var(--border);margin:2px 0"></div>
      ${teamSlot(aName, aScore, aWin, done)}
    </div>`;
  };

  // Build bracket columns with connector lines
  const col = (title, ids, color) => {
    const space = 8 / ids.length; // relative vertical spacing
    return `<div class="bkcol">
      <div class="bkcolhdr" style="color:${color}">${title}</div>
      ${ids.map((id, i) => {
        const isEven = i % 2 === 1;
        return `<div class="bkrow" style="--span:${space}">
          ${matchBox(id)}
          <div class="bkline${isEven?' bkline-b':' bkline-t'}"></div>
        </div>`;
      }).join('')}
    </div>`;
  };

  el.innerHTML = `<div class="bkwrap">
    <div class="bkbracket">
      ${col('Laatste 16', ['af1','af2','af3','af4','af5','af6','af7','af8'], 'var(--accent)')}
      ${col('Kwartfinale', ['kf1','kf2','kf3','kf4'], 'var(--gold)')}
      ${col('Halve finale', ['hf1','hf2'], 'var(--lav)')}
      <div class="bkcol">
        <div class="bkcolhdr" style="color:var(--mint)">🏆 Finale</div>
        <div class="bkrow" style="--span:8">${matchBox('fin')}</div>
        <div class="bkcolhdr" style="color:var(--muted);margin-top:12px">3e Plaats</div>
        <div class="bkrow" style="--span:4">${matchBox('tr')}</div>
      </div>
    </div>
  </div>`;
}

function render(){
  buildCompNav(); // update competitie selector
  const ms=MATCHES.filter(m=>{
    if(m.date!==selDate) return false;

    if(selComp!=='all' && m.compId && m.compId != selComp) return false;

    return true;
  }).sort((a,b)=>{
    // Gewoon op tijd — gespeeld bovenaan (vroegste tijd), live ertussen, aankomend onderaan
    const aLive=isLive(a), bLive=isLive(b);
    const timeCmp = a.time.localeCompare(b.time);
    // Bij gelijke tijd: live eerst
    if(timeCmp===0){
      if(aLive&&!bLive) return -1;
      if(!aLive&&bLive) return 1;

  });

function renderMatchGroups(ms){

    else statusHtml=`<div class="mc-status status-time">${m.time}</div>`;
    if(odds && odds.h && odds.a){
      const{p1,px,p2}=probs(odds.h,odds.d,odds.a);
      const win=p1>p2&&p1>px?'h':p2>p1&&p2>px?'a':'d';
      const{t,c}=tip(p1,px,p2);
      pctHtml=`<div class="pct-bar"><div class="pb1" style="width:${p1}%"></div><div class="pbx" style="width:${px}%"></div><div class="pb2" style="width:${p2}%"></div></div>`;
      tipHtml=`<span class="tip ${c}">${t}</span>`;
      oddsHtml=`<div class="mc-odds">
        <div class="oc ${win==='h'?'w':''}"><span class="ol">1</span><span class="ov">${odds.h.toFixed(2)}</span><div class="op">${p1}%</div></div>
        <div class="oc ${win==='d'?'w':''}"><span class="ol">X</span><span class="ov">${odds.d?odds.d.toFixed(2):'-'}</span><div class="op">${px}%</div></div>
        <div class="oc ${win==='a'?'w':''}"><span class="ol">2</span><span class="ov">${odds.a.toFixed(2)}</span><div class="op">${p2}%</div></div>
      </div>`;
    }
    const hW=m.result&&parseInt(m.result[0])>parseInt(m.result[2]);
    const aW=m.result&&parseInt(m.result[2])>parseInt(m.result[0]);
    const isSel = selectedMatchIds.has(m.id);
    const canSelect = !done && !live; // alleen aankomende wedstrijden

      <div class="mc-inner">
        <div class="mc-top">
          <div class="mc-league">${m.compName ? '' : '🌍 '}${RL(m.g, m)}</div>
          <div style="display:flex;align-items:center;gap:8px">
            ${statusHtml}
            ${canSelect?`<div class="sel-toggle ${isSel?'sel-on':''}" onclick="event.stopPropagation();toggleSelect('${m.id}')" title="Toevoegen aan dagtip">${isSel?'✓':''}</div>`:''}
          </div>
        </div>
        <div class="mc-body">
          <div class="mc-teams">
            <div class="team-row"><span class="tflag">${hf}</span><span class="tname ${hW?'w':''}">${m.h}</span></div>
            <div class="team-row" style="margin-top:5px"><span class="tflag">${af}</span><span class="tname ${aW?'w':''}">${m.a}</span></div>
            ${pctHtml}

          <div class="mc-score">
            ${m.result?`<div class="score">${m.result[0]}<br>${m.result[2]}</div>`:

    return compLabel(a).localeCompare(compLabel(b), 'nl');

  document.getElementById('mc').innerHTML = keys.map((key,idx)=>{

      </div>
      ${open ? `<div class="comp-group-body">${list.map(cardHtml).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

function openModal(id){

  const live=isLive(m);

  document.getElementById('mtitle').innerHTML=`${hf} ${m.h} vs ${m.a} ${af}`;
  let oddsHtml='',p1=33,px=33,p2=34;
  if(odds){
    ({p1,px,p2}=probs(odds.h,odds.d,odds.a));
    const win=p1>p2&&p1>px?'h':p2>p1&&p2>px?'a':'d';
    const oddsAge=fmtTime(odds.fetchedAt||oddsUpdatedAt);
    oddsHtml=`<div class="md-odds">
      <div class="mdo ${win==='h'?'w':''}"><span class="mdol">1</span><span class="mdov">${odds.h.toFixed(2)}</span><div class="mdop">${p1}%</div></div>
      <div class="mdo ${win==='d'?'w':''}"><span class="mdol">X</span><span class="mdov">${odds.d?odds.d.toFixed(2):'-'}</span><div class="mdop">${px}%</div></div>
      <div class="mdo ${win==='a'?'w':''}"><span class="mdol">2</span><span class="mdov">${odds.a.toFixed(2)}</span><div class="mdop">${p2}%</div></div>
    </div>${oddsAge?`<div class="supdated">Odds opgehaald: ${oddsAge}</div>`:''}`;
  }
  const topBox=m.result?`<div class="rbox">✅ Eindstand: <strong>${m.h} ${m.result} ${m.a}</strong></div>`:
    live?`<div class="lbox"><div class="ldot"></div><strong>LIVE</strong> — wedstrijd is nu bezig!</div>`:'';
  // Beste Bet alleen tonen als er geen AI analyse komt (gespeelde wedstrijd)
  const bb = buildBestBet(m, null, odds);
  const showStaticBet = !!m.result;
  const bbHtml=bb&&showStaticBet?`<div class="bb">
    <div class="bbl">${bb.label}</div>
    <div class="bbt">${bb.title}</div>
    <div class="bbw">${bb.body}</div>
  </div>`:'';
  const hs=GS(m.h),as=GS(m.a);
  const hLinup = PLAYER_STATS[m.h] || [];
  const aLinup = PLAYER_STATS[m.a] || [];

  const pc=(ps, linup, team)=>{
    if(linup && linup.length){
      const gp = linup[0]?.matches || 1;
      return linup.slice(0,3).map((p,i)=>{
        // Bereken gemiddelden on-the-fly als avg_ velden ontbreken (oud formaat)
        const matches = p.matches || 1;
        const avgXg = p.avg_xg ?? (p.xg_total != null ? p.xg_total/matches : (p.xg ?? 0));
        const avgSot = p.avg_sot ?? (p.sot_total != null ? p.sot_total/matches : (p.sot ?? 0));
        const avgShots = p.avg_shots ?? (p.shots_total != null ? p.shots_total/matches : (p.shots ?? 0));
        const avgRating = p.avg_rating ?? p.rating ?? null;
        return `<div class="pc">
          <div class="pmed">${['🥇','🥈','🥉'][i]}</div>
          <div class="pinf">

      }).join('') + `<div class="snote" style="margin-top:6px">Gemiddelden over ${gp} WK-wedstrijd${gp>1?'en':''} · gesorteerd op rating</div>`;
    }
    if(!ps||!ps.length) return `<div class="nodata">Nog geen spelersdata voor ${team}<br><span style="font-size:10px;color:var(--muted2)">Beschikbaar na hun eerste WK-wedstrijd</span></div>`;

    </div>`).join('') + `<div class="snote" style="margin-top:6px">Globale WK-topscorers — geen per-wedstrijd data</div>`;

  const propRow = p => {
    const pGoal = 1 - Math.exp(-(p.xg90 || 0));

    return `<div class="pc">

  };
  const propBlock = team => {
    const norm = t => (t||'').toLowerCase().trim();
    const players = ALL_PLAYERS.filter(p => norm(p.team) === norm(team) && p.min > 0)
      .sort((a,b) => (b.xg90+b.xa90) - (a.xg90+a.xa90)).slice(0,3);
    if(!players.length) return '';
    return `<div class="shdr"><span class="sname">${team}</span><span class="slbl">Speler kansen dit seizoen</span></div>${players.map(propRow).join('')}<div class="snote" style="margin-top:6px">Kansschatting o.b.v. Understat seizoensgemiddelden (xG/xA/schoten per 90 min) — geen garantie, check je boekmaker</div>`;

  const propHtml = propBlock(m.h) + propBlock(m.a);

      </div>
    </div>
    ${bbHtml}
    ${propHtml}
    ${hLinup.length || (hs&&hs.length) ? shdrH + pc(hs, hLinup, m.h) : ''}
    ${aLinup.length || (as&&as.length) ? shdrA + pc(as, aLinup, m.a) : ''}

  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';

  // AI bet genereren — alleen voor aankomende wedstrijden (niet voor al gespeelde)
  if(!m.result) generateAiBet(m, odds, hLinup, aLinup);
  else document.getElementById('ai-bet-box').style.display='none';
}

        <div style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px">${tip.onderbouwing}</div>
      </div>`;
    };
    el.innerHTML = reliabilityHtml + bet.map(tipHtml).join("") +
      `<div style="font-size:11px;color:var(--muted2);text-align:center;margin-top:4px">→ Check quotes bij je boekmaker · Combineer in Bet Builder</div>`;

  } catch(e) {

  }
}

// Verschillende databronnen spellen dezelfde club soms anders (accenten,
// clubprefix als "GNK", afkortingen als "Din." i.p.v. "Dinamo", of een
// verkorte naam als "Lyon" i.p.v. "Olympique Lyonnais") — vandaar fuzzy-match
// i.p.v. exacte string-gelijkheid, anders ontstaan dubbele wedstrijdkaarten.
function normTeam(s){
  return (s||'')
    .normalize('NFD').replace(/\p{Diacritic}/gu, '')
    .toLowerCase()
    .replace(/\./g, '')
    .replace(/\b(fc|sc|afc|cf|vv|ud|cd|ac|sk|nk|fk|gnk|ol|if|bk|ik|ca|sd|kf|as|ss|us|cs|ssc|ssd)\b/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function teamsMatch(a, b){
  const na = normTeam(a), nb = normTeam(b);
  if(!na || !nb) return false;
  if(na === nb) return true;
  if(na.length > 3 && nb.length > 3 && (na.includes(nb) || nb.includes(na))) return true;
  const ta = na.split(' '), tb = nb.split(' ');
  if(ta.length !== tb.length) return false;
  return ta.every((t,i) => t===tb[i] || (t.length>=3 && tb[i].startsWith(t)) || (tb[i].length>=3 && t.startsWith(tb[i])));
}

function mergeLive(liveMatches){
  if(!liveMatches||!liveMatches.length) return;
  for(const m of MATCHES){
    const hit = liveMatches.find(x=>
      (x.h===m.h && x.a===m.a) || (x.h===m.a && x.a===m.h)
    );
    if(!hit) continue;
    if(hit.result) m.result = hit.result;
    m.apiLive = !!hit.live;
  }
}
function mergeOdds(oddsRes){
  if(!oddsRes || !oddsRes.odds) return;
  Object.assign(ODDS, oddsRes.odds); // API-odds overschrijven/vullen aan op de hardcoded set
  oddsUpdatedAt = oddsRes.updatedAt || new Date().toISOString();
}
function mergeTopscorers(liveTop, updatedAt){
  if(!liveTop) return;
  for(const team in liveTop){
    if(liveTop[team] && liveTop[team].length) SH[team] = liveTop[team];
  }
  topscorersUpdatedAt = updatedAt || new Date().toISOString();
}
function mergeGroups(groupsRes){
  if(!groupsRes || !groupsRes.groups) return;
  GROUPS = groupsRes.groups;
  groupsUpdatedAt = groupsRes.updatedAt || new Date().toISOString();
}

async function fetchLiveData(){
  if(!WORKER_URL) return;
  try{
    // Haal alle competities op + odds + player stats + standen
    const compUrl = selComp === 'all'
      ? WORKER_URL+'/matches'
      : WORKER_URL+'/matches?comp='+selComp;
    const standingsUrl = selComp === 'all'
      ? WORKER_URL+'/standings'
      : WORKER_URL+'/standings?comp='+selComp;
    const playerUrl = selComp === 'all'
      ? WORKER_URL+'/player-stats'
      : WORKER_URL+'/player-stats?comp='+selComp;
    const [matchRes, oddsRes, playerRes, standingsRes] = await Promise.all([
      fetch(compUrl).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(WORKER_URL+'/odds').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(playerUrl).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(standingsUrl).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    // Nieuwe matches uit Worker toevoegen aan MATCHES
    if(matchRes?.matches?.length) mergeNewMatches(matchRes.matches);
    if(oddsRes) mergeOdds(oddsRes);
    if(playerRes) { const {_processed,...stats}=playerRes; PLAYER_STATS=stats; }
    if(standingsRes) mergeMultiStandings(standingsRes);
    if(oddsRes?.matches) ODDS_API_DATA = oddsRes.matches;
    updateKnockoutNames();
  }catch(e){
    console.warn('Live data ophalen mislukt:', e);
  }
}

// Voeg nieuwe matches uit Worker toe aan MATCHES array (dedupliceert op apiId, anders op teamnamen + datum)
function mergeNewMatches(newMatches){
  for(const nm of newMatches){
    // Kijk of match al bestaat — apiId is leidend; zonder apiId matchen we op
    // teams EN datum, want teams spelen vaak twee keer (heen/terug) tegen elkaar
    const existing = MATCHES.find(m =>
      (nm.apiId && m.apiId === nm.apiId) ||
      (m.date === nm.date &&
        ((teamsMatch(m.h,nm.h) && teamsMatch(m.a,nm.a)) || (teamsMatch(m.h,nm.a) && teamsMatch(m.a,nm.h))))
    );
    if(existing){
      // Update result/live status
      if(nm.result) existing.result = nm.result;
      existing.apiLive = !!nm.live;
      // Live data is betrouwbaarder (correcte accenten/volledige naam) dan
      // hardcoded seed-namen — en zorgt dat compId/round meekomen zodra bekend
      if(nm.h) existing.h = nm.h;
      if(nm.a) existing.a = nm.a;
      if(nm.apiId && !existing.apiId) existing.apiId = nm.apiId;
      if(nm.venue && !existing.venue) existing.venue = nm.venue;
      if(nm.round) existing.round = nm.round;
    } else {
      // Nieuwe match toevoegen
      MATCHES.push({
        id: 'dyn_'+(nm.apiId||Math.random().toString(36).slice(2)),
        apiId: nm.apiId,
        g: nm.compName || nm.compFlag || nm.round || '?',
        compId: nm.compId,
        compName: nm.compName,
        compFlag: nm.compFlag,
        date: nm.date,
        time: nm.time,
        h: nm.h, a: nm.a,
        venue: nm.venue || '',
        result: nm.result || null,
        round: nm.round || '',
      });
    }
  }
}

// ── BET KANSBEREKENING (Poisson model) ──
// Poisson kans: P(X=k) = e^(-λ) * λ^k / k!
function poisson(lambda, k) {
  if(lambda <= 0) return k === 0 ? 1 : 0;
  let p = Math.exp(-lambda);
  for(let i = 0; i < k; i++) p *= lambda / (i + 1);
  return p;
}
function poissonAtLeast(lambda, k) {
  let cumulative = 0;
  for(let i = 0; i < k; i++) cumulative += poisson(lambda, i);
  return Math.round((1 - cumulative) * 100);
}
function poissonAtMost(lambda, k) {
  let cumulative = 0;
  for(let i = 0; i <= k; i++) cumulative += poisson(lambda, i);
  return Math.round(cumulative * 100);
}

function getOddsApiMatch(h, a) {
  // Zoek in ODDS_API_DATA (key = "Home_Away") naar de odds voor deze wedstrijd
  const keys = Object.keys(ODDS_API_DATA);
  for(const key of keys) {
    const d = ODDS_API_DATA[key];
    if(!d?.h) continue;
    const hMatch = d.h.toLowerCase().includes(h.toLowerCase().slice(0,5)) || h.toLowerCase().includes(d.h.toLowerCase().slice(0,5));
    const aMatch = d.a.toLowerCase().includes(a.toLowerCase().slice(0,5)) || a.toLowerCase().includes(d.a.toLowerCase().slice(0,5));
    if(hMatch && aMatch) return d;
  }
  return null;
}

function getRealOddForBet(bet, matchH, matchA) {
  const d = getOddsApiMatch(matchH, matchA);
  if(!d?.odds) return null;
  const b = bet.toLowerCase();
  const h = matchH.toLowerCase(), a = matchA.toLowerCase();

  // 1X2
  if((b.includes(h.slice(0,4)) || b.includes('thuis')) && (b.includes('wint') || b.includes('win'))) return d.odds['1X2']?.h;
  if((b.includes(a.slice(0,4)) || b.includes('uit')) && (b.includes('wint') || b.includes('win'))) return d.odds['1X2']?.a;
  if(b.includes('gelijkspel') && !b.includes('no bet') && !b.includes('draw no') && !b.includes('1x') && !b.includes('x2') && !b.includes('12')) return d.odds['1X2']?.d;

  // BTTS
  if(b.includes('beide teams') || b.includes('btts') || b.includes('both teams')) {
    if(b.includes('ja') || b.includes('yes')) return d.odds['BTTS']?.yes;
    if(b.includes('nee') || b.includes('no')) return d.odds['BTTS']?.no;
  }

  // Over/Under
  if(b.includes('over 2.5')) return d.odds['O/U_2.5']?.over;
  if(b.includes('under 2.5') || b.includes('onder 2.5')) return d.odds['O/U_2.5']?.under;
  if(b.includes('over 1.5')) return d.odds['O/U_1.5']?.over;
  if(b.includes('under 1.5') || b.includes('onder 1.5')) return d.odds['O/U_1.5']?.under;
  if(b.includes('over 3.5')) return d.odds['O/U_3.5']?.over;
  if(b.includes('under 3.5') || b.includes('onder 3.5')) return d.odds['O/U_3.5']?.under;

  // Double Chance
  if(b.includes('of gelijkspel') || b.includes('(1x)') || b === '1x') return d.odds['DC_1X'];
  if(b.includes('(x2)') || b === 'x2') return d.odds['DC_X2'];
  if(b.includes('(12)') || b === '12') return d.odds['DC_12'];

  return null;
}

function calculateBetProbs(m, odds, hLinup, aLinup) {
  const hRow = teamStanding(m.h);
  const aRow = teamStanding(m.a);
  const bets = [];

  // ── 1X2 uit odds ──
  if(odds) {
    const r1=1/odds.h, rx=1/odds.d, r2=1/odds.a, tot=r1+rx+r2;
    const p1=Math.round(r1/tot*100), px=Math.round(rx/tot*100), p2=Math.round(r2/tot*100);
    bets.push({type:'1X2', bet:`${m.h} wint`, kans:p1, match:`${m.h} vs ${m.a}`});
    bets.push({type:'1X2', bet:`Gelijkspel`, kans:px, match:`${m.h} vs ${m.a}`});
    bets.push({type:'1X2', bet:`${m.a} wint`, kans:p2, match:`${m.h} vs ${m.a}`});
  }

  // ── BTTS & Over/Under via Poisson ──
  if(hRow?.played && aRow?.played) {
    const hGF = hRow.gf / hRow.played;
    const hGA = hRow.ga / hRow.played;
    const aGF = aRow.gf / aRow.played;
    const aGA = aRow.ga / aRow.played;
    const hExpected = (hGF + aGA) / 2;
    const aExpected = (aGF + hGA) / 2;
    const totalExp = hExpected + aExpected;
    const hExpHalf = hExpected / 2;
    const aExpHalf = aExpected / 2;

    // BTTS
    const pHScores = poissonAtLeast(hExpected, 1);
    const pAScores = poissonAtLeast(aExpected, 1);
    const pBTTS = Math.round(pHScores/100 * pAScores/100 * 100);
    bets.push({type:'BTTS', bet:'Beide teams scoren: JA', kans:pBTTS, match:`${m.h} vs ${m.a}`, detail:`h exp ${nf(hExpected)} / a exp ${nf(aExpected)}`});
    bets.push({type:'BTTS', bet:'Beide teams scoren: NEE', kans:100-pBTTS, match:`${m.h} vs ${m.a}`});

    // Over/Under
    bets.push({type:'O/U', bet:'Over 1.5 doelpunten', kans:poissonAtLeast(totalExp,2), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Over 2.5 doelpunten', kans:poissonAtLeast(totalExp,3), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Over 3.5 doelpunten', kans:poissonAtLeast(totalExp,4), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Under 2.5 doelpunten', kans:poissonAtMost(totalExp,2), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Under 3.5 doelpunten', kans:poissonAtMost(totalExp,3), match:`${m.h} vs ${m.a}`});
    bets.push({type:'O/U', bet:'Under 1.5 doelpunten', kans:poissonAtMost(totalExp,1), match:`${m.h} vs ${m.a}`});

    // 1e Helft Over/Under
    bets.push({type:'1e Helft O/U', bet:'1e helft Over 0.5', kans:poissonAtLeast(hExpHalf+aExpHalf,1), match:`${m.h} vs ${m.a}`});
    bets.push({type:'1e Helft O/U', bet:'1e helft Under 1.5', kans:poissonAtMost(hExpHalf+aExpHalf,1), match:`${m.h} vs ${m.a}`});
    bets.push({type:'1e Helft O/U', bet:'1e helft Over 1.5', kans:poissonAtLeast(hExpHalf+aExpHalf,2), match:`${m.h} vs ${m.a}`});

    // Clean sheet
    const pHCS = poissonAtMost(aExpected,0);
    const pACS = poissonAtMost(hExpected,0);
    bets.push({type:'Clean Sheet', bet:`${m.h} clean sheet`, kans:pHCS, match:`${m.h} vs ${m.a}`});
    bets.push({type:'Clean Sheet', bet:`${m.a} clean sheet`, kans:pACS, match:`${m.h} vs ${m.a}`});

    // Team scoort 2+
    bets.push({type:'Team goals', bet:`${m.h} scoort 2+`, kans:poissonAtLeast(hExpected,2), match:`${m.h} vs ${m.a}`});
    bets.push({type:'Team goals', bet:`${m.a} scoort 2+`, kans:poissonAtLeast(aExpected,2), match:`${m.h} vs ${m.a}`});

    // Draw No Bet (alleen als 1X2 odds bekend zijn)
    if(odds) {
      const r1=1/odds.h, rx=1/odds.d, r2=1/odds.a, tot=r1+rx+r2;
      const p1=r1/tot, p2=r2/tot;
      // Draw No Bet kans = kans op winst gedeeld door (1 - kans gelijkspel)
      const pDNB1 = Math.round(p1/(p1+p2)*100);
      const pDNB2 = Math.round(p2/(p1+p2)*100);
      bets.push({type:'Draw No Bet', bet:`${m.h} Draw No Bet`, kans:pDNB1, match:`${m.h} vs ${m.a}`, detail:'geld terug bij gelijkspel'});
      bets.push({type:'Draw No Bet', bet:`${m.a} Draw No Bet`, kans:pDNB2, match:`${m.h} vs ${m.a}`, detail:'geld terug bij gelijkspel'});

      const px=rx/tot;
      // Double Chance
      bets.push({type:'Double Chance', bet:`${m.h} of Gelijkspel (1X)`, kans:Math.round((p1+px)*100), match:`${m.h} vs ${m.a}`});
      bets.push({type:'Double Chance', bet:`${m.a} of Gelijkspel (X2)`, kans:Math.round((p2+px)*100), match:`${m.h} vs ${m.a}`});
      bets.push({type:'Double Chance', bet:`${m.h} of ${m.a} (12)`, kans:Math.round((p1+p2)*100), match:`${m.h} vs ${m.a}`});

      // Handicap -1 (favoriet moet met 2+ winnen)
      if(p1 > 0.45) { // alleen als favoriet duidelijk
        const pHandicap = poissonAtLeast(hExpected, 2) * poissonAtMost(aExpected, 0) / 100 +
          poissonAtLeast(hExpected, 3) * poissonAtLeast(aExpected, 1) / 100;
        bets.push({type:'Handicap', bet:`${m.h} -1 handicap`, kans:Math.min(Math.round(p1*80), 85), match:`${m.h} vs ${m.a}`, detail:'wint met 2+ goals verschil'});
      }
      if(p2 > 0.45) {
        bets.push({type:'Handicap', bet:`${m.a} -1 handicap`, kans:Math.min(Math.round(p2*80), 85), match:`${m.h} vs ${m.a}`, detail:'wint met 2+ goals verschil'});
      }

      // 1x2 & BTTS combinaties
      bets.push({type:'1X2 & BTTS', bet:`${m.h} wint & BTTS JA`, kans:Math.round(p1*pBTTS/100*100*0.85), match:`${m.h} vs ${m.a}`});
      bets.push({type:'1X2 & BTTS', bet:`${m.h} wint & BTTS NEE`, kans:Math.round(p1*(100-pBTTS)/100*100*0.9), match:`${m.h} vs ${m.a}`});
      if(p2 > 0.15) bets.push({type:'1X2 & BTTS', bet:`${m.a} wint & BTTS JA`, kans:Math.round(p2*pBTTS/100*100*0.85), match:`${m.h} vs ${m.a}`});

      // 1x2 & Over/Under combinaties
      const pOver25 = poissonAtLeast(totalExp,3);
      const pUnder25 = poissonAtMost(totalExp,2);
      bets.push({type:'1X2 & O/U', bet:`${m.h} wint & Over 1.5`, kans:Math.round(p1*poissonAtLeast(totalExp,2)/100*100*0.9), match:`${m.h} vs ${m.a}`});
      bets.push({type:'1X2 & O/U', bet:`${m.h} wint & Under 3.5`, kans:Math.round(p1*poissonAtMost(totalExp,3)/100*100*0.9), match:`${m.h} vs ${m.a}`});
      bets.push({type:'1X2 & O/U', bet:`${m.h} wint & Over 2.5`, kans:Math.round(p1*pOver25/100*100*0.85), match:`${m.h} vs ${m.a}`});

      // HT/FT (rust/eindstand)
      // HT1/FT1: sterkste favoriet leidt rust EN wint
      if(p1 > 0.5) {
        const pHT1FT1 = Math.round(p1 * 0.65 * 100); // ~65% kans dat als ze winnen ze ook voorstaan
        bets.push({type:'HT/FT', bet:`${m.h} rust & ${m.h} einde (1/1)`, kans:pHT1FT1, match:`${m.h} vs ${m.a}`, detail:'leidt bij rust én wint'});
      }
      if(p2 > 0.5) {
        const pHT2FT2 = Math.round(p2 * 0.65 * 100);
        bets.push({type:'HT/FT', bet:`${m.a} rust & ${m.a} einde (2/2)`, kans:pHT2FT2, match:`${m.h} vs ${m.a}`, detail:'leidt bij rust én wint'});
      }

      // Double Chance & O/U
      bets.push({type:'DC & O/U', bet:`${m.h} of Gelijkspel & Under 2.5`, kans:Math.round((p1+px)*pUnder25/100*100*0.9), match:`${m.h} vs ${m.a}`});
      bets.push({type:'DC & O/U', bet:`${m.h} of Gelijkspel & Over 1.5`, kans:Math.round((p1+px)*poissonAtLeast(totalExp,2)/100*100*0.9), match:`${m.h} vs ${m.a}`});
    }
  }

  // ── Speler bets via Poisson ──
  const allPlayers = [
    ...(hLinup||[]).slice(0,5).map(p=>({...p,side:'h'})),
    ...(aLinup||[]).slice(0,5).map(p=>({...p,side:'a'}))
  ];
  for(const p of allPlayers) {
    const matches = p.matches || 1;
    const xg = p.avg_xg ?? (p.xg_total != null ? p.xg_total/matches : (p.xg ?? 0));
    const sot = p.avg_sot ?? (p.sot_total != null ? p.sot_total/matches : (p.sot ?? 0));
    const shots = p.avg_shots ?? (p.shots_total != null ? p.shots_total/matches : (p.shots ?? 0));

    if(xg > 0) {
      const pScores = Math.round((1 - Math.exp(-xg)) * 100);
      bets.push({type:'Speler scoort', bet:`${p.n} scoort`, kans:pScores, match:`${m.h} vs ${m.a}`, detail:`xG/wed: ${nf(xg)}`});
    }
    if(sot > 0) {
      bets.push({type:'Speler SoT', bet:`${p.n} 1+ schot op doel`, kans:poissonAtLeast(sot,1), match:`${m.h} vs ${m.a}`, detail:`SoT/wed: ${nf(sot,1)}`});
      if(sot >= 1.5) bets.push({type:'Speler SoT', bet:`${p.n} 2+ schoten op doel`, kans:poissonAtLeast(sot,2), match:`${m.h} vs ${m.a}`});
    }
    if(shots > 0) {
      bets.push({type:'Speler sch', bet:`${p.n} 1+ schot`, kans:poissonAtLeast(shots,1), match:`${m.h} vs ${m.a}`, detail:`sch/wed: ${nf(shots,1)}`});
    }
    if(xg > 0 || sot > 0) {
      const pShotOrGoal = Math.min(99, Math.round((1 - Math.exp(-(xg + sot*0.3))) * 100));
      bets.push({type:'Speler betrokken', bet:`${p.n} scoort of assist`, kans:Math.round((1-Math.exp(-(xg+(p.assists/Math.max(p.matches||1,1)*0.5))))*100), match:`${m.h} vs ${m.a}`});
    }
  }

  // ── Speler bets via Understat-seizoensdata (clubcompetities) ──
  // Vult aan naast/i.p.v. de WK-only PLAYER_STATS hierboven — dekt de 6
  // door de scraper ondersteunde clubcompetities (zie scrape-players.mjs).
  const norm = t => (t||'').toLowerCase().trim();
  const understatPlayers = (ALL_PLAYERS||[])
    .filter(p => (norm(p.team) === norm(m.h) || norm(p.team) === norm(m.a)) && p.min > 0)
    .sort((a,b) => (blendedRate(b,'xg90')+blendedRate(b,'xa90')) - (blendedRate(a,'xg90')+blendedRate(a,'xa90'))).slice(0,6);
  for(const p of understatPlayers){
    const bXg90 = blendedRate(p,'xg90'), bXa90 = blendedRate(p,'xa90'), bSh90 = blendedRate(p,'sh90');
    const pGoal = Math.round((1 - Math.exp(-bXg90)) * 100);
    const pSot = Math.round((1 - Math.exp(-(bSh90*0.45))) * 100);
    const pAssist = Math.round((1 - Math.exp(-bXa90)) * 100);
    if(p.xg90 > 0) bets.push({type:'Speler scoort', bet:`${p.name} scoort`, kans:pGoal, match:`${m.h} vs ${m.a}`, detail:`xG90: ${nf(p.xg90,2)} · seizoen ${p.season}`});
    if(p.sh90 > 0) bets.push({type:'Speler SoT', bet:`${p.name} 1+ schot op doel`, kans:pSot, match:`${m.h} vs ${m.a}`, detail:`Sh90: ${nf(p.sh90,2)} · seizoen ${p.season}`});
    if(p.xa90 > 0) bets.push({type:'Speler assist', bet:`${p.name} geeft assist`, kans:pAssist, match:`${m.h} vs ${m.a}`, detail:`xA90: ${nf(p.xa90,2)} · seizoen ${p.season}`});
  }

  // Sorteer op kans (hoogste eerst)
  return bets.sort((a,b) => b.kans - a.kans);
}

  else selectedMatchIds.add(id);

// ── KNOCKOUT NAMEN AUTO-UPDATE ──
// Vult echte teamnamen in na elke live data refresh
function updateKnockoutNames(){
  const gm = id => MATCHES.find(m => m.id === id);
  const win = m => {
    if(!m) return null;
    if(m.penWinner) return m.penWinner;
    if(!m.result) return null;
    const [h,a] = m.result.split('-').map(Number);
    return h > a ? m.h : a > h ? m.a : null;
  };

  // R32 → R16 mapping
  const r32feeds = {
    af1:['r0','r3'], af2:['r2','r5'], af3:['r1','r4'], af4:['r6','r7'],
    af5:['r11','r10'], af6:['r9','r8'], af7:['r14','r13'], af8:['r12','r15'],
  };

  // Update R16 (af1-af8) met R32 winnaars
  for(const [afId, feeds] of Object.entries(r32feeds)){
    const m = gm(afId);
    if(!m) continue;
    const hWin = win(gm(feeds[0]));
    const aWin = win(gm(feeds[1]));
    if(hWin && (m.h.startsWith('W ') || m.h === hWin)) m.h = hWin;
    else if(hWin && !m.h.startsWith('W ')) {} // al ingevuld, niet overschrijven
    else if(hWin) m.h = hWin;
    if(aWin && (m.a.startsWith('W ') || m.a === aWin)) m.a = aWin;
    else if(aWin && !m.a.startsWith('W ')) {}
    else if(aWin) m.a = aWin;
  }

  // Update QF (kf1-kf4) met R16 winnaars
  const r16feeds = {
    kf1:['af2','af1'], kf2:['af5','af6'], kf3:['af3','af4'], kf4:['af8','af7'],
  };
  for(const [kfId, feeds] of Object.entries(r16feeds)){
    const m = gm(kfId);
    if(!m) continue;
    const hWin = win(gm(feeds[0]));
    const aWin = win(gm(feeds[1]));
    if(hWin) m.h = hWin;
    if(aWin) m.a = aWin;
  }

  // Update SF (hf1-hf2) met QF winnaars
  const qfFeeds = {hf1:['kf1','kf2'], hf2:['kf3','kf4']};
  for(const [hfId, feeds] of Object.entries(qfFeeds)){
    const m = gm(hfId);
    if(!m) continue;
    const hWin = win(gm(feeds[0]));
    const aWin = win(gm(feeds[1]));
    if(hWin) m.h = hWin;
    if(aWin) m.a = aWin;
  }

  // Update Finale en 3e Plaats
  const fin = gm('fin'), tr = gm('tr');
  const hf1w = win(gm('hf1')), hf2w = win(gm('hf2'));
  const hf1m = gm('hf1'), hf2m = gm('hf2');
  if(fin){ if(hf1w) fin.h=hf1w; if(hf2w) fin.a=hf2w; }
  if(tr && hf1m?.result){
    tr.h = hf1m.result ? (hf1w===hf1m.h ? hf1m.a : hf1m.h) : tr.h;
  }
  if(tr && hf2m?.result){
    tr.a = hf2m.result ? (hf2w===hf2m.h ? hf2m.a : hf2m.h) : tr.a;
  }
}

async function generateOverallBet(){
  if(!WORKER_URL) return;
  const btn = document.querySelector('.overall-bet-btn');
  if(btn) { btn.disabled = true; btn.innerHTML = '⏳ Analyseren...'; }

  // Open modal meteen met loading state
  document.getElementById('match-modal').style.display = 'none';
  document.getElementById('ob-modal').style.display = '';
  const resultEl = document.getElementById('ob-modal-body');
  resultEl.innerHTML = '<div style="text-align:center;padding:40px"><div class="ai-spinner" style="margin:0 auto 16px"></div><div style="color:var(--muted)">Alle wedstrijden analyseren...</div><div style="font-size:11px;color:var(--muted2);margin-top:6px">Kansen berekenen · Odds ophalen · Combinatie samenstellen</div></div>';
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';

  // Verzamel aankomende wedstrijden van vandaag én morgen
  const tomorrow = new Date(new Date(selDate).getTime() + 24*60*60*1000).toISOString().split('T')[0];
  // Gebruik geselecteerde wedstrijden als die er zijn, anders vandaag + morgen
  const ms = selectedMatchIds.size > 0
    ? MATCHES.filter(m => selectedMatchIds.has(m.id) && !isDone(m) && !isLive(m))
    : MATCHES.filter(m =>
        (m.date === selDate || m.date === tomorrow) && !isDone(m) && !isLive(m)
      ).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

  // Bouw matchdata op per wedstrijd
  // Pre-bereken kansen voor alle wedstrijden
  const allMatchBets = ms.map(m => {
    const mOdds = getOdds(m.h, m.a);
    const mH = (PLAYER_STATS[m.h] || []);
    const mA = (PLAYER_STATS[m.a] || []);
    const bets = calculateBetProbs(m, mOdds, mH, mA);
    const topBets = bets.filter(b => b.kans >= 45 && b.kans <= 85).slice(0, 15);
    const oddsApiM = getOddsApiMatch(m.h, m.a);
    const realO = oddsApiM?.odds;
    const realOStr = realO ? ` [echte odds:${realO["BTTS"] ? ` BTTS Ja=${realO["BTTS"].yes} Nee=${realO["BTTS"].no}` : ""}${realO["O/U_2.5"] ? ` O2.5=${realO["O/U_2.5"].over} U2.5=${realO["O/U_2.5"].under}` : ""}${realO["1X2"] ? ` 1X2 h=${realO["1X2"].h} d=${realO["1X2"].d} a=${realO["1X2"].a}` : ""}]` : "";
    return `WEDSTRIJD: ${m.h} vs ${m.a} (${m.compName || 'WK 2026'}, ${m.time} NL${m.date !== selDate ? " morgen" : ""})${realOStr}\n` +
      topBets.map(b => `  ${b.type} | ${b.bet} | ${b.kans}%${b.detail?" ("+b.detail+")":""}`).join("\n");
  }).join("\n---\n");
  const prompt = `Je bent een sportsbetting analist voor voetbal. Alle kansen zijn wiskundig berekend met Poisson — gebruik deze EXACT.

DOEL: Kies het optimale aantal onderdelen (1 tot 10) uit VERSCHILLENDE wedstrijden.
Regels:
- 1 bet: alleen als die 85%+ heeft
- 2-3 bets: gecombineerd 60%+
- 4-6 bets: gecombineerd 40%+, maar elke losse bet 70%+
- 7-10 bets: alleen als elke losse bet 80%+ heeft
- Meer bets = hogere quote maar lager zekerheid — kies het beste evenwicht
Gecombineerde kans = kans1/100 x kans2/100 x ... x 100. Gebruik exact de kansen uit de lijst.

PRE-BEREKENDE KANSEN PER WEDSTRIJD:
${allMatchBets || "Onvoldoende data"}

Antwoord ALLEEN in dit JSON formaat:
{"tip":"<samenvatting>","onderdelen":[{"wedstrijd":"<thuis vs uit>","bet":"<bet uit lijst>","kans":<getal>},{"wedstrijd":"...","bet":"...","kans":<getal>}],"gecombineerde_kans":<product>,"onderbouwing":"<2-3 zinnen>","risico":"laag|middel","data_basis":"<cijfers>"}`;

  try {
    const res = await fetch(WORKER_URL + '/ai-bet', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    const text = String(data.content?.[0]?.text ?? '');
    if(!text){ resultEl.innerHTML = `<div class="overall-bet-panel"><div style="color:var(--muted2)">Geen response ontvangen</div></div>`; return; }

    let bet;
    try {
      let clean = text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/\s*```$/i,'').trim();
      const f=clean.indexOf('{'), l=clean.lastIndexOf('}');
      if(f!==-1&&l!==-1) clean=clean.slice(f,l+1);
      bet = JSON.parse(clean);
    } catch(e) {
      resultEl.innerHTML = `<div class="overall-bet-panel"><div style="font-size:12px">${text.replace(/</g,'&lt;').slice(0,500)}</div></div>`;
      return;
    }

    const onderdelen = Array.isArray(bet.onderdelen) ? bet.onderdelen : [];
    const combKans = bet.gecombineerde_kans ?? 0;
    const combKleur = combKans >= 65 ? 'var(--mint)' : combKans >= 50 ? 'var(--gold)' : 'var(--peach)';
    const riskColor = bet.risico==='laag'?'var(--mint)':'var(--gold)';

    // Bereken gecombineerde quote op basis van echte odds
    let totalOdd = 1;
    let allHaveOdds = true;
    const legsHtml = onderdelen.map(o => {
      const k = o.kans ?? 0;
      const kl = k>=70?'var(--mint)':k>=50?'var(--gold)':'var(--peach)';
      // Probeer odds te vinden: eerst via wedstrijd-veld, dan via bet-tekst zelf
      let realOdd = null;
      const wedstr = o.wedstrijd || '';
      const parts = wedstr.split(' vs ');
      if(parts.length >= 2) {
        realOdd = getRealOddForBet(o.bet, parts[0].trim(), parts[1].trim());
      }
      // Fallback: zoek in alle ODDS_API_DATA wedstrijden of de bet-tekst matcht
      if(!realOdd) {
        for(const key in ODDS_API_DATA) {
          const d = ODDS_API_DATA[key];
          if(!d?.h) continue;
          const odd = getRealOddForBet(o.bet, d.h, d.a);
          if(odd) { realOdd = odd; break; }
        }
      }
      if(realOdd) totalOdd *= realOdd; else allHaveOdds = false;
      const oddTxt = realOdd ? ' <span style="background:rgba(251,191,36,.15);color:var(--gold);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px">' + realOdd.toFixed(2) + '</span>' : '';
      return '<div class="ob-leg"><div style="flex:1"><div style="font-weight:600">✓ ' + o.bet + oddTxt + '</div><div class="ob-leg-match">' + wedstr + '</div></div><div style="color:' + kl + ';font-weight:700;white-space:nowrap;margin-left:12px">' + k + '%</div></div>';
    }).join('');
    const totalOddHtml = allHaveOdds && onderdelen.length > 0 ?
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);margin-top:4px"><span style="color:var(--muted2)">Gecombineerde quote</span><span style="font-size:18px;font-weight:700;color:var(--gold)">' + totalOdd.toFixed(2) + '</span></div>' : '';

    // Betrouwbaarheidsindicator voor alle wedstrijden
    const gamesCounts = ms.map(m => {
      const h = (PLAYER_STATS[m.h]||[])[0]?.matches || 0;
      const a = (PLAYER_STATS[m.a]||[])[0]?.matches || 0;
      return Math.min(h, a);
    });
    const avgGames = gamesCounts.length ? Math.round(gamesCounts.reduce((a,b)=>a+b,0)/gamesCounts.length*10)/10 : 0;
    const obReliability = avgGames === 0 ? {label:'Geen spelersdata', color:'var(--muted2)', icon:'⚪'}
      : avgGames < 1.5 ? {label:'Beperkt (~1 wed/team)', color:'var(--peach)', icon:'🟡'}
      : avgGames < 2.5 ? {label:'Redelijk (~2 wed/team)', color:'var(--gold)', icon:'🟠'}
      : {label:`Goed (~${avgGames} wed/team)`, color:'var(--mint)', icon:'🟢'};

    resultEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;padding:7px 10px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:12px;font-size:11px">
        <span>${obReliability.icon}</span>
        <span style="color:var(--muted2)">Databasis: <strong style="color:${obReliability.color}">${obReliability.label}</strong></span>
        <span style="color:var(--muted2);margin-left:auto">Poisson-model</span>
      </div>
      <div style="margin-bottom:16px;font-size:15px;font-weight:700;color:var(--gold)">🎯 ${bet.tip}</div>
      ${legsHtml}
      ${totalOddHtml}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700;font-size:14px">
        <span>Slagingskans</span>
        <span style="color:${combKleur};font-size:20px">${combKans}%</span>
      </div>
      ${combKans < 60 ? '<div style="background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--peach)">⚠️ Onder 60% — overweeg minder onderdelen</div>' : ''}
      <div style="font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px">${bet.onderbouwing}</div>
      ${bet.data_basis ? '<div style="font-size:10px;color:var(--muted2);margin-top:6px">📊 ' + bet.data_basis + '</div>' : ''}
      <div style="margin-top:12px;font-size:12px;color:${riskColor};font-weight:600">Risico: ${bet.risico} · Check quotes bij je boekmaker</div>
    `;
    if(btn) { btn.innerHTML = "🔄 Opnieuw analyseren"; btn.disabled = false; }
  } catch(e) {
    resultEl.innerHTML = `<div style="padding:20px;color:var(--muted2);font-size:12px">Fout: ${e.message}</div>`;
    if(btn) { btn.innerHTML = "🎯 Beste Dagtip"; btn.disabled = false; }
  }
}

async function checkAdminPin(){
  try {
    const res = await fetch(WORKER_URL+'/check-pin',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pin: adminPinEntry, deviceId: DEVICE_ID, ua: navigator.userAgent})
    });
    const data = await res.json();
    if(data.ok && data.isAdmin){
      document.getElementById('admin-pin-view').style.display = 'none';
      document.getElementById('admin-title').textContent = '👥 Bezoekers';
      loadAdminStats();
    } else {
      for(let i=0;i<4;i++) document.getElementById('ad'+i).className='pin-dot error';
      document.getElementById('admin-pin-err').textContent = 'Verkeerde code';
      setTimeout(()=>{ adminPinEntry=''; for(let i=0;i<4;i++) document.getElementById('ad'+i).className='pin-dot'; document.getElementById('admin-pin-err').textContent=''; }, 1200);
    }
  } catch(e) {
    document.getElementById('admin-pin-err').textContent = 'Verbindingsfout';
    setTimeout(()=>{ adminPinEntry=''; }, 1500);
  }
}
