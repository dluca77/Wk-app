html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px}

.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header h1{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);line-height:1;letter-spacing:.04em}
.sidebar-header p{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.key-bar{padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:6px}
.key-bar input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;color:var(--text);font-size:11px;font-family:monospace;outline:none}
.key-bar input:focus{border-color:var(--accent)}
.key-bar input::placeholder{color:var(--muted)}
.key-save{padding:5px 10px;background:var(--accent);border:none;border-radius:6px;color:#fff;font-size:11px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.key-status{font-size:10px;padding:4px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.filter-bar{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.filter-btn{padding:3px 10px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.search-bar{padding:6px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;color:var(--text);font-size:12px;outline:none;font-family:'DM Sans',sans-serif}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.match-list{flex:1;overflow-y:auto}
.match-list::-webkit-scrollbar{width:3px}
.match-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.day-header{padding:5px 14px 2px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;background:rgba(10,14,26,.85);position:sticky;top:0;z-index:2;backdrop-filter:blur(4px)}
.match-item{padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .1s;user-select:none}
.match-item:hover,.match-item:active{background:var(--surface2)}
.match-item.active{background:var(--surface2);border-left-color:var(--accent)}
.match-item.is-live{border-left-color:var(--green)}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;font-weight:500;line-height:1.3}
.match-teams .vs{font-size:9px;color:var(--muted);flex-shrink:0}
.match-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.badge{font-size:9px;padding:1px 5px;border-radius:10px;border:1px solid var(--border2);color:var(--muted)}
.badge-oef{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.2);color:#60a5fa}
.badge-ko{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.2);color:var(--accent)}
.badge-done{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2);color:var(--green)}

.live-score{font-size:12px;color:var(--green);font-weight:700;margin-left:4px}
.main{display:flex;flex-direction:column;background:var(--bg)}
.main-header{padding:16px 22px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;flex-shrink:0}
.match-title h2{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;letter-spacing:.03em}
.match-title .subtitle{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.content{flex:1;overflow-y:auto;padding:18px 22px}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;gap:10px;color:var(--muted);text-align:center;padding:20px}
.empty-icon{font-size:48px;opacity:.2}
.empty-state h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}
.empty-state p{font-size:12px;max-width:260px;line-height:1.6}
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;height:40vh;gap:14px;color:var(--muted)}
.analyzing-spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab-nav{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab-btn{padding:7px 14px;background:transparent;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}.tab-panel.active{display:block}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:14px}
.score-team{text-align:center;flex:1}
.score-flag{font-size:32px;display:block;margin-bottom:4px}
.score-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.04em}
.score-winner-tag{font-size:9px;background:var(--green);color:#000;padding:2px 7px;border-radius:20px;font-weight:600;margin-top:3px;display:inline-block}
.score-nums{display:flex;align-items:center;gap:10px}
.score-num{font-size:48px;font-family:'Bebas Neue',sans-serif;color:var(--accent);line-height:1}
.score-sep{font-size:24px;color:var(--muted);font-family:'Bebas Neue',sans-serif}
.live-indicator{font-size:10px;color:var(--green);text-align:center;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:lp 1s infinite;flex-shrink:0}
.prob-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.prob-bar-outer{height:26px;background:var(--surface2);border-radius:5px;overflow:hidden;display:flex;margin:8px 0 5px}
.prob-seg{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;transition:width .6s}

.pred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.pred-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.card-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.card-value{font-size:18px;font-family:'Bebas Neue',sans-serif;color:var(--text);line-height:1;letter-spacing:.03em}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px}

.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}

.stat-bw{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-h{height:100%;background:var(--accent);border-radius:3px;float:right}
.bar-a{height:100%;background:var(--blue);border-radius:3px}

.stat-val.r{text-align:right}

.ai-prose strong{color:var(--text)}
.conf-dots{display:flex;gap:3px;margin-bottom:3px}
.conf-dot{width:8px;height:8px;border-radius:50%;background:var(--border2)}
.conf-dot.on{background:var(--accent)}

.error-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:12px;color:#fca5a5;font-size:12px;margin-bottom:12px}

@keyframes sh{0%,100%{opacity:.2}50%{opacity:.6}}

.no-key-box p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px}

</head>

// ── API KEY ──
let apiKey = localStorage.getItem('wk_api_key') || '';

function onKeyInput(){
  document.getElementById('keyStatus').style.color='var(--muted)';
  document.getElementById('keyStatus').textContent='Druk op Opslaan om te bevestigen';
}
function saveKey(){
  const v = document.getElementById('apiKeyInput').value.trim();
  if(!v.startsWith('sk-')){
    document.getElementById('keyStatus').style.color='var(--red)';
    document.getElementById('keyStatus').textContent='Ongeldige key — moet beginnen met sk-ant-';
    return;
  }
  apiKey = v;
  localStorage.setItem('wk_api_key', v);
  document.getElementById('keyStatus').style.color='var(--green)';
  document.getElementById('keyStatus').textContent='✓ Key opgeslagen — klik een wedstrijd aan';
  if(currentMatch) autoAnalyze(currentMatch);
}

// ── MATCH STATUS ──
function matchStatus(m){
  if(m.result) return 'done';
  const [h,min] = (m.time||'00:00').split(':').map(Number);
  const start = new Date(m.date+'T00:00:00Z');
  start.setUTCHours(h-2, min, 0, 0);
  const end = new Date(start.getTime()+115*60000);
  if(NOW>=start && NOW<=end) return 'live';
  if(m.date<TODAY) return 'past';
  if(m.date===TODAY) return 'today';
  return 'upcoming';
}

// ── STATE ──
let currentMatch=null, currentFilter='all', predCache={};

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const el=document.getElementById('matchList');
  const filtered=MATCHES.filter(m=>{
    if(currentFilter==='oef'&&m.type!=='oef') return false;
    if(currentFilter==='groep'&&m.type!=='groep') return false;
    if(currentFilter==='ko'&&m.type!=='ko') return false;
    if(currentFilter==='vandaag'&&m.date!==TODAY) return false;
    if(q&&!(m.home.toLowerCase().includes(q)||m.away.toLowerCase().includes(q))) return false;
    return true;
  });
  let html='',lastDay='';
  filtered.forEach(m=>{
    if(m.date!==lastDay){
      const d=new Date(m.date+'T12:00:00');
      const st=matchStatus(m);
      const lbl=m.date===TODAY?'Vandaag':
        (m.date<TODAY?d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})+' (gespeeld)':
        d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}));
      html+=`<div class="day-header">${lbl}</div>`;
      lastDay=m.date;
    }
    const st=matchStatus(m);
    const isSel=currentMatch&&currentMatch.id===m.id;
    const badgeCls=m.type==='oef'?'badge-oef':m.type==='ko'?'badge-ko':'';
    const badgeTxt=m.type==='oef'?'Oef':m.type==='ko'?(m.round||'KO'):`Gr.${m.group}`;
    let statusBadge='';
    if(st==='live') statusBadge=`<span class="badge badge-live">LIVE ${m.liveScore||''}</span>`;
    else if(m.result) statusBadge=`<span class="badge badge-done">✓ ${m.result}</span>`;
    html+=`<div class="match-item ${isSel?'active':''} ${st==='live'?'is-live':''}" onclick="selectMatch('${m.id}')">
      <div class="match-teams">
        <span>${F(m.home)} ${m.home}</span>
        <span class="vs">vs</span>
        <span>${m.away} ${F(m.away)}</span>
      </div>
      <div class="match-meta">
        <span>${m.time}</span>
        <span class="badge ${badgeCls}">${badgeTxt}</span>
        ${statusBadge}
      </div>
    </div>`;
  });
  if(!html) html='<div style="padding:16px 14px;font-size:12px;color:var(--muted)">Geen wedstrijden gevonden.</div>';
  el.innerHTML=html;
}

function selectMatch(id){
  currentMatch=MATCHES.find(m=>m.id===id);
  renderList();
  const m=currentMatch;
  document.getElementById('matchHeading').textContent=`${F(m.home)} ${m.home} vs ${m.away} ${F(m.away)}`;
  const d=new Date(m.date+'T12:00:00');
  const lbl=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
  const typeTxt=m.type==='oef'?'Oefenwedstrijd':m.type==='ko'?(m.round||'Knock-out'):`Groep ${m.group}`;
  document.getElementById('matchSubtitle').textContent=`${lbl} • ${m.time} • ${typeTxt} • ${m.venue}`;
  if(window.innerWidth<=700) setTimeout(()=>document.querySelector('.main').scrollIntoView({behavior:'smooth'}),100);
  if(predCache[id]){
    renderPrediction(predCache[id],m);
  } else {
    autoAnalyze(m);
  }
}

function autoAnalyze(m){
  if(!apiKey){
    document.getElementById('mainContent').innerHTML=`
    <div class="no-key-box">
      <p>Voer je <strong>Anthropic API key</strong> in het veld linksboven in om automatisch een AI-analyse te krijgen.<br><br>Key aanmaken via <strong>console.anthropic.com</strong> → API Keys → Create Key.</p>
    </div>`;
    return;
  }
  runPrediction(m);
}

async function runPrediction(m){
  document.getElementById('mainContent').innerHTML=`
  <div class="analyzing">
    <div class="analyzing-spinner"></div>
    <div style="font-size:13px">AI analyseert ${m.home} vs ${m.away}...</div>
    <div style="font-size:11px;color:var(--muted)">Even geduld</div>
  </div>`;
  const st=matchStatus(m);
  const typeTxt=m.type==='oef'?'oefenwedstrijd':m.type==='ko'?`knock-outwedstrijd (${m.round})`:`WK groepswedstrijd Groep ${m.group}`;
  const contextLine=m.result?`\nDeze wedstrijd is gespeeld. Eindstand: ${m.result}. Analyseer dit resultaat.`:
    st==='live'?`\nDeze wedstrijd is NU LIVE bezig! Live stand: ${m.liveScore||'0-0'}. Geef een live-analyse.`:'';
  const prompt=`Analyseer ${typeTxt} WK 2026:\n${m.home} vs ${m.away}\nDatum: ${m.date} ${m.time} NL\nLocatie: ${m.venue}${contextLine}\n\nGebruik: FIFA-rankings mei 2026, WK-selecties, recente vorm, onderlinge duels, blessures, tactiek.`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1500,
        system:`WK 2026 voetbalanalist. Antwoord ALLEEN als raw JSON object zonder markdown:
{"uitslag_home":<int>,"uitslag_away":<int>,"winnaar":"home|away|gelijkspel","win_pct_home":<int>,"win_pct_draw":<int>,"win_pct_away":<int>,"confidence":<1-5>,"verwacht_goals_home":<float>,"verwacht_goals_away":<float>,"balbezit_home":<int>,"schoten_home":<int>,"schoten_away":<int>,"schoten_doel_home":<int>,"schoten_doel_away":<int>,"corners_home":<int>,"corners_away":<int>,"kaarten_home":<int>,"kaarten_away":<int>,"sleutelspeler_home":"<naam>","sleutelspeler_home_rol":"<rol>","sleutelspeler_home_impact":"<10 woorden>","sleutelspeler_away":"<naam>","sleutelspeler_away_rol":"<rol>","sleutelspeler_away_impact":"<10 woorden>","gevaar_home":"<naam>","gevaar_away":"<naam>","analyse":"<250 woorden NL, gebruik \\n\\n voor paragrafen>","tactiek_home":"<20 woorden>","tactiek_away":"<20 woorden>","doelpuntenmakers":["<speler>","<speler>"],"verrassing_kans":<int>,"verrassing_uitleg":"<15 woorden>"}`,
        messages:[{role:'user',content:prompt}]
      })
    });
    if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||`HTTP ${resp.status}`);}
    const data=await resp.json();
    const raw=data.content[0].text.trim();
    let pred;
    try{pred=JSON.parse(raw);}catch{const mx=raw.match(/\{[\s\S]*\}/);if(mx)pred=JSON.parse(mx[0]);else throw new Error('JSON parse fout');}
    predCache[m.id]=pred;
    renderPrediction(pred,m);
  }catch(err){
    document.getElementById('mainContent').innerHTML=`
    <div class="error-box">
      <strong>Fout bij analyse:</strong> ${err.message}<br>
      <span style="font-size:11px;opacity:.7;margin-top:4px;display:block">Controleer je API key bovenin de sidebar.</span>
    </div>`;
  }
}

function renderPrediction(pred,m){
  const hf=F(m.home),af=F(m.away);
  const st=matchStatus(m);
  const wN=pred.winnaar==='home'?m.home:pred.winnaar==='away'?m.away:'Gelijkspel';
  const wF=pred.winnaar==='home'?hf:pred.winnaar==='away'?af:'🤝';
  const ba=100-(pred.balbezit_home||50);
  const xG=((pred.verwacht_goals_home||0)+(pred.verwacht_goals_away||0)).toFixed(1);
  const dots=Array(5).fill(0).map((_,i)=>`<div class="conf-dot ${i<pred.confidence?'on':''}"></div>`).join('');
  const dpm=(pred.doelpuntenmakers||[]).map(p=>`<span style="display:inline-block;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:2px 8px;font-size:11px;margin:2px">${p}</span>`).join('');
  const topBox=m.result?`<div class="past-box">✅ Gespeeld — eindstand: <strong>${m.home} ${m.result} ${m.away}</strong></div>`:
    st==='live'?`<div class="live-box"><div class="live-dot"></div><strong>LIVE</strong> — wedstrijd bezig! Stand: ${m.liveScore||'0-0'}</div>`:'';
  document.getElementById('mainContent').innerHTML=`
${topBox}
<div class="tab-nav">
  <button class="tab-btn active" onclick="sw('o',this)">Overzicht</button>
  <button class="tab-btn" onclick="sw('s',this)">Statistieken</button>
  <button class="tab-btn" onclick="sw('a',this)">Analyse</button>
</div>
<div class="tab-panel active" id="tp-o">
  <div class="score-box">
    <div class="score-team">
      <span class="score-flag">${hf}</span>
      <div class="score-name">${m.home}</div>
      ${pred.winnaar==='home'?'<div class="score-winner-tag">Winnaar</div>':''}
    </div>
    <div style="text-align:center">
      <div class="score-nums"><div class="score-num">${pred.uitslag_home}</div><div class="score-sep">–</div><div class="score-num">${pred.uitslag_away}</div></div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px">Verwacht</div>
      ${st==='live'?'<div class="live-indicator"><div class="live-dot"></div>LIVE</div>':''}
    </div>
    <div class="score-team">
      <span class="score-flag">${af}</span>
      <div class="score-name">${m.away}</div>
      ${pred.winnaar==='away'?'<div class="score-winner-tag">Winnaar</div>':''}
    </div>
  </div>
  <div class="prob-wrap">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;font-weight:500">${m.home}</span><span style="font-size:10px;color:var(--muted)">Winstkansen</span><span style="font-size:12px;font-weight:500">${m.away}</span></div>
    <div class="prob-bar-outer">
      <div class="prob-seg prob-home" style="width:${pred.win_pct_home}%">${pred.win_pct_home}%</div>
      <div class="prob-seg prob-draw" style="width:${pred.win_pct_draw}%">${pred.win_pct_draw>7?pred.win_pct_draw+'%':''}</div>
      <div class="prob-seg prob-away" style="width:${pred.win_pct_away}%">${pred.win_pct_away}%</div>
    </div>
    <div class="prob-labels"><span>Win ${hf}</span><span>Gelijk</span><span>Win ${af}</span></div>
  </div>
  <div class="pred-grid">
    <div class="pred-card"><div class="card-label">Betrouwbaarheid</div><div class="conf-dots">${dots}</div><div class="card-sub">${pred.confidence}/5</div></div>
    <div class="pred-card hl"><div class="card-label">xG totaal</div><div class="card-value">${xG}</div><div class="card-sub">${(pred.verwacht_goals_home||0).toFixed(1)} – ${(pred.verwacht_goals_away||0).toFixed(1)}</div></div>
    <div class="pred-card win"><div class="card-label">Winnaar</div><div class="card-value">${wF}</div><div class="card-sub" style="font-weight:500;color:var(--text)">${wN}</div></div>
    <div class="pred-card"><div class="card-label">Verrassing?</div><div class="card-value">${pred.verrassing_kans}%</div><div class="card-sub" style="font-size:10px">${pred.verrassing_uitleg||''}</div></div>
  </div>
  <div class="sec">Sleutelspelers</div>
  <div class="players-grid">
    <div class="player-card"><div class="player-role">${hf} Sleutelspeler</div><div class="player-name">${pred.sleutelspeler_home||'N/A'}</div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${pred.sleutelspeler_home_rol||''}</div><div class="player-impact">${pred.sleutelspeler_home_impact||''}</div></div>
    <div class="player-card"><div class="player-role">${af} Sleutelspeler</div><div class="player-name">${pred.sleutelspeler_away||'N/A'}</div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${pred.sleutelspeler_away_rol||''}</div><div class="player-impact">${pred.sleutelspeler_away_impact||''}</div></div>
    <div class="player-card"><div class="player-role">${hf} Doelgevaar</div><div class="player-name" style="color:var(--gold)">${pred.gevaar_home||'N/A'}</div></div>
    <div class="player-card"><div class="player-role">${af} Doelgevaar</div><div class="player-name" style="color:var(--gold)">${pred.gevaar_away||'N/A'}</div></div>
  </div>
  ${dpm?`<div class="sec">Verwachte doelpuntenmakers</div><div style="margin-bottom:12px">${dpm}</div>`:''}
</div>
<div class="tab-panel" id="tp-s">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="font-size:12px;font-weight:500">${hf} ${m.home}</span><span style="font-size:10px;color:var(--muted)">Stats</span><span style="font-size:12px;font-weight:500">${m.away} ${af}</span></div>
    ${sr('Balbezit',pred.balbezit_home,ba,'%')}
    ${sr('Schoten',pred.schoten_home,pred.schoten_away)}
    ${sr('Op doel',pred.schoten_doel_home,pred.schoten_doel_away)}
    ${sr('Corners',pred.corners_home,pred.corners_away)}
    ${sr('Gele kaarten',pred.kaarten_home,pred.kaarten_away)}
    ${sr('xG',(pred.verwacht_goals_home||0).toFixed(1),(pred.verwacht_goals_away||0).toFixed(1),'',true)}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div class="pred-card"><div class="card-label">${hf} Tactiek</div><div style="font-size:12px;color:var(--text);line-height:1.6;margin-top:4px">${pred.tactiek_home||'N/A'}</div></div>
    <div class="pred-card"><div class="card-label">${af} Tactiek</div><div style="font-size:12px;color:var(--text);line-height:1.6;margin-top:4px">${pred.tactiek_away||'N/A'}</div></div>
  </div>
</div>
<div class="tab-panel" id="tp-a">
  <div class="ai-prose">${(pred.analyse||'').replace(/\n/g,'<br>')}</div>
  <div style="font-size:10px;color:var(--muted);text-align:right;margin-top:-8px">Claude Sonnet — WK 2026</div>
</div>`;
}

function sr(lbl,h,a,sfx='',isF=false){
  const hv=isF?parseFloat(h)||0:parseInt(h)||0;
  const av=isF?parseFloat(a)||0:parseInt(a)||0;
  const tot=hv+av||1,ph=Math.round(hv/tot*100);
  return `<div class="stat-row">
    <div class="stat-val r">${hv}${sfx}</div>
    <div class="stat-bw"><div class="bar-h" style="width:${ph}%"></div></div>
    <div class="stat-label">${lbl}</div>
    <div class="stat-bw"><div class="bar-a" style="width:${100-ph}%"></div></div>
    <div class="stat-val">${av}${sfx}</div>
  </div>`;
}

function sw(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tp-'+id).classList.add('active');
}

// ── INIT ──
if(apiKey){
  document.getElementById('apiKeyInput').value=apiKey;
  document.getElementById('keyStatus').style.color='var(--green)';
  document.getElementById('keyStatus').textContent='✓ Key geladen — klik een wedstrijd aan';
}
renderList();
setInterval(renderList, 30000);
</script>
</body>
</html>
