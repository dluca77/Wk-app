<html lang="nl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WK 2026 Live</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:10}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-size:18px;font-weight:700;color:var(--accent)}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:3px 8px;border-radius:20px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 1s infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.date-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.date-nav::-webkit-scrollbar{display:none}
.dpill{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.dpill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.container{max-width:600px;margin:0 auto;padding:12px 14px 40px}
.filter-row{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto}
.filter-row::-webkit-scrollbar{display:none}
.ftab{padding:5px 12px;border-radius:16px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.ftab.on{background:var(--surface2);border-color:var(--border2);color:var(--text);font-weight:600}
.ftab.live-ftab{color:var(--green)}
.ftab.live-ftab.on{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4)}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;overflow:hidden;transition:all .15s}
.match-card:hover,.match-card:active{background:var(--surface2);border-color:var(--border2)}
.match-card.live{border-color:rgba(34,197,94,.4)}
.mc-inner{padding:12px 14px}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-league{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
.mc-status{font-size:10px;font-weight:700}
.status-live{color:var(--green);display:flex;align-items:center;gap:4px}
.status-ft{color:var(--muted2)}
.status-time{color:var(--muted)}
.mc-body{display:flex;align-items:center;gap:10px}
.mc-teams{flex:1;min-width:0}
.team-row{display:flex;align-items:center;gap:7px;padding:2px 0}
.tflag{font-size:16px;flex-shrink:0;width:20px}
.tname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.w{font-weight:700;color:var(--mint)}
.mc-score{text-align:center;min-width:40px}
.score{font-size:20px;font-weight:700;color:var(--green);line-height:1.1;text-align:center}
.score-line{font-size:20px;font-weight:700;line-height:1.1}
.pct-bar{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:6px}
.pb1{background:var(--accent)}.pbx{background:var(--surface2)}.pb2{background:var(--lav)}
.mc-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px}
.oc{padding:5px 3px;border-radius:7px;border:1px solid var(--border2);text-align:center;background:rgba(255,255,255,.03)}
.oc.w{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}
.ol{font-size:9px;color:var(--muted);display:block;margin-bottom:1px}
.ov{font-size:12px;font-weight:700;color:var(--text)}
.oc.w .ov{color:var(--green)}
.op{font-size:9px;color:var(--muted2)}
.tip{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10px;font-weight:700;margin-top:6px}
.t1{background:rgba(249,115,22,.1);color:var(--accent);border:1px solid rgba(249,115,22,.25)}
.tx{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.t2{background:rgba(184,169,245,.1);color:var(--lav);border:1px solid rgba(184,169,245,.25)}
.t1x{background:rgba(245,184,160,.1);color:var(--peach);border:1px solid rgba(245,184,160,.25)}
.tx2{background:rgba(160,212,245,.1);color:var(--sky);border:1px solid rgba(160,212,245,.25)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:all}
.modal{width:100%;max-width:600px;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--border2);max-height:92vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s}
.modal::-webkit-scrollbar{display:none}
.overlay.on .modal{transform:translateY(0)}
.mhandle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.mhdr{padding:12px 16px 0;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-size:14px;font-weight:700}
.mclose{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.mbody{padding:14px 16px 30px}
.md-hero{background:linear-gradient(135deg,rgba(184,169,245,.1),rgba(126,232,195,.08));border:1px solid rgba(184,169,245,.2);border-radius:14px;padding:16px;margin-bottom:12px}
.md-meta{font-size:11px;color:var(--lav);text-align:center;margin-bottom:10px}
.md-teams{display:flex;align-items:center;justify-content:space-between}
.md-team{text-align:center;flex:1}
.md-flag{font-size:38px;display:block;margin-bottom:4px}
.md-name{font-size:13px;font-weight:600}
.md-mid{text-align:center;padding:0 10px}
.md-score{font-size:28px;font-weight:700;color:var(--green)}
.md-vs{font-size:13px;color:var(--muted)}
.md-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.mdo{padding:7px;border-radius:9px;border:1px solid var(--border2);background:rgba(255,255,255,.04);text-align:center}
.mdo.w{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.35)}
.mdol{font-size:9px;color:var(--muted);display:block;margin-bottom:2px}
.mdov{font-size:15px;font-weight:700;color:var(--text)}
.mdo.w .mdov{color:var(--green)}
.mdop{font-size:10px;color:var(--muted2)}
.bb{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(249,115,22,.06));border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:14px;margin-bottom:12px}
.bbl{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.bbt{font-size:14px;font-weight:700;margin-bottom:5px}
.bbw{font-size:12px;color:var(--muted);line-height:1.7}
.shdr{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.sflag{font-size:16px}
.sname{font-size:13px;font-weight:700;flex:1}
.slbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pc{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:5px;display:flex;align-items:center;gap:10px}
.pmed{font-size:18px;min-width:24px;text-align:center}
.pinf{flex:1;min-width:0}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.pr{text-align:right;flex-shrink:0}
.psh{font-size:20px;font-weight:700;color:var(--peach)}
.psl{font-size:9px;color:var(--muted);text-transform:uppercase}
.psot{font-size:11px;color:var(--sky);margin-top:1px}
.pxg{font-size:11px;color:var(--lav)}
.pbas{font-size:10px;padding:2px 6px;border-radius:7px;margin-top:3px;display:inline-block}
.by{background:rgba(34,197,94,.1);color:var(--green)}
.bn{background:rgba(255,255,255,.06);color:var(--muted)}
.nodata{font-size:12px;color:var(--muted);padding:8px 0}
.rbox{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--green)}
.lbox{background:rgba(34,197,94,.1);border:1px solid var(--green);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:8px}

</head>

function isLive(m){
  if(m.result) return false;
  const s=new Date(m.date+'T'+m.time+':00');
  const e=new Date(s.getTime()+115*60000);
  return NOW>=s&&NOW<=e;
}
function isDone(m){return !!m.result||(NOW>new Date(new Date(m.date+'T'+m.time+':00').getTime()+115*60000));}
function probs(h,d,a){const r1=1/(h||99),rx=1/(d||99),r2=1/(a||99),t=r1+rx+r2;const p1=Math.round(r1/t*100),px=Math.round(rx/t*100);return{p1,px,p2:100-p1-px};}
function tip(p1,px,p2){const m=Math.max(p1,px,p2);if(m===p1)return px>p1-8?{t:'1X',c:'t1x'}:{t:'1',c:'t1'};if(m===p2)return px>p2-8?{t:'X2',c:'tx2'}:{t:'2',c:'t2'};return p1>p2?{t:'1X',c:'t1x'}:{t:'X2',c:'tx2'};}

    if(odds){
      const{p1,px,p2}=probs(odds.h,odds.d,odds.a);
      const win=p1>p2&&p1>px?'h':p2>p1&&p2>px?'a':'d';
      const{t,c}=tip(p1,px,p2);
      pctHtml=`<div class="pct-bar"><div class="pb1" style="width:${p1}%"></div><div class="pbx" style="width:${px}%"></div><div class="pb2" style="width:${p2}%"></div></div>`;
      tipHtml=`<span class="tip ${c}">${t}</span>`;
      oddsHtml=`<div class="mc-odds">
        <div class="oc ${win==='h'?'w':''}"><span class="ol">1</span><span class="ov">${odds.h.toFixed(2)}</span><div class="op">${p1}%</div></div>
        <div class="oc ${win==='d'?'w':''}"><span class="ol">X</span><span class="ov">${odds.d?odds.d.toFixed(2):'-'}</span><div class="op">${px}%</div></div>
        <div class="oc ${win==='a'?'w':''}"><span class="ol">2</span><span class="ov">${odds.a.toFixed(2)}</span><div class="op">${p2}%</div></div>
      </div>`;
    }
    const hW=m.result&&parseInt(m.result[0])>parseInt(m.result[2]);
    const aW=m.result&&parseInt(m.result[2])>parseInt(m.result[0]);
    return `<div class="match-card ${live?'live':''}" onclick="openModal('${m.id}')">
      <div class="mc-inner">
        <div class="mc-top">
          <div class="mc-league">🌍 ${RL(m.g)}</div>
          ${statusHtml}
        </div>
        <div class="mc-body">
          <div class="mc-teams">
            <div class="team-row"><span class="tflag">${hf}</span><span class="tname ${hW?'w':''}">${m.h}</span></div>
            <div class="team-row" style="margin-top:5px"><span class="tflag">${af}</span><span class="tname ${aW?'w':''}">${m.a}</span></div>
            ${pctHtml}
          </div>
          <div class="mc-score">
            ${m.result?`<div class="score">${m.result[0]}<br>${m.result[2]}</div>`:
              live?`<div class="score" style="color:var(--mint)">?</div>`:
              `<div style="font-size:11px;color:var(--muted);text-align:center">${m.time}</div>`}
          </div>
        </div>
        ${oddsHtml}
        ${!oddsHtml&&tipHtml?`<div style="margin-top:6px">${tipHtml}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── MODAL ──
function openModal(id){
  const m=MATCHES.find(x=>x.id===id);
  if(!m) return;
  const hf=F(m.h),af=F(m.a);
  const live=isLive(m);
  const odds=getOdds(m.h,m.a);
  const hs=GS(m.h),as=GS(m.a);
  const all=[...(hs||[]).map(p=>({...p,team:m.h,flag:hf})),...(as||[]).map(p=>({...p,team:m.a,flag:af}))].sort((a,b)=>b.spg-a.spg);
  const best=all[0];
  document.getElementById('mtitle').textContent=`${hf} ${m.h} vs ${m.a} ${af}`;
  let oddsHtml='',p1=33,px=33,p2=34;
  if(odds){
    ({p1,px,p2}=probs(odds.h,odds.d,odds.a));
    const win=p1>p2&&p1>px?'h':p2>p1&&p2>px?'a':'d';
    oddsHtml=`<div class="md-odds">
      <div class="mdo ${win==='h'?'w':''}"><span class="mdol">1</span><span class="mdov">${odds.h.toFixed(2)}</span><div class="mdop">${p1}%</div></div>
      <div class="mdo ${win==='d'?'w':''}"><span class="mdol">X</span><span class="mdov">${odds.d?odds.d.toFixed(2):'-'}</span><div class="mdop">${px}%</div></div>
      <div class="mdo ${win==='a'?'w':''}"><span class="mdol">2</span><span class="mdov">${odds.a.toFixed(2)}</span><div class="mdop">${p2}%</div></div>
    </div>`;
  }
  const topBox=m.result?`<div class="rbox">✅ Eindstand: <strong>${m.h} ${m.result} ${m.a}</strong></div>`:
    live?`<div class="lbox"><div class="ldot"></div><strong>LIVE</strong> — wedstrijd is nu bezig!</div>`:'';
  const bbHtml=best?`<div class="bb">
    <div class="bbl">⭐ Beste Bet — Schoten op Doel</div>
    <div class="bbt">${best.flag} ${best.n} — meer dan 1.5 schoten op doel</div>
    <div class="bbw">Gem. <strong>${best.spg}</strong> sch/wed · <strong>${best.sot}</strong> op doel · xG <strong>${best.xg}</strong><br>
    ${best.gm} wed. dit seizoen · ${best.g} goals · ${best.cl}<br>
    ${best.b?'✅ Speelt vermoedelijk basis':'⚠️ Reservestatus — check lineup'}<br>
    <span style="color:var(--gold)">→ Check quote op Bet365 → Speler schoten op doel</span></div>
  </div>`:'';
  const pc=(ps,flag,team)=>{
    if(!ps||!ps.length) return `<div class="nodata">Geen spelersdata voor ${team}</div>`;
    return ps.map((p,i)=>`<div class="pc">
      <div class="pmed">${['🥇','🥈','🥉'][i]}</div>
      <div class="pinf"><div class="pn">${p.n}</div><div class="pm"><span>⚽${p.g}</span><span>🎮${p.gm}</span><span style="color:var(--muted2)">${p.cl}</span></div></div>
      <div class="pr"><div class="psh">${p.spg}</div><div class="psl">sch/wed</div><div class="psot">${p.sot} op doel</div><div class="pxg">xG ${p.xg}</div><div class="pbas ${p.b?'by':'bn'}">${p.b?'Basis ✓':'Reserve'}</div></div>
    </div>`).join('');
  };
  document.getElementById('mbody').innerHTML=`
    ${topBox}
    <div class="md-hero">
      <div class="md-meta">${RL(m.g)} · ${m.time} NL · ${m.venue}</div>
      <div class="md-teams">
        <div class="md-team"><span class="md-flag">${hf}</span><div class="md-name">${m.h}</div></div>
        <div class="md-mid">${m.result?`<div class="md-score">${m.result}</div>`:`<div class="md-vs">vs</div>`}</div>
        <div class="md-team"><span class="md-flag">${af}</span><div class="md-name">${m.a}</div></div>
      </div>
      ${oddsHtml}
    </div>
    ${bbHtml}
    <div class="shdr"><span class="sflag">${hf}</span><span class="sname">${m.h}</span><span class="slbl">Top 3 schutters</span></div>
    ${pc(hs,hf,m.h)}
    <div class="shdr"><span class="sflag">${af}</span><span class="sname">${m.a}</span><span class="slbl">Top 3 schutters</span></div>
    ${pc(as,af,m.a)}
    <div style="font-size:11px;color:var(--muted2);text-align:center;margin-top:12px;line-height:1.6">Stats huidig seizoen · Controleer quote op Bet365</div>`;
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeOv(e){if(e.target===document.getElementById('overlay'))closeModal();}
function closeModal(){document.getElementById('overlay').classList.remove('on');document.body.style.overflow='';}

// ── INIT ──
buildNav();
render();
setInterval(()=>{if(selDate===TODAY)render();},30000);
</script>
