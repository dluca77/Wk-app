<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WK 2026 — AI Voorspellingen</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f4ff;--muted:#8892a4;--accent:#f97316;--accent2:#fb923c;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
h1,h2,h3,.label{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
@media(max-width:768px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;height:100vh;position:sticky;top:0}
.sidebar-header{padding:20px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header h1{font-size:26px;color:var(--accent);line-height:1}
.sidebar-header p{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.api-section{padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.api-section label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.api-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;color:var(--text);font-size:12px;font-family:monospace;outline:none}
.api-input:focus{border-color:var(--accent)}
.api-input::placeholder{color:var(--muted)}
.api-note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.4}
.filter-bar{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.filter-btn{padding:3px 10px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.filter-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.search-bar{padding:8px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;color:var(--text);font-size:12px;outline:none}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.match-list{flex:1;overflow-y:auto;padding:4px 0}
.match-list::-webkit-scrollbar{width:3px}
.match-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.day-header{padding:6px 18px 3px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500;background:rgba(10,14,26,.6);position:sticky;top:0;z-index:1}
.match-item{padding:8px 18px;cursor:pointer;border-left:3px solid transparent;transition:all .12s}
.match-item:hover{background:var(--surface2)}
.match-item.active{background:var(--surface2);border-left-color:var(--accent)}
.match-item.past{opacity:.6}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;font-weight:500;line-height:1.3}
.match-teams .vs{font-size:9px;color:var(--muted);flex-shrink:0}
.match-score{font-size:11px;color:var(--green);font-weight:500;margin-left:4px}
.match-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.badge{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--surface);border:1px solid var(--border2);color:var(--muted);flex-shrink:0}
.badge-oef{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.25);color:#60a5fa}
.badge-ko{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.25);color:var(--accent)}
.badge-gespeeld{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.25);color:var(--green)}
.main{display:flex;flex-direction:column;min-height:100vh}
.main-header{padding:20px 28px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0}
.match-title h2{font-size:28px;line-height:1}
.match-title .subtitle{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.predict-btn{padding:9px 20px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.06em;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:8px;flex-shrink:0}
.predict-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.predict-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;transform:none}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
.predict-btn.loading .spinner{display:block}
.predict-btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.content{flex:1;overflow-y:auto;padding:24px 28px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;gap:12px;color:var(--muted);text-align:center}
.empty-icon{font-size:56px;opacity:.25}
.empty-state h3{font-size:22px;color:var(--muted)}
.empty-state p{font-size:12px;max-width:280px;line-height:1.6}
.tab-nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab-btn{padding:7px 16px;background:transparent;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:20px}
.score-team{text-align:center;flex:1}
.score-flag{font-size:36px;margin-bottom:6px;display:block}
.score-name{font-size:17px;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em}
.score-winner-tag{font-size:9px;background:var(--green);color:#000;padding:2px 8px;border-radius:20px;font-weight:500;margin-top:4px;display:inline-block}
.score-num{font-size:52px;font-family:'Bebas Neue',sans-serif;color:var(--accent);line-height:1}
.score-sep{font-size:28px;color:var(--muted);font-family:'Bebas Neue',sans-serif}
.prob-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
.prob-bar-outer{height:28px;background:var(--surface2);border-radius:5px;overflow:hidden;display:flex;margin:10px 0 6px}
.prob-seg{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;transition:width .8s ease}
.prob-home{background:var(--accent)}
.prob-draw{background:var(--surface2);border-left:1px solid var(--border);border-right:1px solid var(--border);color:var(--muted)}
.prob-away{background:var(--blue)}
.prob-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.pred-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.card-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.card-value{font-size:20px;font-family:'Bebas Neue',sans-serif;color:var(--text);line-height:1}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px}
.pred-card.highlight{border-color:var(--accent);background:rgba(249,115,22,.05)}
.pred-card.highlight .card-value{color:var(--accent)}
.pred-card.win{border-color:var(--green);background:rgba(34,197,94,.04)}
.pred-card.win .card-value{color:var(--green)}
.section-title{font-size:16px;color:var(--text);margin:20px 0 10px;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em}
.section-title:first-child{margin-top:0}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:20px}
.player-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px}
.player-name{font-weight:500;font-size:12px;margin-bottom:2px}
.player-role{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.player-impact{font-size:11px;color:var(--accent)}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stat-label{font-size:11px;color:var(--muted);width:110px;text-align:right;flex-shrink:0}
.stat-bar-wrap{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.stat-bar-h{height:100%;border-radius:3px;background:var(--accent);float:right}
.stat-bar-a{height:100%;border-radius:3px;background:var(--blue)}
.stat-val{font-size:11px;font-weight:500;width:32px;flex-shrink:0}
.stat-val.r{text-align:right}
.ai-prose{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:18px;line-height:1.8;font-size:13px;color:var(--muted);margin-bottom:16px}
.ai-prose strong{color:var(--text);font-weight:500}
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:14px;color:#fca5a5;font-size:13px;margin-bottom:14px}
.skeleton{background:var(--surface);border-radius:8px;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%,100%{opacity:.3}50%{opacity:.7}}
.conf-dots{display:flex;gap:4px;margin-bottom:4px}
.conf-dot{width:9px;height:9px;border-radius:50%;background:var(--border2)}
.conf-dot.on{background:var(--accent)}
.past-result{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--green)}
</style>
</head>

let currentMatch=null, currentFilter='all', predCache={};
const today=new Date().toISOString().split('T')[0];

function flag(n){return FLAGS[n]||'🏳'}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const list=document.getElementById('matchList');
  const filtered=MATCHES.filter(m=>{
    if(currentFilter==='oef'&&m.type!=='oef') return false;
    if(currentFilter==='groep'&&m.type!=='groep') return false;
    if(currentFilter==='ko'&&m.type!=='ko') return false;
    if(currentFilter==='vandaag'&&m.date!==today) return false;
    if(q&&!(m.home.toLowerCase().includes(q)||m.away.toLowerCase().includes(q))) return false;
    return true;
  });

  let html='', lastDay='';
  filtered.forEach(m=>{
    if(m.date!==lastDay){
      const d=new Date(m.date+'T12:00:00');
      const lbl=m.date===today?'Vandaag':d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
      html+=`<div class="day-header">${lbl}</div>`;
      lastDay=m.date;
    }
    const isSel=currentMatch&&currentMatch.id===m.id;
    const isPast=m.date<today||(m.date===today&&m.result);
    const badgeType=m.type==='oef'?'badge-oef':m.type==='ko'?'badge-ko':'';
    const badgeTxt=m.type==='oef'?'Oef':m.type==='ko'?(m.round||'KO'):`Gr.${m.group}`;
    const scoreTxt=m.result?`<span class="match-score">${m.result}</span>`:'';
    html+=`<div class="match-item ${isSel?'active':''} ${isPast&&!m.result?'past':''}" onclick="selectMatch('${m.id}')">
      <div class="match-teams">
        <span>${flag(m.home)} ${m.home}</span>
        <span class="vs">vs</span>
        <span>${m.away} ${flag(m.away)}</span>${scoreTxt}
      </div>
      <div class="match-meta">
        <span>${m.time}</span>
        <span class="badge ${badgeType} ${m.result?'badge-gespeeld':''}">${m.result?'Gespeeld':badgeTxt}</span>
      </div>
    </div>`;
  });
  if(!html) html='<div style="padding:20px 18px;font-size:12px;color:var(--muted)">Geen wedstrijden gevonden.</div>';
  list.innerHTML=html;
}

function selectMatch(id){
  currentMatch=MATCHES.find(m=>m.id===id);
  renderList();
  document.getElementById('predictBtn').disabled=false;
  const m=currentMatch;
  document.getElementById('matchHeading').textContent=`${flag(m.home)} ${m.home} vs ${m.away} ${flag(m.away)}`;
  const d=new Date(m.date+'T12:00:00');
  const lbl=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
  const typeTxt=m.type==='oef'?'Oefenwedstrijd':m.type==='ko'?(m.round||'Knock-out'):`Groep ${m.group}`;
  document.getElementById('matchSubtitle').textContent=`${lbl} • ${m.time} • ${typeTxt} • ${m.venue}`;
  if(predCache[id]){renderPrediction(predCache[id],m);}
  else{
    document.getElementById('mainContent').innerHTML=`
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <h3>${m.home} vs ${m.away}</h3>
      <p>${m.result?`Uitslag: <strong>${m.result}</strong><br>`:''} Klik op ⚡ Voorspel voor live AI-analyse.</p>
    </div>`;
  }
}

async function runPrediction(){
  const apiKey=document.getElementById('apiKey').value.trim();
  if(!apiKey){alert('Voer eerst je Anthropic API key in.');return;}
  if(!currentMatch)return;
  const btn=document.getElementById('predictBtn');
  btn.classList.add('loading');btn.disabled=true;
  document.getElementById('mainContent').innerHTML=`<div style="padding:16px 0">
    <div class="skeleton" style="height:110px;border-radius:14px;margin-bottom:10px"></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      ${Array(4).fill('<div class="skeleton" style="height:72px;border-radius:10px"></div>').join('')}
    </div>
    <div class="skeleton" style="height:140px;border-radius:10px;margin-bottom:10px"></div>
    <div class="skeleton" style="height:180px;border-radius:10px"></div>
  </div>`;
  const m=currentMatch;
  const typeTxt=m.type==='oef'?'oefenwedstrijd':m.type==='ko'?`knock-outwedstrijd (${m.round})`:`WK groepswedstrijd Groep ${m.group}`;
  const resultInfo=m.result?`\nDeze wedstrijd is al gespeeld. Eindstand: ${m.result}. Analyseer waarom dit resultaat logisch is.`:'';
  const prompt=`Analyseer deze ${typeTxt} voor het WK 2026:\n\n${m.home} vs ${m.away}\nDatum: ${m.date} ${m.time} NL-tijd\nLocatie: ${m.venue}${resultInfo}\n\nGebruik actuele FIFA-rankings mei 2026, bekende selecties, recente vorm, onderlinge duels en tactische stijlen.`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1500,
        system:`Je bent expert voetbalanalist WK 2026. Antwoord ALLEEN in JSON zonder markdown:
{"uitslag_home":<int>,"uitslag_away":<int>,"winnaar":"home|away|gelijkspel","win_pct_home":<int>,"win_pct_draw":<int>,"win_pct_away":<int>,"confidence":<1-5>,"verwacht_goals_home":<float>,"verwacht_goals_away":<float>,"balbezit_home":<int>,"schoten_home":<int>,"schoten_away":<int>,"schoten_doel_home":<int>,"schoten_doel_away":<int>,"corners_home":<int>,"corners_away":<int>,"kaarten_home":<int>,"kaarten_away":<int>,"sleutelspeler_home":"<naam>","sleutelspeler_home_rol":"<positie>","sleutelspeler_home_impact":"<10 woorden>","sleutelspeler_away":"<naam>","sleutelspeler_away_rol":"<positie>","sleutelspeler_away_impact":"<10 woorden>","gevaar_home":"<naam>","gevaar_away":"<naam>","analyse":"<250 woorden NL, \\n\\n voor paragrafen>","tactiek_home":"<20 woorden>","tactiek_away":"<20 woorden>","doelpuntenmakers":["<speler>","<speler>"],"verrassing_kans":<int>,"verrassing_uitleg":"<15 woorden>"}`,
        messages:[{role:'user',content:prompt}]
      })
    });
    if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||`API error ${resp.status}`);}
    const data=await resp.json();
    const raw=data.content[0].text.trim();
    let pred;
    try{pred=JSON.parse(raw);}catch(e){const match=raw.match(/\{[\s\S]*\}/);if(match)pred=JSON.parse(match[0]);else throw new Error('JSON parse fout');}
    predCache[m.id]=pred;
    renderPrediction(pred,m);
  }catch(err){
    document.getElementById('mainContent').innerHTML=`<div class="error-box"><strong>Fout:</strong> ${err.message}<br><span style="font-size:11px;opacity:.7;margin-top:4px;display:block">Controleer je API key.</span></div>`;
  }
  btn.classList.remove('loading');btn.disabled=false;
}

function renderPrediction(pred,m){
  const hf=flag(m.home),af=flag(m.away);
  const wName=pred.winnaar==='home'?m.home:pred.winnaar==='away'?m.away:'Gelijkspel';
  const wFlag=pred.winnaar==='home'?hf:pred.winnaar==='away'?af:'🤝';
  const dots=Array(5).fill(0).map((_,i)=>`<div class="conf-dot ${i<pred.confidence?'on':''}"></div>`).join('');
  const ba=100-(pred.balbezit_home||50);
  const goals=((pred.verwacht_goals_home||0)+(pred.verwacht_goals_away||0)).toFixed(1);
  const dpm=(pred.doelpuntenmakers||[]).map(p=>`<span style="display:inline-block;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:2px 9px;font-size:11px;margin:2px">${p}</span>`).join('');
  const pastBox=m.result?`<div class="past-result">✅ Gespeeld — uitslag: <strong>${m.home} ${m.result} ${m.away}</strong></div>`:'';

  document.getElementById('mainContent').innerHTML=`
${pastBox}
<div class="tab-nav">
  <button class="tab-btn active" onclick="sw('overzicht',this)">Overzicht</button>
  <button class="tab-btn" onclick="sw('stats',this)">Statistieken</button>
  <button class="tab-btn" onclick="sw('analyse',this)">Analyse</button>
</div>
<div class="tab-panel active" id="tp-overzicht">
  <div class="score-box">
    <div class="score-team">
      <span class="score-flag">${hf}</span>
      <div class="score-name">${m.home}</div>
      ${pred.winnaar==='home'?'<div class="score-winner-tag">Winnaar</div>':''}
    </div>
    <div style="text-align:center">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="score-num">${pred.uitslag_home}</div>
        <div class="score-sep">–</div>
        <div class="score-num">${pred.uitslag_away}</div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">Verwachte uitslag</div>
    </div>
    <div class="score-team">
      <span class="score-flag">${af}</span>
      <div class="score-name">${m.away}</div>
      ${pred.winnaar==='away'?'<div class="score-winner-tag">Winnaar</div>':''}
    </div>
  </div>
  <div class="prob-wrap">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <span style="font-size:12px;font-weight:500">${m.home}</span>
      <span style="font-size:10px;color:var(--muted)">Winstkansen</span>
      <span style="font-size:12px;font-weight:500">${m.away}</span>
    </div>
    <div class="prob-bar-outer">
      <div class="prob-seg prob-home" style="width:${pred.win_pct_home}%">${pred.win_pct_home}%</div>
      <div class="prob-seg prob-draw" style="width:${pred.win_pct_draw}%">${pred.win_pct_draw>7?pred.win_pct_draw+'%':''}</div>
      <div class="prob-seg prob-away" style="width:${pred.win_pct_away}%">${pred.win_pct_away}%</div>
    </div>
    <div class="prob-labels"><span>Win ${hf}</span><span>Gelijk</span><span>Win ${af}</span></div>
  </div>
  <div class="pred-grid">
    <div class="pred-card"><div class="card-label">Betrouwbaarheid</div><div class="conf-dots">${dots}</div><div class="card-sub">${pred.confidence}/5</div></div>
    <div class="pred-card highlight"><div class="card-label">xG totaal</div><div class="card-value">${goals}</div><div class="card-sub">${(pred.verwacht_goals_home||0).toFixed(1)} – ${(pred.verwacht_goals_away||0).toFixed(1)}</div></div>
    <div class="pred-card"><div class="card-label">Verrassingsrisico</div><div class="card-value">${pred.verrassing_kans}%</div><div class="card-sub" style="font-size:10px">${pred.verrassing_uitleg||''}</div></div>
    <div class="pred-card win"><div class="card-label">Winnaar</div><div class="card-value">${wFlag}</div><div class="card-sub" style="font-weight:500;color:var(--text)">${wName}</div></div>
  </div>
  <div class="section-title">Sleutelspelers</div>
  <div class="players-grid">
    <div class="player-card"><div class="player-role">${hf} Sleutelspeler</div><div class="player-name">${pred.sleutelspeler_home||'N/A'}</div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${pred.sleutelspeler_home_rol||''}</div><div class="player-impact">${pred.sleutelspeler_home_impact||''}</div></div>
    <div class="player-card"><div class="player-role">${af} Sleutelspeler</div><div class="player-name">${pred.sleutelspeler_away||'N/A'}</div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${pred.sleutelspeler_away_rol||''}</div><div class="player-impact">${pred.sleutelspeler_away_impact||''}</div></div>
    <div class="player-card"><div class="player-role">${hf} Doelgevaar</div><div class="player-name" style="color:var(--gold)">${pred.gevaar_home||'N/A'}</div></div>
    <div class="player-card"><div class="player-role">${af} Doelgevaar</div><div class="player-name" style="color:var(--gold)">${pred.gevaar_away||'N/A'}</div></div>
  </div>
  ${dpm?`<div class="section-title">Verwachte doelpuntenmakers</div><div style="margin-bottom:16px">${dpm}</div>`:''}
</div>
<div class="tab-panel" id="tp-stats">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px"><span style="font-size:12px;font-weight:500">${hf} ${m.home}</span><span style="font-size:10px;color:var(--muted)">Verwachte stats</span><span style="font-size:12px;font-weight:500">${m.away} ${af}</span></div>
    ${sRow('Balbezit',pred.balbezit_home,ba,'%')}
    ${sRow('Schoten',pred.schoten_home,pred.schoten_away)}
    ${sRow('Op doel',pred.schoten_doel_home,pred.schoten_doel_away)}
    ${sRow('Corners',pred.corners_home,pred.corners_away)}
    ${sRow('Gele kaarten',pred.kaarten_home,pred.kaarten_away)}
    ${sRow('xG',(pred.verwacht_goals_home||0).toFixed(1),(pred.verwacht_goals_away||0).toFixed(1),'',true)}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="pred-card"><div class="card-label">${hf} Tactiek</div><div style="font-size:12px;color:var(--text);line-height:1.6;margin-top:6px">${pred.tactiek_home||'N/A'}</div></div>
    <div class="pred-card"><div class="card-label">${af} Tactiek</div><div style="font-size:12px;color:var(--text);line-height:1.6;margin-top:6px">${pred.tactiek_away||'N/A'}</div></div>
  </div>
</div>
<div class="tab-panel" id="tp-analyse">
  <div class="ai-prose">${(pred.analyse||'').replace(/\n/g,'<br>')}</div>
  <div style="font-size:10px;color:var(--muted);text-align:right;margin-top:-10px">Claude Sonnet — WK 2026 data</div>
</div>`;
}

function sRow(lbl,h,a,sfx='',isF=false){
  const hv=isF?parseFloat(h)||0:parseInt(h)||0;
  const av=isF?parseFloat(a)||0:parseInt(a)||0;
  const tot=hv+av||1;
  const ph=Math.round(hv/tot*100);
  return `<div class="stat-row">
    <div class="stat-val r">${hv}${sfx}</div>
    <div class="stat-bar-wrap"><div class="stat-bar-h" style="width:${ph}%"></div></div>
    <div style="font-size:10px;color:var(--muted);min-width:80px;text-align:center;flex-shrink:0">${lbl}</div>
    <div class="stat-bar-wrap"><div class="stat-bar-a" style="width:${100-ph}%"></div></div>
    <div class="stat-val">${av}${sfx}</div>
  </div>`;
}

function sw(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tp-'+id).classList.add('active');
}

renderList();
</script>
</body>
</html>
