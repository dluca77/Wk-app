<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Match Insights</title>
<style>
:root{
  --bg:#0b0f14; --card:#121821; --card2:#171f2b; --border:#232d3b;
  --text:#eef2f7; --muted:#8a97a8; --muted2:#5c6879;
  --mint:#22d3a8; --red:#ef4444; --amber:#f5a623; --blue:#3b82f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
.top{position:sticky;top:0;z-index:10;background:rgba(11,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 14px}
.top h1{font-size:17px;margin:0 0 10px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;padding:6px 14px;border-radius:20px;background:var(--card2);color:var(--muted);font-size:13px;border:1px solid var(--border);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--mint);color:#04231b;border-color:var(--mint);font-weight:600}
.wrap{padding:12px 14px;max-width:720px;margin:0 auto}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.comp-group{margin-bottom:10px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card)}
.comp-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.comp-hdr .flag{font-size:18px}
.comp-hdr .name{flex:1;font-weight:600;font-size:14px}
.comp-hdr .count{color:var(--muted);font-size:12px;background:var(--card2);padding:2px 8px;border-radius:10px}
.comp-hdr .chev{color:var(--muted2);transition:transform .15s}
.comp-hdr .chev.open{transform:rotate(90deg)}
.card{padding:12px 14px;border-top:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:10px}
.card:active{background:var(--card2)}
.card .teams{flex:1;min-width:0}
.trow{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0}
.trow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .n.w{font-weight:700;color:#fff}
.status{font-size:11px;color:var(--muted);text-align:right;min-width:52px}
.status.live{color:var(--red);font-weight:700}
.status.ft{color:var(--muted2)}
.score{font-size:15px;font-weight:700;text-align:right;min-width:24px}
.pbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar div{height:100%}
.p1{background:var(--mint)} .px{background:var(--muted2)} .p2{background:var(--blue)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end}
.overlay.on{display:flex}
.modal{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.close{position:absolute;top:14px;right:18px;font-size:22px;color:var(--muted);cursor:pointer}
.section{margin-bottom:18px}
.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.probrow{display:flex;gap:8px;margin-bottom:6px}
.probchip{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.probchip .l{font-size:11px;color:var(--muted)}
.probchip .v{font-size:18px;font-weight:700;margin-top:2px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.prow .pn{flex:1;font-size:13px}
.prow .pp{font-size:11px;color:var(--muted2)}
.prow .stat{font-size:13px;font-weight:700;color:var(--mint);min-width:44px;text-align:right}
.ai{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;color:#dbe3ee}
.ai.loading{color:var(--muted)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20}
.bnbtn{flex:1;text-align:center;padding:10px 0 8px;color:var(--muted);font-size:11px;cursor:pointer}
.bnbtn.on{color:var(--mint)}
.bnbtn .ic{font-size:18px;display:block;margin-bottom:2px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--mint)}
</style>
</head>
<body>

<div class="top">
  <h1>⚽ Match Insights</h1>
  <div class="tabs" id="dayTabs"></div>
</div>

<div class="wrap" id="view"></div>

<div class="bottomnav">
  <div class="bnbtn on" id="nav-matches" onclick="setPage('matches')"><span class="ic">⚽</span>Matches</div>
  <div class="bnbtn" id="nav-players" onclick="setPage('players')"><span class="ic">👤</span>Players</div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal" style="position:relative"></div>
</div>

<script>
const API = 'https://wk2026-proxy.isaak-elia.workers.dev';
let MATCHES = [], PLAYERS = [], page = 'matches', selDate = null;
let groupOpen = {};

function isLive(m){ return m.live || m.status === 'live'; }
function isDone(m){ return m.finished || m.status === 'played'; }

function fmtTime(t){ return t || ''; }

async function loadMatches(){
  try{
    const res = await fetch(API + '/matches');
    const d = await res.json();
    MATCHES = d.matches || [];
  }catch(e){ MATCHES = []; }
  buildDayTabs();
  render();
}

async function loadPlayers(){
  if(PLAYERS.length) return;
  try{
    const res = await fetch(API + '/players');
    const d = await res.json();
    PLAYERS = d.players || [];
  }catch(e){ PLAYERS = []; }
}

function buildDayTabs(){
  const dates = [...new Set(MATCHES.map(m=>m.date))].sort();
  if(!dates.length){ document.getElementById('dayTabs').innerHTML = ''; return; }
  if(!selDate || !dates.includes(selDate)) selDate = dates[0];
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('dayTabs').innerHTML = dates.map(d=>{
    const label = d === today ? 'Today' : new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="tab ${d===selDate?'on':''}" onclick="selDate='${d}';render()">${label}</div>`;
  }).join('');
}

function probs(m){
  // Model-kansen komen via /predict per wedstrijd; voor de lijst-kaart tonen
  // we alleen wat we al hebben (geen aparte fetch per kaart).
  return m._probs || null;
}

function render(){
  if(page !== 'matches') return;
  const ms = MATCHES.filter(m=>m.date===selDate).sort((a,b)=>a.time.localeCompare(b.time));
  const el = document.getElementById('view');
  if(!ms.length){ el.innerHTML = '<div class="empty">No matches for this day.</div>'; return; }

  const groups = new Map();
  for(const m of ms){
    const key = m.compName || 'Other';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  const keys = [...groups.keys()].sort();
  el.innerHTML = keys.map((key, idx)=>{
    const list = groups.get(key);
    if(!(key in groupOpen)) groupOpen[key] = true;
    const open = groupOpen[key];
    const cards = list.map(m=>{
      const live = isLive(m), done = isDone(m);
      let statusHtml, scoreHtml;
      if(live){ statusHtml = '<div class="status live">● LIVE</div>'; }
      else if(done){ statusHtml = '<div class="status ft">FT</div>'; }
      else { statusHtml = `<div class="status">${fmtTime(m.time)}</div>`; }
      if(m.result){
        const [hs,as] = m.result.split('-');
        scoreHtml = `<div class="score">${hs}<br>${as}</div>`;
      } else {
        scoreHtml = `<div class="score" style="font-size:11px;color:var(--muted)">${fmtTime(m.time)}</div>`;
      }
      const hW = m.result && +m.result.split('-')[0] > +m.result.split('-')[1];
      const aW = m.result && +m.result.split('-')[1] > +m.result.split('-')[0];
      return `<div class="card" onclick="openMatch('${m.apiId}')">
        <div class="teams">
          <div class="trow"><span class="n ${hW?'w':''}">${m.h}</span></div>
          <div class="trow"><span class="n ${aW?'w':''}">${m.a}</span></div>
        </div>
        ${statusHtml}
        ${scoreHtml}
      </div>`;
    }).join('');
    return `<div class="comp-group">
      <div class="comp-hdr" onclick="groupOpen['${key}']=!groupOpen['${key}'];render()">
        <span class="flag">⚽</span>
        <span class="name">${key}</span>
        <span class="count">${list.length}</span>
        <span class="chev ${open?'open':''}">›</span>
      </div>
      ${open ? cards : ''}
    </div>`;
  }).join('');
}

async function openMatch(apiId){
  const m = MATCHES.find(x=>x.apiId===apiId);
  if(!m) return;
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <span class="close" onclick="closeModal()">✕</span>
    <h2>${m.h} vs ${m.a}</h2>
    <div class="sub">${m.compName || ''} · ${m.date} ${m.time}</div>
    <div class="section" id="predict-section">
      <h3>Win probability</h3>
      <div class="probrow"><div class="probchip"><div class="l">Loading…</div></div></div>
    </div>
  `;
  document.getElementById('overlay').classList.add('on');

  try{
    const res = await fetch(`${API}/predict?apiId=${encodeURIComponent(apiId)}`);
    const d = await res.json();
    if(d.error){
      document.getElementById('predict-section').innerHTML = `<h3>Win probability</h3><div class="empty" style="padding:12px 0">${d.error}</div>`;
      return;
    }
    const p1 = Math.round(d.model.pHome*100), px = Math.round(d.model.pDraw*100), p2 = 100-p1-px;
    const playerRow = p => `<div class="prow"><div class="pn">${p.name}<div class="pp">${p.pos||''} · ${p.apps} apps · ${p.goals} goals, ${p.assists} assists</div></div><div class="stat">${p.shots90}<div class="pp">${p.sot90} on target</div></div></div>`;
    document.getElementById('predict-section').innerHTML = `
      <h3>Win probability</h3>
      <div class="probrow">
        <div class="probchip"><div class="l">${m.h}</div><div class="v">${p1}%</div></div>
        <div class="probchip"><div class="l">Draw</div><div class="v">${px}%</div></div>
        <div class="probchip"><div class="l">${m.a}</div><div class="v">${p2}%</div></div>
      </div>
      <div class="pbar"><div class="p1" style="width:${p1}%"></div><div class="px" style="width:${px}%"></div><div class="p2" style="width:${p2}%"></div></div>
    `;
    let extra = '';
    if(d.players.home.length || d.players.away.length){
      extra += `<div class="section"><h3>${m.h} — shots per 90</h3><div class="plist">${d.players.home.map(playerRow).join('') || '<div class="empty" style="padding:8px 0">No player data yet</div>'}</div></div>`;
      extra += `<div class="section"><h3>${m.a} — shots per 90</h3><div class="plist">${d.players.away.map(playerRow).join('') || '<div class="empty" style="padding:8px 0">No player data yet</div>'}</div></div>`;
    }
    if(d.analysis){
      extra += `<div class="section"><h3>Analysis</h3><div class="ai">${d.analysis}</div></div>`;
    }
    modal.insertAdjacentHTML('beforeend', extra);
  }catch(e){
    document.getElementById('predict-section').innerHTML = `<h3>Win probability</h3><div class="empty" style="padding:12px 0">Could not load prediction.</div>`;
  }
}

function closeModal(){ document.getElementById('overlay').classList.remove('on'); }

async function renderPlayers(){
  await loadPlayers();
  const el = document.getElementById('view');
  el.innerHTML = `<input class="search" id="playerSearch" placeholder="Search player…" oninput="filterPlayers(this.value)">
    <div class="plist" id="playerList"></div>`;
  filterPlayers('');
}

function filterPlayers(q){
  q = (q||'').toLowerCase();
  const list = PLAYERS.filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>b.shots90-a.shots90).slice(0,100);
  document.getElementById('playerList').innerHTML = list.length ? list.map(p=>`
    <div class="prow">
      <div class="pn">${p.name}<div class="pp">${p.team} · ${p.compName||''} · ${p.goals}g ${p.assists}a in ${p.apps} apps</div></div>
      <div class="stat">${p.shots90}<div class="pp">sh/90 (${p.sot90} on target)</div></div>
    </div>
  `).join('') : '<div class="empty">No players found.</div>';
}

function setPage(p){
  page = p;
  document.getElementById('nav-matches').classList.toggle('on', p==='matches');
  document.getElementById('nav-players').classList.toggle('on', p==='players');
  document.getElementById('dayTabs').style.display = p==='matches' ? 'flex' : 'none';
  if(p==='matches') render();
  else renderPlayers();
}

loadMatches();
setInterval(loadMatches, 60000);
</script>
</body>
</html>
