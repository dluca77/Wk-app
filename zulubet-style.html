<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voetbal Voorspellingen Vandaag</title>
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:rgba(255,255,255,0.08);--text:#f0f4ff;--muted:#8892a4;--accent:#f97316;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.header h1{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.header .date-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.date-btn{padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.date-btn:hover,.date-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stats-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:16px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.stats-bar span{display:flex;align-items:center;gap:4px}
.stats-bar b{color:var(--text)}
.container{max-width:1100px;margin:0 auto;padding:16px}
.league-group{margin-bottom:20px}
.league-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.league-flag{font-size:16px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden}
thead tr{background:var(--surface2)}
th{padding:8px 10px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;border-bottom:1px solid var(--border)}
th:nth-child(1){text-align:left;width:80px}
th:nth-child(2){text-align:left}
td{padding:9px 10px;border-bottom:0.5px solid var(--border);text-align:center;font-size:13px}
td:nth-child(1){text-align:left;font-size:11px;color:var(--muted);white-space:nowrap}
td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.teams{display:flex;flex-direction:column;gap:2px}
.team-name{font-weight:500;color:var(--text);font-size:13px}
.pct-bar{display:flex;height:18px;border-radius:4px;overflow:hidden;width:100%;min-width:120px}
.p1{background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:20px}
.px{background:#374151;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);min-width:20px}
.p2{background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:20px}
.tip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.04em}
.tip-1{background:rgba(249,115,22,.15);color:var(--accent);border:1px solid rgba(249,115,22,.3)}
.tip-x{background:rgba(55,65,81,.5);color:#9ca3af;border:1px solid rgba(156,163,175,.2)}
.tip-2{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.tip-1x{background:rgba(249,115,22,.1);color:#fb923c;border:1px solid rgba(249,115,22,.2)}
.tip-x2{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
.tip-12{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.score{font-weight:700;color:var(--green);font-size:13px}
.score.upcoming{color:var(--muted);font-size:11px}
.odds-cell{font-size:11px;color:var(--muted);line-height:1.6}
.odds-cell span{display:block}
.odds-cell .o1{color:var(--accent)}
.odds-cell .ox{color:var(--muted)}
.odds-cell .o2{color:var(--blue)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:40vh;gap:14px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:16px;color:#fca5a5;margin:20px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.usage{font-size:10px;color:var(--muted);text-align:right;padding:8px 20px}
@media(max-width:600px){
  .header{padding:12px 14px}
  .container{padding:10px}
  th:nth-child(4),td:nth-child(4){display:none}
  .pct-bar{min-width:80px}
  .header h1{font-size:16px}
}
</style>
</head>
<body>

<div class="header">
  <h1>⚽ Voetbal Voorspellingen</h1>
  <div class="date-nav" id="dateNav"></div>
</div>
<div class="stats-bar" id="statsBar">
  <span>Laden...</span>
</div>
<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div>Wedstrijden ophalen...</div>
  </div>
</div>
<div class="usage" id="usage"></div>

<script>
const API_KEY = '7ff792f8f666cf1a4fcee93169f2638e';
const BASE = 'https://api.the-odds-api.com/v4';

// Alle voetbal sport keys van The Odds API
const SOCCER_SPORTS = [
  'soccer_fifa_world_cup',
  'soccer_epl',
  'soccer_spain_la_liga',
  'soccer_germany_bundesliga',
  'soccer_italy_serie_a',
  'soccer_france_ligue_one',
  'soccer_netherlands_eredivisie',
  'soccer_portugal_primeira_liga',
  'soccer_turkey_super_liga',
  'soccer_brazil_campeonato',
  'soccer_argentina_primera_division',
  'soccer_conmebol_copa_libertadores',
  'soccer_uefa_champs_league',
  'soccer_uefa_europa_league',
  'soccer_mls',
  'soccer_mexico_ligamx',
  'soccer_belgium_first_div',
  'soccer_scotland_premiership',
];

const LEAGUE_NAMES = {
  'soccer_fifa_world_cup': {name:'WK 2026', flag:'🌍'},
  'soccer_epl': {name:'Premier League', flag:'🏴'},
  'soccer_spain_la_liga': {name:'La Liga', flag:'🇪🇸'},
  'soccer_germany_bundesliga': {name:'Bundesliga', flag:'🇩🇪'},
  'soccer_italy_serie_a': {name:'Serie A', flag:'🇮🇹'},
  'soccer_france_ligue_one': {name:'Ligue 1', flag:'🇫🇷'},
  'soccer_netherlands_eredivisie': {name:'Eredivisie', flag:'🇳🇱'},
  'soccer_portugal_primeira_liga': {name:'Primeira Liga', flag:'🇵🇹'},
  'soccer_turkey_super_liga': {name:'Süper Lig', flag:'🇹🇷'},
  'soccer_brazil_campeonato': {name:'Brasileirão', flag:'🇧🇷'},
  'soccer_argentina_primera_division': {name:'Liga Argentina', flag:'🇦🇷'},
  'soccer_conmebol_copa_libertadores': {name:'Copa Libertadores', flag:'🏆'},
  'soccer_uefa_champs_league': {name:'Champions League', flag:'⭐'},
  'soccer_uefa_europa_league': {name:'Europa League', flag:'🟠'},
  'soccer_mls': {name:'MLS', flag:'🇺🇸'},
  'soccer_mexico_ligamx': {name:'Liga MX', flag:'🇲🇽'},
  'soccer_belgium_first_div': {name:'Jupiler Pro League', flag:'🇧🇪'},
  'soccer_scotland_premiership': {name:'Scottish Premiership', flag:'🏴'},
};

let allMatches = [];
let selectedDate = getTodayStr();
let requestsLeft = '?';

function getTodayStr(){
  return new Date().toISOString().split('T')[0];
}

function getDateStr(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split('T')[0];
}

function formatDateLabel(str){
  const d = new Date(str+'T12:00:00');
  const today = getTodayStr();
  const tomorrow = getDateStr(1);
  const yesterday = getDateStr(-1);
  if(str===today) return 'Vandaag';
  if(str===tomorrow) return 'Morgen';
  if(str===yesterday) return 'Gisteren';
  return d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
}

function oddsToProb(o){ return o ? Math.round(100/o) : 0; }

function calcProbs(h,d,a){
  const raw1=oddsToProb(h), rawX=oddsToProb(d), raw2=oddsToProb(a);
  const total=raw1+rawX+raw2||100;
  const p1=Math.round(raw1/total*100);
  const px=Math.round(rawX/total*100);
  const p2=100-p1-px;
  return {p1,px,p2};
}

function getTip(p1,px,p2){
  const max=Math.max(p1,px,p2);
  const threshold=5;
  if(max===p1){
    if(px>p1-threshold) return {tip:'1X',cls:'tip-1x'};
    return {tip:'1',cls:'tip-1'};
  }
  if(max===p2){
    if(px>p2-threshold) return {tip:'X2',cls:'tip-x2'};
    return {tip:'2',cls:'tip-2'};
  }
  if(p1>p2) return {tip:'1X',cls:'tip-1x'};
  return {tip:'X2',cls:'tip-x2'};
}

function matchDate(commence_time){
  return new Date(commence_time).toISOString().split('T')[0];
}

function matchTime(commence_time){
  const d = new Date(commence_time);
  return d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Amsterdam'});
}

async function fetchSport(sport){
  try{
    const url=`${BASE}/sports/${sport}/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h&oddsFormat=decimal&dateFormat=iso`;
    const r = await fetch(url);
    if(!r.ok) return [];
    const remaining = r.headers.get('x-requests-remaining');
    if(remaining) requestsLeft = remaining;
    const data = await r.json();
    return (data||[]).map(m=>({...m, sport}));
  }catch(e){ return []; }
}

async function loadAll(){
  document.getElementById('app').innerHTML=`<div class="loading"><div class="spinner"></div><div>Wedstrijden ophalen van alle competities...</div></div>`;
  
  // First get available sports
  try{
    const sportsUrl=`${BASE}/sports/?apiKey=${API_KEY}`;
    const sr = await fetch(sportsUrl);
    if(sr.ok){
      const sports = await sr.json();
      const soccerSports = sports.filter(s=>s.group==='Soccer'&&s.active).map(s=>s.key);
      // fetch all soccer sports in parallel (max 15 at a time to save requests)
      const toFetch = soccerSports.slice(0,15);
      const results = await Promise.all(toFetch.map(fetchSport));
      allMatches = results.flat();
    }
  }catch(e){
    // fallback to predefined list
    const results = await Promise.all(SOCCER_SPORTS.map(fetchSport));
    allMatches = results.flat();
  }

  buildDateNav();
  renderDate(selectedDate);
  document.getElementById('usage').textContent=`API requests resterend: ${requestsLeft}`;
}

function buildDateNav(){
  const dates = new Set();
  allMatches.forEach(m=>dates.add(matchDate(m.commence_time)));
  const sorted=[...dates].sort();
  
  // Always show yesterday, today, tomorrow + any dates with matches
  const navDates = new Set([getDateStr(-1), getTodayStr(), getDateStr(1)]);
  sorted.forEach(d=>navDates.add(d));
  const navSorted=[...navDates].sort().slice(0,7);
  
  const nav = document.getElementById('dateNav');
  nav.innerHTML = navSorted.map(d=>`
    <button class="date-btn ${d===selectedDate?'active':''}" onclick="selectDate('${d}')">
      ${formatDateLabel(d)}
    </button>`).join('');
}

function selectDate(d){
  selectedDate=d;
  buildDateNav();
  renderDate(d);
}

function renderDate(date){
  const app = document.getElementById('app');
  const filtered = allMatches.filter(m=>matchDate(m.commence_time)===date);
  
  if(filtered.length===0){
    app.innerHTML=`<div class="empty">Geen wedstrijden gevonden voor ${formatDateLabel(date)}.</div>`;
    updateStats([]);
    return;
  }

  // Group by sport/league
  const groups = {};
  filtered.forEach(m=>{
    const key = m.sport;
    if(!groups[key]) groups[key]=[];
    groups[key].push(m);
  });

  // Sort groups: WK first, then alphabetical
  const sortedKeys = Object.keys(groups).sort((a,b)=>{
    if(a.includes('world_cup')) return -1;
    if(b.includes('world_cup')) return 1;
    return (LEAGUE_NAMES[a]?.name||a).localeCompare(LEAGUE_NAMES[b]?.name||b);
  });

  let html = '';
  let totalMatches=0, totalTips={1:0,X:0,2:0,'1X':0,'X2':0,'12':0};

  sortedKeys.forEach(sport=>{
    const matches = groups[sport].sort((a,b)=>new Date(a.commence_time)-new Date(b.commence_time));
    const info = LEAGUE_NAMES[sport] || {name:sport.replace(/soccer_/,'').replace(/_/g,' ').toUpperCase(), flag:'⚽'};
    
    html+=`<div class="league-group">
      <div class="league-header">
        <span class="league-flag">${info.flag}</span>
        <span>${info.name}</span>
        <span style="margin-left:auto;font-size:10px">${matches.length} wedstrijd${matches.length!==1?'en':''}</span>
      </div>
      <table>
        <thead><tr>
          <th>Tijd</th>
          <th>Wedstrijd</th>
          <th>Kansen</th>
          <th>Tip</th>
          <th>Odds</th>
        </tr></thead>
        <tbody>`;

    matches.forEach(m=>{
      totalMatches++;
      const h2h = m.bookmakers?.[0]?.markets?.find(mk=>mk.key==='h2h');
      const outcomes = h2h?.outcomes||[];
      const homeO = outcomes.find(o=>o.name===m.home_team)?.price;
      const awayO = outcomes.find(o=>o.name===m.away_team)?.price;
      const drawO = outcomes.find(o=>o.name==='Draw')?.price;

      if(!homeO||!awayO){
        html+=`<tr>
          <td>${matchTime(m.commence_time)}</td>
          <td><div class="teams"><span class="team-name">${m.home_team}</span><span class="team-name" style="color:var(--muted)">${m.away_team}</span></div></td>
          <td colspan="3" style="color:var(--muted);font-size:11px">Geen odds beschikbaar</td>
        </tr>`;
        return;
      }

      const {p1,px,p2} = calcProbs(homeO, drawO, awayO);
      const {tip,cls} = getTip(p1,px,p2);
      totalTips[tip]=(totalTips[tip]||0)+1;

      const now = new Date();
      const start = new Date(m.commence_time);
      const isLive = now>start && now<new Date(start.getTime()+115*60000);
      const isDone = now>new Date(start.getTime()+115*60000);

      html+=`<tr>
        <td>${matchTime(m.commence_time)}${isLive?'<br><span style="color:var(--green);font-size:9px;font-weight:700">LIVE</span>':''}</td>
        <td><div class="teams">
          <span class="team-name">${m.home_team}</span>
          <span class="team-name" style="color:var(--muted);font-size:12px">${m.away_team}</span>
        </div></td>
        <td>
          <div class="pct-bar">
            <div class="p1" style="width:${p1}%">${p1>12?p1+'%':''}</div>
            <div class="px" style="width:${px}%">${px>12?px+'%':''}</div>
            <div class="p2" style="width:${p2}%">${p2>12?p2+'%':''}</div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px">
            <span>${p1}%</span><span>${px}%</span><span>${p2}%</span>
          </div>
        </td>
        <td><span class="${cls} tip">${tip}</span></td>
        <td class="odds-cell">
          <span class="o1">1: ${homeO?.toFixed(2)||'-'}</span>
          ${drawO?`<span class="ox">X: ${drawO?.toFixed(2)}</span>`:''}
          <span class="o2">2: ${awayO?.toFixed(2)||'-'}</span>
        </td>
      </tr>`;
    });

    html+=`</tbody></table></div>`;
  });

  app.innerHTML=html;
  updateStats(filtered, totalMatches, totalTips);
}

function updateStats(matches, total=0, tips={}){
  const bar = document.getElementById('statsBar');
  if(!total){bar.innerHTML=`<span>Geen wedstrijden</span>`;return;}
  const tip1=tips['1']||0, tipX=tips['X']||0, tip2=tips['2']||0;
  const tip1x=tips['1X']||0, tipx2=tips['X2']||0, tip12=tips['12']||0;
  bar.innerHTML=`
    <span>📅 <b>${formatDateLabel(selectedDate)}</b></span>
    <span>⚽ <b>${total}</b> wedstrijden</span>
    <span style="color:var(--accent)">1: <b>${tip1+tip1x}</b></span>
    <span style="color:var(--muted)">X: <b>${tipX}</b></span>
    <span style="color:var(--blue)">2: <b>${tip2+tipx2}</b></span>
  `;
}

// Auto refresh every 5 minutes
loadAll();
setInterval(loadAll, 5*60*1000);
</script>
</body>
</html>
