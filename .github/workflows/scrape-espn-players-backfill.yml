name: Backfill spelersstatistieken vorig seizoen (ESPN)

# Eenmalige (of handmatig te herhalen) momentopname van vorig seizoen —
# GEEN cron, alleen handmatig te draaien. Landt in een aparte KV-key
# (players_espn_prev) die de dagelijkse live-cron (scrape-espn-players.yml)
# nooit aanraakt. Het spelerprofiel toont dit als "Vorig seizoen"-blok.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape ESPN spelersdata (vorig seizoen)
        env:
          SEASON: '2025'
        run: node scripts/scrape-espn-players.mjs > espn-players-prev.json
      - name: Stuur naar Worker
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS -X POST "https://wk2026-proxy.isaak-elia.workers.dev/ingest-players?key=$CLEAN_SECRET&source=espn_prev" \
            -H "Content-Type: application/json" \
            --data @espn-players-prev.json
