name: Scrape spelersstatistieken (Understat)

# Understat.com rendert de statistiektabellen via client-side JS, dus een
# gewone curl-scrape (zoals scrape-global.yml) werkt hier niet. Deze workflow
# gebruikt Playwright + headless Chromium om de pagina's echt te renderen.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installeer Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Scrape Understat spelersdata
        run: node scripts/scrape-players.mjs > players.json
      - name: Stuur naar Worker
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS -X POST "https://wk2026-proxy.isaak-elia.workers.dev/ingest-players?key=$CLEAN_SECRET" \
            -H "Content-Type: application/json" \
            --data @players.json
