name: Probe live data source

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Sofascore
        run: |
          echo "=== live events ==="
          curl -sS -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/sport/football/events/live" -o live.json -w "HTTP %{http_code}\n" || true
          echo "size: $(wc -c < live.json 2>/dev/null || echo 0)"
          python3 -c "
import json
try:
  d = json.load(open('live.json'))
  ev = d.get('events', [])
  print('num events:', len(ev))
  if ev:
    e = ev[0]
    print(json.dumps(e, indent=2)[:3000])
except Exception as ex:
  print('parse error:', ex)
  print(open('live.json').read()[:1500])
"
