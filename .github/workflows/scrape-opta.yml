name: Scrape wedstrijden + spelerstats (Opta)

# Enige databron van de app: de publieke backend van Stats Perform's
# "Betting Showcase"-widget (optaplayerstats.statsperform.com). Geen
# API-key nodig, maar wel Akamai-botdetectie die kale HTTP-clients vanaf
# datacenter-IP's blokkeert (HTTP 403) — vandaar Playwright + headless
# Chromium hier, zie scripts/scrape-opta.mjs voor de toelichting.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installeer Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Scrape Opta wedstrijden + spelerstats
        run: node scripts/scrape-opta.mjs > opta-data.json
      - name: Stuur naar Worker
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS -X POST "https://wk2026-proxy.isaak-elia.workers.dev/ingest-opta?key=$CLEAN_SECRET" \
            -H "Content-Type: application/json" \
            --data @opta-data.json
