name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Inspecteer odds-structuur in homepage-widget
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sS -A "$UA" "https://www.betexplorer.com/" -o /tmp/home.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          python3 - << 'PYEOF'
          content = open('/tmp/home.html', encoding='utf-8', errors='ignore').read()
          idx = content.find('data-ts="')
          print(content[idx:idx+3500])
          PYEOF
      - name: Volledige systeemcontrole
        run: |
          echo "=== /matches: totalen per bron ==="
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/matches" -o /tmp/matches.json
          python3 -c "
          import json
          from collections import Counter
          d = json.load(open('/tmp/matches.json'))
          ms = d.get('matches', d) if isinstance(d, dict) else d
          if isinstance(ms, dict): ms = list(ms.values())
          print('totaal:', len(ms))
          print(Counter(m.get('source') for m in ms))
          today = [m for m in ms if m.get('date')=='2026-08-16']
          print(len(today), 'wedstrijden vandaag')
          finished_today = [m for m in today if m.get('finished')]
          print(len(finished_today), 'daarvan afgelopen, met result:', sum(1 for m in finished_today if m.get('result')))
          for m in today[:5]:
              print(' ', m.get('date'), m.get('time'), m.get('compName'), m.get('h'),'vs',m.get('a'),'finished:',m.get('finished'),'result:',m.get('result'))
          "
          echo "=== /odds sample ==="
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/odds" -o /tmp/odds.json
          python3 -c "
          import json
          d = json.load(open('/tmp/odds.json'))
          print(len(d.get('matches',{})), 'wedstrijden met odds')
          "
          echo "=== /ai-analyse test (Eredivisie-match) ==="
          EREID=$(python3 -c "
          import json
          d = json.load(open('/tmp/matches.json'))
          ms = d.get('matches', d) if isinstance(d, dict) else d
          if isinstance(ms, dict): ms = list(ms.values())
          ered=[m for m in ms if m.get('compName')=='Eredivisie']
          print(ered[0]['apiId'] if ered else '')
          ")
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/ai-analyse?apiId=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$EREID")" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          print('heeft analyse:', bool(d.get('analysis')))
          print('analyse-snippet:', (d.get('analysis') or d.get('error') or '')[:150])
          "
          echo "=== /crest sample (bekende club) ==="
          curl -sSI "https://wk2026-proxy.isaak-elia.workers.dev/crest?team=Ajax" | head -3
          echo "=== /debug ==="
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/debug"
