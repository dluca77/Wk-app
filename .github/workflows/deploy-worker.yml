name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG probe live data sources
        run: |
          echo "=== Sofascore live ==="
          curl -sS -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/sport/football/events/live" -o live.json -w "HTTP %{http_code}\n"
          wc -c live.json
          python3 -c "
import json
try:
  d = json.load(open('live.json'))
  ev = d.get('events', [])
  print('num events:', len(ev))
  if ev: print(json.dumps(ev[0], indent=2)[:2500])
except Exception as ex:
  print('parse error:', ex)
  print(open('live.json').read()[:1000])
"
          echo "=== Sofascore scheduled today ==="
          curl -sS -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/sport/football/scheduled-events/$(date +%F)" -o sched.json -w "HTTP %{http_code}\n"
          wc -c sched.json
          python3 -c "
import json
try:
  d = json.load(open('sched.json'))
  ev = d.get('events', [])
  print('num scheduled:', len(ev))
except Exception as ex:
  print('parse error:', ex)
  print(open('sched.json').read()[:500])
"
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
