name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Zoek odds1x2-seed-URLs voor overige 8 competities
        run: |
          python3 -c "
          import urllib.request, urllib.parse, json, re

          candidates = {
            'Champions League':  ['/football/champions-league/', '/football/europe-champions-league/'],
            'Europa League':     ['/football/europa-league/', '/football/europe-europa-league/'],
            'Conference League': ['/football/europa-conference-league/', '/football/europe-conference-league/'],
            'Premier League':    ['/football/england-premier-league/'],
            'La Liga':           ['/football/spain-la-liga/', '/football/spain-primera-division/'],
            'Bundesliga':        ['/football/germany-bundesliga/'],
            'Serie A':           ['/football/italy-serie-a/'],
            'Ligue 1':           ['/football/france-ligue-1/', '/football/france-ligue-one/'],
          }

          for name, paths in candidates.items():
              found = False
              for path in paths:
                  url = 'https://wk2026-proxy.isaak-elia.workers.dev/debug-scrape?url=' + urllib.parse.quote('https://www.odds1x2.com' + path, safe='') + '&offset=0&len=60000'
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          d = json.loads(r.read())
                  except Exception as e:
                      print(name, path, '-> FETCH FAIL', e)
                      continue
                  html = d.get('snippet', '')
                  status = d.get('status')
                  links = re.findall(r'/football/[a-z0-9-]+/odds/[a-z0-9-]+-vs-[a-z0-9-]+/', html)
                  uniq = sorted(set(links))
                  print(name, path, '-> status', status, 'len', d.get('length'), '| odds-links gevonden:', len(uniq))
                  for l in uniq[:3]:
                      print('    ', l)
                  if uniq:
                      found = True
                      break
              if not found:
                  print(name, '-> GEEN WERKENDE SEED GEVONDEN in geprobeerde paden')
              print()
          "
