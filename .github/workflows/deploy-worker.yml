name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Probe Understat met Playwright (headless Chromium)
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
          cat > ./probe.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          await page.goto('https://understat.com/team/Liverpool/2025', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForSelector('table', { timeout: 15000 }).catch(() => console.log('geen <table> gevonden binnen 15s'));
          const tableCount = await page.locator('table').count();
          console.log('=== aantal <table> elementen:', tableCount, '===');
          for (let i = 0; i < tableCount; i++) {
            const html = await page.locator('table').nth(i).evaluate(el => el.outerHTML.slice(0, 3000));
            console.log(`--- table[${i}] (eerste 3000 chars) ---`);
            console.log(html);
          }
          await browser.close();
          EOF
          node ./probe.mjs
