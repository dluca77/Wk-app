name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Diepere check BetExplorer en SoccerStats
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== BetExplorer Bundesliga fixtures pagina: wedstrijd-links ==="
          curl -sS -A "$UA" "https://www.betexplorer.com/football/germany/bundesliga/" -o /tmp/be1.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          grep -oE 'href="/football/germany/bundesliga/[a-z0-9-]+/"' /tmp/be1.html | sort -u | head -10
          echo "aantal wedstrijd-links:"
          grep -ocE 'href="/football/germany/bundesliga/[a-z0-9-]+/[a-zA-Z0-9]+/"' /tmp/be1.html || true
          echo "--- fixtures/results tabel aanwezig? ---"
          grep -ocE 'class="table-main' /tmp/be1.html
          echo "=== BetExplorer: individuele match pagina zoeken + H2H check ==="
          MLINK=$(grep -oE 'href="/football/germany/bundesliga/[a-z0-9-]+/[a-zA-Z0-9]+/"' /tmp/be1.html | sort -u | head -1 | sed 's/href="//;s/"$//')
          echo "matchlink: $MLINK"
          if [ -n "$MLINK" ]; then
            curl -sS -A "$UA" "https://www.betexplorer.com$MLINK" -o /tmp/be2.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
            echo "H2H/previous-matches hits:"
            grep -ciE "head-to-head|h2h|previous matches|mutual matches" /tmp/be2.html || true
          fi
          echo "=== SoccerStats Bundesliga: fixtures/uitslagen check ==="
          curl -sS -A "$UA" "https://www.soccerstats.com/latest.asp?league=germany" -o /tmp/ss1.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          grep -oE '[A-Z][a-zA-Z .]+ [0-9]-[0-9] [A-Z][a-zA-Z .]+' /tmp/ss1.html | head -10
          echo "=== SoccerStats: fixtures voor komende ronde ==="
          curl -sS -A "$UA" "https://www.soccerstats.com/results.asp?league=germany" -o /tmp/ss2.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          grep -oE '[A-Z][a-zA-Z .]{2,20}</td>' /tmp/ss2.html | sort -u | head -15
