name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG probe ESPN core API (teams/roster/athlete stats)
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== core API teams lijst (Eredivisie) ==="
          curl -sS -A "$UA" "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ned.1/teams?lang=en&region=us&limit=50" -o cteams.json -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < cteams.json)"
          head -c 800 cteams.json; echo ""
          FIRST_TEAM_URL=$(python3 -c "
          import json
          try:
              d = json.load(open('cteams.json'))
              items = d.get('items',[])
              print(items[0]['\$ref'] if items else '')
          except Exception as e:
              print('')
          ")
          echo "eerste team ref: $FIRST_TEAM_URL"
          if [ -n "$FIRST_TEAM_URL" ]; then
            curl -sS -A "$UA" "$FIRST_TEAM_URL" -o cteam1.json -w "HTTP %{http_code}\n"
            echo "size: $(wc -c < cteam1.json)"
            ATHLETES_URL=$(python3 -c "
          import json
          try:
              d = json.load(open('cteam1.json'))
              print(d.get('athletes',{}).get('\$ref',''))
          except Exception as e:
              print('')
          ")
            echo "athletes ref: $ATHLETES_URL"
            if [ -n "$ATHLETES_URL" ]; then
              curl -sS -A "$UA" "${ATHLETES_URL}&limit=50" -o cathletes.json -w "HTTP %{http_code}\n"
              echo "size: $(wc -c < cathletes.json)"
              head -c 600 cathletes.json; echo ""
              FIRST_ATH_URL=$(python3 -c "
          import json
          try:
              d = json.load(open('cathletes.json'))
              items = d.get('items',[])
              print(items[0]['\$ref'] if items else '')
          except Exception as e:
              print('')
          ")
              echo "eerste athlete ref: $FIRST_ATH_URL"
              if [ -n "$FIRST_ATH_URL" ]; then
                curl -sS -A "$UA" "$FIRST_ATH_URL" -o cath1.json -w "HTTP %{http_code}\n"
                echo "size: $(wc -c < cath1.json)"
                python3 -c "
          import json
          try:
              d = json.load(open('cath1.json'))
              print('naam:', d.get('displayName'))
              print('stats ref:', d.get('statistics',{}).get('\$ref'))
          except Exception as e:
              print('parse error:', e)
              print(open('cath1.json').read()[:400])
          "
              fi
            fi
          fi
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
