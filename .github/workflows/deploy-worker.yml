name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: DEBUG probe FotMob (match-detail + API)
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== fotmob.com homepage ==="
          curl -sS -A "$UA" -o /tmp/fm.html -w 'HTTP_STATUS:%{http_code}  SIZE:%{size_download}\n' "https://www.fotmob.com/"
          grep -oc 'Just a moment\|cf-browser-verification\|captcha' /tmp/fm.html
          echo "=== fotmob API: matches vandaag ==="
          curl -sS -A "$UA" -o /tmp/fm_api.json -w 'HTTP_STATUS:%{http_code}  SIZE:%{size_download}\n' \
            "https://www.fotmob.com/api/matches?date=$(date +%Y%m%d)"
          head -c 500 /tmp/fm_api.json
          echo
          echo "=== fotmob API: match-details voorbeeld (matchId 4193490) ==="
          curl -sS -A "$UA" -o /tmp/fm_detail.json -w 'HTTP_STATUS:%{http_code}  SIZE:%{size_download}\n' \
            "https://www.fotmob.com/api/matchDetails?matchId=4193490"
          head -c 800 /tmp/fm_detail.json
          exit 0
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
