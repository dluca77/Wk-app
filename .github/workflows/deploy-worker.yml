name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG probe betexplorer player data
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== homepage: vind een match-href ==="
          curl -sS -A "$UA" "https://www.betexplorer.com/" -o home.html
          HREF=$(grep -oE 'href="/football/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+/[a-zA-Z0-9]+/"' home.html | head -1 | sed -E 's/href="//;s/"$//')
          echo "gevonden match href: $HREF"
          echo "=== matchpagina ophalen ==="
          curl -sS -A "$UA" "https://www.betexplorer.com${HREF}" -o match.html
          echo "size: $(wc -c < match.html)"
          echo "=== zoek naar scorer/lineup/player-indicaties ==="
          grep -oiE '(scorer|lineup|substitut|player|minute)[a-z0-9_-]*' match.html | sort | uniq -c | sort -rn | head -30
          echo "=== competitie standings/stats pagina proberen ==="
          curl -sS -A "$UA" "https://www.betexplorer.com/football/england/premier-league/standings/" -o standings.html -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < standings.html)"
          grep -oiE '(top[- ]?scorer|goalscorer|player)[a-z0-9_ -]*' standings.html | sort | uniq -c | sort -rn | head -20
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
