name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG probe ESPN leaders + roster + athlete stats
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== ESPN leaders v2 (Eredivisie) ==="
          curl -sS -A "$UA" "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ned.1/leaders?lang=en&region=us" -o leaders.json -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < leaders.json)"
          head -c 1200 leaders.json
          echo ""
          echo "=== ESPN teams (Eredivisie) ==="
          curl -sS -A "$UA" "https://site.api.espn.com/apis/site/v2/sports/soccer/ned.1/teams" -o teams.json -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < teams.json)"
          python3 -c "
          import json
          try:
              d = json.load(open('teams.json'))
              teams = d.get('sports',[{}])[0].get('leagues',[{}])[0].get('teams',[])
              print('aantal teams:', len(teams))
              if teams: print('eerste team:', teams[0].get('team',{}).get('displayName'), teams[0].get('team',{}).get('id'))
          except Exception as e:
              print('parse error:', e)
              print(open('teams.json').read()[:500])
          "
          echo "=== ESPN roster (1 team) ==="
          TEAM_ID=$(python3 -c "
          import json
          d = json.load(open('teams.json'))
          teams = d.get('sports',[{}])[0].get('leagues',[{}])[0].get('teams',[])
          print(teams[0]['team']['id'] if teams else '')
          ")
          echo "team id: $TEAM_ID"
          curl -sS -A "$UA" "https://site.api.espn.com/apis/site/v2/sports/soccer/ned.1/teams/$TEAM_ID/roster" -o roster.json -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < roster.json)"
          python3 -c "
          import json
          try:
              d = json.load(open('roster.json'))
              print('top keys:', list(d.keys())[:10])
              ath = d.get('athletes',[])
              print('aantal spelersgroepen/spelers:', len(ath))
              print(json.dumps(ath, indent=2)[:1200])
          except Exception as e:
              print('parse error:', e)
              print(open('roster.json').read()[:500])
          "
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
