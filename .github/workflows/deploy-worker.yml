name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: DEBUG probe /ai-bet meerdere wedstrijden
        run: |
          run_case () {
            NAME="$1"; PROMPT="$2"
            echo "=== $NAME ==="
            jq -n --arg p "$PROMPT" '{prompt: $p}' > /tmp/payload.json
            curl -sS -X POST "https://wk2026-proxy.isaak-elia.workers.dev/ai-bet" \
              -H "Content-Type: application/json" \
              --data @/tmp/payload.json \
              -w '\nHTTP_STATUS:%{http_code}\n' | head -c 400
            echo
          }
          run_case "Eredivisie" "Je bent een sportsbetting analist voor Eredivisie. WEDSTRIJD: Ajax vs PSV. PRE-BEREKENDE KANSEN: 1X2 | Ajax wint | 50%. Geef 2 tips. Antwoord ALLEEN in dit JSON formaat: [{\"label\":\"Tip 1\",\"tip\":\"<tip>\",\"onderdelen\":[{\"bet\":\"<bet>\",\"kans\":60}],\"gecombineerde_kans\":60,\"onderbouwing\":\"<zin>\",\"risico\":\"laag|middel\"}]"
          run_case "Premier League" "Je bent een sportsbetting analist voor Premier League. WEDSTRIJD: Liverpool vs Arsenal. PRE-BEREKENDE KANSEN: 1X2 | Liverpool wint | 55%, BTTS | JA | 60%. Geef 3 tips. Antwoord ALLEEN in dit JSON formaat: [{\"label\":\"Tip 1\",\"tip\":\"<tip>\",\"onderdelen\":[{\"bet\":\"<bet>\",\"kans\":60}],\"gecombineerde_kans\":60,\"onderbouwing\":\"<zin>\",\"risico\":\"laag|middel\"}]"
          run_case "La Liga" "Je bent een sportsbetting analist voor La Liga. WEDSTRIJD: Valencia vs Real Betis. PRE-BEREKENDE KANSEN: 1X2 | Gelijkspel | 30%, O/U | Over 2.5 | 45%. Geef 2 tips. Antwoord ALLEEN in dit JSON formaat: [{\"label\":\"Tip 1\",\"tip\":\"<tip>\",\"onderdelen\":[{\"bet\":\"<bet>\",\"kans\":50}],\"gecombineerde_kans\":50,\"onderbouwing\":\"<zin>\",\"risico\":\"laag|middel\"}]"
          run_case "WK-landenwedstrijd" "Je bent een sportsbetting analist voor het WK. WEDSTRIJD: Nederland vs Brazilie. Geen pre-berekende kansen beschikbaar, geen spelersdata. Geef 1 tip op basis van algemene kennis. Antwoord ALLEEN in dit JSON formaat: [{\"label\":\"Tip 1\",\"tip\":\"<tip>\",\"onderdelen\":[{\"bet\":\"<bet>\",\"kans\":50}],\"gecombineerde_kans\":50,\"onderbouwing\":\"<zin>\",\"risico\":\"laag|middel\"}]"
      - name: DEBUG probe CL/EL/ECL volledige lijst (return-wedstrijden check)
        run: |
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/matches" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          for cid,label in [(7,'CL'),(679,'EL'),(17015,'ECL')]:
              print('---', label, '---')
              for m in sorted([m for m in d['matches'] if m.get('compId')==cid], key=lambda x:(x.get('date') or '', x.get('time') or '')):
                  print(m.get('date'), m.get('time'), '|', m.get('h'), 'vs', m.get('a'), '|', m.get('source'))
          "
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
