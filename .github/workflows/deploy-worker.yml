name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Verifieer zelf-vernieuwende seed + Ajax vs Heerenveen
        run: |
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/matches" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          matches = d.get('matches', [])
          eredivisie = [m for m in matches if str(m.get('compId')) == '37' and m.get('source') == 'odds1x2']
          print('Eredivisie (odds1x2) aantal:', len(eredivisie))
          for m in eredivisie:
              print(' -', m.get('h'), 'vs', m.get('a'), '|', m.get('date'), m.get('time'))
          ajax = [m for m in matches if 'ajax' in m.get('h','').lower() or 'ajax' in m.get('a','').lower()]
          print()
          print('Ajax-wedstrijden gevonden:', len(ajax))
          for m in ajax:
              print(' -', json.dumps(m, ensure_ascii=False))
          "
