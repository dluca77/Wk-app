name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG probe fbref.com
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== Eredivisie stats-pagina ==="
          curl -sS -A "$UA" "https://fbref.com/en/comps/23/Eredivisie-Stats" -o ere.html -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < ere.html)"
          echo "aantal <table>: $(grep -oc '<table' ere.html || true)"
          grep -oE 'id="stats_standard[^"]*"' ere.html | head -5
          echo "--- fragment rond eerste speler-rij (comment-embedded tabellen mogelijk) ---"
          grep -o '<!--' ere.html | wc -l
          echo "=== 2e verzoek direct erna (check rate-limit) ==="
          curl -sS -A "$UA" "https://fbref.com/en/comps/8/La-Liga-Stats" -o laliga.html -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < laliga.html)"
          echo "=== 3e verzoek direct erna ==="
          curl -sS -A "$UA" "https://fbref.com/en/comps/8/Champions-League-Stats" -o cl.html -w "HTTP %{http_code}\n"
          echo "size: $(wc -c < cl.html)"
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
