name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Analyseer wedstrijden per datum en competitie
        run: |
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/matches" -o /tmp/matches.json
          cat > /tmp/analyze.py << 'PYEOF'
          import json
          from collections import Counter
          d = json.load(open('/tmp/matches.json'))
          ms = d.get('matches', d) if isinstance(d, dict) else d
          if isinstance(ms, dict): ms = list(ms.values())
          print('totaal:', len(ms))
          bydate = Counter(m.get('date') for m in ms)
          print('=== aantal wedstrijden per datum (top 15, gesorteerd op datum) ===')
          for date in sorted(bydate)[:40]:
              print(date, bydate[date])
          print('=== wedstrijden vandaag (2026-08-16) per competitie ===')
          today = [m for m in ms if m.get('date') == '2026-08-16']
          bycomp = Counter(m.get('compName') for m in today)
          for comp, cnt in bycomp.items():
              print(comp, cnt)
          print('=== lijst wedstrijden vandaag ===')
          for m in today:
              print(m.get('compName'), '-', m.get('h'), 'vs', m.get('a'), m.get('time'), 'source:', m.get('source'))
          print('=== per competitie: laagste en hoogste datum in dataset ===')
          bycompall = {}
          for m in ms:
              c = m.get('compName')
              bycompall.setdefault(c, []).append(m.get('date'))
          for c, dates in bycompall.items():
              dates = sorted(d for d in dates if d)
              if dates:
                  print(c, 'van', dates[0], 'tot', dates[-1], f'({len(dates)} wedstrijden)')
          PYEOF
          python3 /tmp/analyze.py
