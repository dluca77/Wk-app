name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Test alle voorgestelde bronnen (bot-bescherming check)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          test_site() {
            NAME="$1"; URL="$2"
            CODE=$(curl -sS -A "$UA" "$URL" -o /tmp/site.html -w "%{http_code}")
            SIZE=$(wc -c < /tmp/site.html)
            BLOCKED=$(grep -ciE "just a moment|cf-chl|captcha|access denied|are you human|checking your browser" /tmp/site.html || true)
            echo "$NAME -> HTTP:$CODE SIZE:$SIZE BOTCHECK-HITS:$BLOCKED"
          }
          test_site "OddsPortal" "https://www.oddsportal.com/football/germany/bundesliga/"
          test_site "BetExplorer" "https://www.betexplorer.com/football/germany/bundesliga/"
          test_site "Forebet" "https://www.forebet.com/en/football-predictions/predictions-1x2-germany-bundesliga"
          test_site "SoccerStats" "https://www.soccerstats.com/latest.asp?league=germany"
          test_site "Flashscore" "https://www.flashscore.com/football/germany/bundesliga/"
          test_site "RebelBetting" "https://rebelbetting.com/"
          echo "=== Als een site niet geblokkeerd is, toon eerste 40 regels ruwe HTML ter inspectie ==="
