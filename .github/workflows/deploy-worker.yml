name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Onderzoek Forebet als bron voor ontbrekende competities + H2H
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          echo "=== Forebet Bundesliga fixtures pagina ==="
          curl -sS -A "$UA" "https://www.forebet.com/en/football-predictions/predictions-1x2-germany-bundesliga" -o /tmp/fb1.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          grep -ocE "predictions/" /tmp/fb1.html
          grep -oE "/en/football-tips-and-predictions/[a-z0-9-]+" /tmp/fb1.html | sort -u | head -10
          echo "=== Forebet homepage robots/structuur check ==="
          curl -sS -A "$UA" "https://www.forebet.com/en/football-predictions/today" -o /tmp/fb2.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          grep -oE "/en/[a-z0-9/-]+" /tmp/fb2.html | sort -u | head -20
          echo "=== Forebet H2H check (zoek naar head to head / previous matches op een matchpagina) ==="
          MATCHLINK=$(grep -oE "/en/football-tips-and-predictions/[a-z0-9-]+" /tmp/fb2.html | sort -u | head -1)
          echo "matchlink: $MATCHLINK"
          if [ -n "$MATCHLINK" ]; then
            curl -sS -A "$UA" "https://www.forebet.com$MATCHLINK" -o /tmp/fb3.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
            grep -ciE "head.to.head|h2h|last matches|previous meetings" /tmp/fb3.html
          fi
          echo "=== robots.txt check ==="
          curl -sS -A "$UA" "https://www.forebet.com/robots.txt"
