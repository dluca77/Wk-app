name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: DEBUG probe /ai-bet met echte prompt
        run: |
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
          Je bent een sportsbetting analist voor Champions League. Alle kansen zijn wiskundig berekend met Poisson - gebruik deze EXACT.
          WEDSTRIJD: Fenerbahce vs Lyon (Champions League, 2026-08-18 21:00 NL)
          PRE-BEREKENDE KANSEN (gebruik deze exact, verzin niets):
          1X2 | Fenerbahce wint | 55%
          BTTS | Beide teams scoren: JA | 62%
          OPDRACHT: Geef 3 tips voor deze wedstrijd, elk een aparte bet-combinatie.
          Antwoord ALLEEN in dit JSON formaat (array van tips):
          [{"label":"Tip 1","tip":"<concrete tip>","onderdelen":[{"bet":"<bet>","kans":60}],"gecombineerde_kans":60,"onderbouwing":"<1-2 zinnen>","risico":"laag|middel"}]
          PROMPT_EOF
          for MODEL in "@cf/meta/llama-3.1-8b-instruct" "@cf/meta/llama-3.3-70b-instruct-fp8-fast" "@cf/qwen/qwen1.5-14b-chat-awq" "@cf/mistralai/mistral-small-3.1-24b-instruct"; do
            echo "=== $MODEL ==="
            jq -Rs --arg m "$MODEL" '{prompt: ., model: $m}' /tmp/prompt.txt > /tmp/payload.json
            curl -sS -X POST "https://wk2026-proxy.isaak-elia.workers.dev/ai-bet" \
              -H "Content-Type: application/json" \
              --data @/tmp/payload.json \
              -w '\nHTTP_STATUS:%{http_code}\n' | head -c 500
            echo
          done
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
