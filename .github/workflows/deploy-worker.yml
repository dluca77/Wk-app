name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Inspecteer odds1x2 competitiepagina v2
        run: |
          for U in \
            "https%3A%2F%2Fwww.odds1x2.com%2Ffootball%2Fholland-eredivisie%2Fodds%2F" \
            "https%3A%2F%2Fwww.odds1x2.com%2Ffootball%2Fholland-eredivisie%2Fodds%2Ffc-zwolle-vs-ajax%2F" \
          ; do
            echo "=== $U ==="
            curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/debug-scrape?url=$U&offset=0&len=300000" | python3 -c "
          import json, sys, re
          d = json.load(sys.stdin)
          html = d.get('snippet','')
          print('length=', d.get('length'), 'status=', d.get('status'))
          m = re.search(r'(<[^>]*class=\"[^\"]*odds-line[^\"]*\"[^>]*>.{0,1500})', html, re.S)
          print('EERSTE ODDS-LINE BLOK:')
          print(m.group(1) if m else 'NIET GEVONDEN')
          print()
          hrefs = re.findall(r'href=\"(/football/holland-eredivisie/odds/[^\"]+)\"', html)
          print('GEVONDEN WEDSTRIJD-LINKS:', list(dict.fromkeys(hrefs))[:10])
          nums = re.findall(r'\b\d\.\d{2}\b', html)
          print('AANTAL ODDS-GETALLEN:', len(nums), nums[:15])
          "
          done
