name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Test LiveScore.com
        run: |
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/debug-scrape?url=https%3A%2F%2Fwww.livescore.com%2Fen%2Ffootball%2Fnetherlands%2Feredivisie%2F&offset=0&len=400000" | python3 -c "
          import json, sys, re
          d = json.load(sys.stdin)
          html = d.get('snippet','')
          print('status=', d.get('status'), 'length=', d.get('length'))
          # zoek een match-achtig patroon: team vs team met score/tijd
          m = re.search(r'(Ajax[\s\S]{0,600})', html)
          print('CONTEXT ROND Ajax:')
          print(m.group(1) if m else 'NIET GEVONDEN')
          print()
          # zoek naar JSON data embedded in de pagina (veel sites embedden __NEXT_DATA__ of vergelijkbaar)
          idx2 = html.find('__NEXT_DATA__')
          idx3 = html.find('window.__INITIAL_STATE__')
          print('__NEXT_DATA__ idx:', idx2, '| __INITIAL_STATE__ idx:', idx3)
          "
