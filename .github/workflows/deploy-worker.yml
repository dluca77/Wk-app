name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize Cloudflare secrets
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$CLEAN_ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
      - name: Ververs live data
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/refresh?key=$CLEAN_SECRET"
      - name: Diepe scan wedstrijdschema-bronnen
        run: |
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/debug-scrape?url=https%3A%2F%2Feredivisie.com%2Fcompetition%2Ffixtures%2F&offset=0&len=250000" | python3 -c "
          import json, sys, re
          d = json.load(sys.stdin)
          html = d.get('snippet','')
          print('length=', d.get('length'))
          idx = html.find('Ajax')
          print('CONTEXT ROND EERSTE Ajax (idx=' + str(idx) + '):')
          print(html[max(0,idx-800):idx+800] if idx != -1 else 'NIET GEVONDEN')
          "
          echo "--- skysports ---"
          curl -sS "https://wk2026-proxy.isaak-elia.workers.dev/debug-scrape?url=https%3A%2F%2Fwww.skysports.com%2Feredivisie-scores-fixtures&offset=0&len=600000" | python3 -c "
          import json, sys, re
          d = json.load(sys.stdin)
          html = d.get('snippet','')
          print('length=', d.get('length'))
          idx = html.find('Ajax')
          print('CONTEXT ROND EERSTE Ajax (idx=' + str(idx) + '):')
          print(html[max(0,idx-800):idx+800] if idx != -1 else 'NIET GEVONDEN')
          "
