name: Scrape spelersstatistieken (ESPN)

# ESPN's onofficiële "core" API (sports.core.api.espn.com) is plain JSON,
# geen rendering nodig — dus geen Playwright zoals bij Understat. Dekt
# competities die Understat niet heeft (bv. Eredivisie). Geen xG, wel
# goals/assists/schoten/kaarten. Zie scripts/scrape-espn-players.mjs.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape ESPN spelersdata
        run: node scripts/scrape-espn-players.mjs > espn-players.json
      - name: Stuur naar Worker
        env:
          RAW_SECRET: ${{ secrets.WORKER_REFRESH_SECRET }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          curl -sS -X POST "https://wk2026-proxy.isaak-elia.workers.dev/ingest-players?key=$CLEAN_SECRET&source=espn" \
            -H "Content-Type: application/json" \
            --data @espn-players.json
